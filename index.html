        // --- SECTION 6: IN-CONTENT FILTERING ---
        function handleContentFilterKeydown(e) {
            if (e.key === "Escape") {
                e.preventDefault();
                clearContentFilter();
            }
        }

        function getDirectText(el) {
            const clone = el.cloneNode(true);
            clone.querySelectorAll("ul, ol").forEach(ul => ul.remove());
            return clone.textContent.replace(/\s+/g, ' ').trim();
        }

        // Helper function to escape special Regex characters
        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        // Removes search highlight tags and restores clean original text nodes
        function removeHighlights(container) {
            const marks = Array.from(container.querySelectorAll("mark.search-highlight"));
            if (marks.length === 0) return;

            marks.forEach(mark => {
                const parent = mark.parentNode;
                if (parent) {
                    parent.replaceChild(document.createTextNode(mark.textContent), mark);
                }
            });
            container.normalize();
        }

        // Applies search term highlighting inside text nodes using DocumentFragments
        function applyHighlights(el, terms) {
            if (terms.length === 0) return;
            const regex = new RegExp(`(${terms.map(escapeRegExp).join('|')})`, 'gi');

            const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, {
                acceptNode: (node) => {
                    if (!node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
                    if (node.parentElement && (
                        node.parentElement.tagName === 'SCRIPT' || 
                        node.parentElement.tagName === 'STYLE' || 
                        node.parentElement.tagName === 'BUTTON' || 
                        node.parentElement.classList.contains('search-highlight')
                    )) {
                        return NodeFilter.FILTER_REJECT;
                    }
                    return NodeFilter.FILTER_ACCEPT;
                }
            });

            const textNodes = [];
            let currentNode;
            while (currentNode = walker.nextNode()) {
                textNodes.push(currentNode);
            }

            textNodes.forEach(node => {
                const text = node.nodeValue;
                if (regex.test(text)) {
                    const frag = document.createDocumentFragment();
                    let lastIdx = 0;
                    regex.lastIndex = 0;
                    let match;
                    while ((match = regex.exec(text)) !== null) {
                        if (match.index > lastIdx) {
                            frag.appendChild(document.createTextNode(text.substring(lastIdx, match.index)));
                        }
                        const mark = document.createElement("mark");
                        mark.className = "search-highlight";
                        mark.textContent = match[0];
                        frag.appendChild(mark);
                        lastIdx = regex.lastIndex;
                    }
                    if (lastIdx < text.length) {
                        frag.appendChild(document.createTextNode(text.substring(lastIdx)));
                    }
                    node.parentNode.replaceChild(frag, node);
                }
            });
        }

        function handleContentFilter(filterQuery) {
            const clearBtn = document.getElementById("clearContentFilterBtn");
            const q = filterQuery.trim();
            const viewer = document.getElementById("content-viewer");
            if (!viewer) return;

            if (q.length > 0 && scrollPercentBeforeFilter === null) {
                const maxScroll = viewer.scrollHeight - viewer.clientHeight;
                if (maxScroll > 0) {
                    scrollPercentBeforeFilter = (viewer.scrollTop / maxScroll) * 100;
                } else {
                    scrollPercentBeforeFilter = 0;
                }
            }

            if (q.length > 0) {
                clearBtn.classList.remove("hidden");
            } else {
                clearBtn.classList.add("hidden");
            }

            // Always remove previous highlights first
            removeHighlights(viewer);

            const allBlocks = viewer.querySelectorAll("h1, h2, h3, h4, h5, h6, p, li, blockquote, table, pre");

            if (!q) {
                viewer.querySelectorAll("h1, h2, h3, h4, h5, h6, p, li, blockquote, table, pre, ul, ol, div").forEach(el => {
                    el.style.display = "";
                    el.classList.remove("cursor-pointer", "hover:bg-gray-700/40", "rounded", "px-1", "transition-colors", "bg-emerald-900/60");
                    el.title = "";
                });

                // Restore scroll position when filter is cleared
                if (scrollPercentBeforeFilter !== null) {
                    const targetPercent = scrollPercentBeforeFilter;
                    scrollPercentBeforeFilter = null;
                    requestAnimationFrame(() => {
                        const maxScroll = viewer.scrollHeight - viewer.clientHeight;
                        if (maxScroll > 0) {
                            viewer.scrollTop = (targetPercent / 100) * maxScroll;
                        }
                    });
                }

                if (typeof viewer.onscroll === 'function') {
                    viewer.onscroll();
                }
                return;
            }

            // Extract search terms for text highlighting
            const searchTerms = [];
            q.toLowerCase().split(/\b(?:or|oder)\b/).forEach(clause => {
                const cleanClause = clause.replace(/\b(?:and|und)\b/g, " ");
                cleanClause.split(/\s+/).filter(t => t.length > 0).forEach(term => {
                    if (!searchTerms.includes(term)) searchTerms.push(term);
                });
            });

            const matchingSet = new Set();
            allBlocks.forEach(el => {
                const text = el.tagName === 'LI' ? getDirectText(el) : el.textContent;
                if (matchQuery(text.toLowerCase(), filterQuery)) {
                    matchingSet.add(el);
                }
            });

            let currentHeading = null;
            const headingToMatchedBlocks = new Map();

            allBlocks.forEach(el => {
                if (/^H[1-7]$/.test(el.tagName)) {
                    currentHeading = el;
                } else {
                    if (currentHeading && matchingSet.has(el)) {
                        if (!headingToMatchedBlocks.has(currentHeading)) {
                            headingToMatchedBlocks.set(currentHeading, new Set());
                        }
                        headingToMatchedBlocks.get(currentHeading).add(el);
                    }
                }
            });

            const visibleElements = new Set();

            allBlocks.forEach(el => {
                if (/^H[1-7]$/.test(el.tagName)) {
                    if (matchingSet.has(el) || headingToMatchedBlocks.has(el)) {
                        visibleElements.add(el);
                    }
                } else {
                    if (matchingSet.has(el)) {
                        visibleElements.add(el);
                    }
                }
            });

            visibleElements.forEach(el => {
                let parent = el.parentElement;
                while (parent && parent !== viewer) {
                    visibleElements.add(parent);
                    parent = parent.parentElement;
                }
            });

            viewer.querySelectorAll("h1, h2, h3, h4, h5, h6, p, li, blockquote, table, pre, ul, ol, div").forEach(el => {
                if (visibleElements.has(el)) {
                    el.style.display = "";
                    const tag = el.tagName;
                    if (tag !== 'TABLE' && tag !== 'UL' && tag !== 'OL' && tag !== 'DIV') {
                        el.classList.add("cursor-pointer", "hover:bg-gray-700/40", "rounded", "px-1", "transition-colors");
                        el.title = currentLang === "de" ? "Klicken, um zum Original im Text zu springen" : "Click to jump to original in text";
                        
                        // Apply term highlights to matching visible text blocks
                        applyHighlights(el, searchTerms);
                    }
                } else {
                    el.style.display = "none";
                    el.classList.remove("cursor-pointer", "hover:bg-gray-700/40", "rounded", "px-1", "transition-colors");
                    el.title = "";
                }
            });

            if (typeof viewer.onscroll === 'function') {
                viewer.onscroll();
            }
        }

        function clearContentFilter() {
            const input = document.getElementById("contentFilterInput");
            input.value = "";
            handleContentFilter("");
            document.getElementById("clearContentFilterBtn").classList.add("hidden");
            
            const viewer = document.getElementById("content-viewer");
            if (viewer && typeof viewer.onscroll === 'function') {
                viewer.onscroll();
            }

            setTimeout(() => {
                if (isDesktopDevice()) input.focus();
            }, 0);
        }

        // --- SECTION 7: FILE & MARKDOWN CONTENT LOADING ---
        async function loadFile(filePath, isExternal = false, isHistoryNav = false) {
            // CRITICAL TIMING FIX: If a filter is currently active, fully clear it first
            // so the cached scroll position is properly written back to the current file's localStorage before switching.
            const filterInput = document.getElementById("contentFilterInput");
            if (filterInput && filterInput.value.trim().length > 0) {
                clearContentFilter();
                // Await a brief animation frame to ensure DOM reflow and scroll restoration finish
                await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
            }

            isRestoringScroll = true;
            scrollPercentBeforeFilter = null; 
            const urlParams = new URLSearchParams(window.location.search);
            const scrollParam = urlParams.get('scroll');

            const rawSavedPercent = (isHistoryNav && scrollParam !== null) ? scrollParam : localStorage.getItem(`sgs_scroll_percent_${filePath}`);
            targetPercentToRestore = rawSavedPercent !== null ? parseFloat(rawSavedPercent) : null;

            currentFilePath = filePath;
            localStorage.setItem("sgs_last_file", filePath);

            if (!isHistoryNav && history.pushState) {
                const baseUrl = window.location.href.split('?')[0].split('#')[0];
                const cleanUrl = `${baseUrl}?file=${encodeURIComponent(filePath)}`;
                history.pushState({ file: filePath }, '', cleanUrl);
            }

            trackRecentFile(filePath);
            updateActiveFileInTree();

            // Dynamic SEO Updates for loaded solution files
            const cleanGameTitle = getCleanGameTitle();
            if (cleanGameTitle) {
                document.title = `${cleanGameTitle} - Walkthrough & Guide | Simple Game Solutions`;
                let metaDesc = document.querySelector('meta[name="description"]');
                if (metaDesc) {
                    metaDesc.setAttribute("content", `Comprehensive walkthrough, solutions, and hints for ${cleanGameTitle} on Simple Game Solutions.`);
                }
            }

            const viewer = document.getElementById("content-viewer");
            const tocContainer = document.getElementById("toc-container");
            const scrollProgressBar = document.getElementById("scrollProgressBar");
            const readingHeader = document.getElementById("readingPaneHeader");
            if (readingHeader) readingHeader.classList.remove("hidden");
            if (filterInput) filterInput.value = "";
            document.getElementById("clearContentFilterBtn").classList.add("hidden");

            if (scrollProgressBar) scrollProgressBar.style.width = "0%";
            viewer.innerHTML = `<p class="text-gray-400 animate-pulse text-sm">${translations[currentLang].loadingFile}</p>`;
            tocContainer.innerHTML = `<p class="text-gray-500 italic text-xs">${translations[currentLang].analyzing}</p>`;
            try {
                const response = await fetch(`solutions/${filePath}`);
                if (!response.ok) throw new Error(translations[currentLang].fileNotFound);
                rawFileContent = await response.text();
                renderFileContent(rawFileContent, filePath);
                
                if (filterInput && isDesktopDevice()) {
                    setTimeout(() => {
                        filterInput.focus();
                    }, 0);
                }
            } catch (error) {
                rawFileContent = null;
                if (readingHeader) readingHeader.classList.add("hidden");
                viewer.innerHTML = `<p class="text-red-400 text-sm">${translations[currentLang].errorLoadingFile} ${filePath}</p>`;
                tocContainer.innerHTML = `<p class="text-red-400 text-xs">${translations[currentLang].noFileLoaded}</p>`;
                isRestoringScroll = false;
            }
        }

        function renderFileContent(text, filePath) {
            const viewer = document.getElementById("content-viewer");
            const tocContainer = document.getElementById("toc-container");

            if (filePath.endsWith(".md")) {
                viewer.innerHTML = marked.parse(text);
            } else {
                viewer.innerHTML = `<pre class="whitespace-pre-wrap font-mono text-xs sm:text-sm bg-gray-950 p-4 rounded">${escapeHtml(text)}</pre>`;
            }
            postProcessViewer(viewer);
            generateToc(viewer, tocContainer);
            setupScrollSpy(viewer, tocContainer);

            // Restore scroll position using saved percentage after DOM rendering completes
            if (window.location.hash) {
                setTimeout(() => {
                    const targetId = window.location.hash.substring(1);
                    const targetEl = document.getElementById(targetId);
                    if (targetEl) {
                        targetEl.scrollIntoView({ behavior: "smooth", block: "start" });
                    }
                    isRestoringScroll = false;
                }, 150);
            } else {
                const applyScrollPercentage = () => {
                    if (targetPercentToRestore !== null && !isNaN(targetPercentToRestore)) {
                        const maxScroll = viewer.scrollHeight - viewer.clientHeight;
                        if (maxScroll > 0) {
                            viewer.scrollTop = (targetPercentToRestore / 100) * maxScroll;
                        }
                    }
                };

                // Double animation-frame pass to guarantee full height layout calculation before scroll adjustment
                requestAnimationFrame(() => {
                    applyScrollPercentage();
                    requestAnimationFrame(() => {
                        applyScrollPercentage();
                        setTimeout(() => {
                            applyScrollPercentage();
                            isRestoringScroll = false;
                        }, 100);
                    });
                });
            }
        }

        function postProcessViewer(viewer) {
            viewer.querySelectorAll("a").forEach(link => {
                link.setAttribute("target", "_blank");
                link.setAttribute("rel", "noopener noreferrer");
                link.className = "text-emerald-400 hover:underline";
            });
        }

        function escapeHtml(text) {
            return text.replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
        }

        // --- SECTION 8: DIRECTORY TREE MENU RENDERING ---
        function createFileTreeCopyButton(filePath) {
            const copyBtn = document.createElement("button");
            copyBtn.className = `file-copy-btn inline-flex items-center ml-2 opacity-70 sm:opacity-0 sm:group-hover/tree:opacity-100 transition-opacity text-emerald-400 hover:text-emerald-300 text-sm cursor-pointer focus:outline-none align-middle relative shrink-0`;
            copyBtn.title = translations[currentLang].copyFileLinkTitle;

            const iconSpan = document.createElement("span");
            iconSpan.className = "inline-block w-6 text-center";
            iconSpan.textContent = "🔗";

            const popupSpan = document.createElement("span");
            popupSpan.className = "absolute right-full mr-2 px-2 py-0.5 bg-gray-800 text-emerald-300 text-xs rounded shadow-lg whitespace-nowrap opacity-0 pointer-events-none border border-gray-700 z-50";
            popupSpan.textContent = translations[currentLang].linkCopied;

            copyBtn.appendChild(iconSpan);
            copyBtn.appendChild(popupSpan);

            let copyTimeout = null;

            copyBtn.onclick = (e) => {
                e.stopPropagation();
                const baseUrl = window.location.href.split('?')[0].split('#')[0];
                let cleanUrl = `${baseUrl}?file=${encodeURIComponent(filePath)}`;

                navigator.clipboard.writeText(cleanUrl).then(() => {
                    iconSpan.textContent = "✓";
                    popupSpan.textContent = translations[currentLang].linkCopied;

                    copyBtn.style.transition = 'none';
                    popupSpan.style.transition = 'none';
                    copyBtn.style.opacity = "1";
                    popupSpan.style.opacity = "1";

                    void popupSpan.offsetWidth;

                    if (copyTimeout) clearTimeout(copyTimeout);
                    copyTimeout = setTimeout(() => {
                        copyBtn.style.transition = 'opacity 500ms ease';
                        popupSpan.style.transition = 'opacity 500ms ease';
                        popupSpan.style.opacity = "0";
                        copyBtn.style.opacity = "0";

                        setTimeout(() => {
                            iconSpan.textContent = "🔗";
                            copyBtn.style.opacity = "";
                            copyBtn.style.transition = "";
                            popupSpan.style.transition = "";
                        }, 500);
                    }, 1500);
                });
            };
            return copyBtn;
        }

        function renderTree(node, container, filterQuery = "") {
            container.innerHTML = "";
            const query = filterQuery.trim();

            function filterNode(item) {
                const nameLower = item.name.toLowerCase();
                const matches = matchQuery(nameLower, query);
                if (item.type === "file") {
                    return matches ? {
                        ...item
                    } : null
                } else if (item.type === "directory") {
                    const matchingChildren = (item.children || []).map(child => filterNode(child)).filter(child => child !== null);
                    if (matches || matchingChildren.length > 0) {
                        return {
                            ...item,
                            children: matchingChildren
                        }
                    }
                }
                return null
            }
            let displayNode = node;
            if (query !== "") {
                const filteredChildren = (node.children || []).map(child => filterNode(child)).filter(child => child !== null);
                if (filteredChildren.length === 0) {
                    container.innerHTML = `<p class="text-gray-500 italic text-xs py-2">${translations[currentLang].noResults}</p>`;
                    return
                }
                displayNode = {
                    ...node,
                    children: filteredChildren
                }
            }

            function buildNode(item, parentEl) {
                if (item.type === "directory") {
                    const details = document.createElement("details");
                    details.className = "ml-1 my-1";
                    details.open = query !== "";
                    const summary = document.createElement("summary");
                    summary.className = "cursor-pointer font-medium text-emerald-300 hover:text-emerald-200 py-1 px-2 rounded hover:bg-gray-700/50 select-none break-words";
                    summary.textContent = `📁 ${item.name}`;
                    details.appendChild(summary);
                    const childrenContainer = document.createElement("div");
                    childrenContainer.className = "pl-3 border-l border-gray-700 ml-2 space-y-1 mt-1";
                    item.children = item.children || [];
                    item.children.forEach(child => buildNode(child, childrenContainer));
                    details.appendChild(childrenContainer);
                    parentEl.appendChild(details)
                } else if (item.type === "file") {
                    const isActive = (item.path === currentFilePath);
                    const fileRow = document.createElement("div");
                    fileRow.dataset.filepath = item.path;
                    fileRow.className = isActive 
                        ? "flex items-center justify-between w-full py-1.5 px-2 rounded bg-gray-700 text-white font-medium transition-colors break-words group/tree"
                        : "flex items-center justify-between w-full py-1.5 px-2 rounded hover:bg-gray-700 text-gray-300 hover:text-white transition-colors break-words group/tree";

                    const fileLink = document.createElement("div");
                    fileLink.className = "flex-1 text-left cursor-pointer break-words";
                    fileLink.textContent = `📄 ${item.name}`;

                    const copyBtn = createFileTreeCopyButton(item.path);

                    fileRow.appendChild(fileLink);
                    fileRow.appendChild(copyBtn);
                    parentEl.appendChild(fileRow);
                }
            }
            if (displayNode.children) {
                displayNode.children.forEach(child => buildNode(child, container))
            }
        }

        function filterTree(query) {
            if (structureData) {
                renderTree(structureData, document.getElementById("tree-container"), query)
            }
        }

        function updateActiveFileInTree() {
            const container = document.getElementById("tree-container");
            if (!container) return;

            let targetRow = null;

            container.querySelectorAll("div[data-filepath]").forEach(row => {
                const isActive = (row.dataset.filepath === currentFilePath);
                if (isActive) {
                    row.className = "flex items-center justify-between w-full py-1.5 px-2 rounded bg-gray-700 text-white font-medium transition-colors break-words group/tree";
                    targetRow = row;
                } else {
                    row.className = "flex items-center justify-between w-full py-1.5 px-2 rounded hover:bg-gray-700 text-gray-300 hover:text-white transition-colors break-words group/tree";
                }
            });

            if (targetRow) {
                let parentDetails = targetRow.closest("details");
                while (parentDetails) {
                    parentDetails.open = true;
                    parentDetails = parentDetails.parentElement ? parentDetails.parentElement.closest("details") : null;
                }
                setTimeout(() => {
                    targetRow.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                }, 50);
            }
        }

        // --- SECTION 9: TABLE OF CONTENTS (TOC) & SCROLL SPY ---
        function createCopyButton(headingId, isToc = false) {
            const copyBtn = document.createElement("button");
            copyBtn.className = `${isToc ? 'toc-copy-btn' : 'heading-copy-btn'} inline-flex items-center ${isToc ? 'ml-2' : 'mr-2'} opacity-70 sm:opacity-0 sm:group-hover${isToc ? '/toc' : ''}:opacity-100 transition-opacity text-emerald-400 hover:text-emerald-300 text-sm cursor-pointer focus:outline-none align-middle relative shrink-0`;
            copyBtn.title = translations[currentLang].copyChapterLinkTitle;

            const iconSpan = document.createElement("span");
            iconSpan.className = "inline-block w-6 text-center";
            iconSpan.textContent = "🔗";

            const popupSpan = document.createElement("span");
            if (isToc) {
                popupSpan.className = "absolute right-full mr-2 px-2 py-0.5 bg-gray-800 text-emerald-300 text-xs rounded shadow-lg whitespace-nowrap opacity-0 pointer-events-none border border-gray-700 z-50";
            } else {
                popupSpan.className = "absolute left-full ml-2 px-2 py-0.5 bg-gray-800 text-emerald-300 text-xs rounded shadow-lg whitespace-nowrap opacity-0 pointer-events-none border border-gray-700 z-50";
            }
            popupSpan.textContent = translations[currentLang].linkCopied;

            copyBtn.appendChild(iconSpan);
            copyBtn.appendChild(popupSpan);

            let copyTimeout = null;

            copyBtn.onclick = (e) => {
                e.stopPropagation();
                const baseUrl = window.location.href.split('?')[0].split('#')[0];
                const filterInput = document.getElementById("contentFilterInput");
                const filterVal = filterInput ? filterInput.value.trim() : "";
                const searchInput = document.getElementById("searchInput");
                const searchVal = searchInput ? searchInput.value.trim() : "";
                
                let cleanUrl = `${baseUrl}?file=${encodeURIComponent(currentFilePath)}`;
                if (filterVal) {
                    cleanUrl += `&filter=${encodeURIComponent(filterVal)}`;
                }
                if (searchVal) {
                    cleanUrl += `&search=${encodeURIComponent(searchVal)}`;
                }
                cleanUrl += `#${headingId}`;

                navigator.clipboard.writeText(cleanUrl).then(() => {
                    iconSpan.textContent = "✓";
                    popupSpan.textContent = translations[currentLang].linkCopied;

                    copyBtn.style.transition = 'none';
                    popupSpan.style.transition = 'none';
                    copyBtn.style.opacity = "1";
                    popupSpan.style.opacity = "1";

                    void popupSpan.offsetWidth;

                    if (copyTimeout) clearTimeout(copyTimeout);
                    copyTimeout = setTimeout(() => {
                        copyBtn.style.transition = 'opacity 500ms ease';
                        popupSpan.style.transition = 'opacity 500ms ease';
                        popupSpan.style.opacity = "0";
                        copyBtn.style.opacity = "0";

                        setTimeout(() => {
                            iconSpan.textContent = "🔗";
                            copyBtn.style.opacity = "";
                            copyBtn.style.transition = "";
                            popupSpan.style.transition = "";
                        }, 500);
                    }, 1500);
                });
            };
            return copyBtn;
        }

        function generateToc(contentViewer, tocContainer) {
            tocContainer.innerHTML = "";
            const headings = contentViewer.querySelectorAll("h1, h2, h3, h4, h5, h6, h7");
            if (headings.length === 0) {
                tocContainer.innerHTML = `<p class="text-gray-500 italic text-xs sm:text-sm">${translations[currentLang].noHeadings}</p>`;
                return
            }
            headings.forEach((heading, index) => {
                if (!heading.id) {
                    heading.id = `heading-${index}`
                }

                // Extract clean text without existing copy buttons
                const headingClone = heading.cloneNode(true);
                headingClone.querySelectorAll('.heading-copy-btn, span').forEach(el => el.remove());
                const originalText = headingClone.textContent.trim();

                if (!heading.querySelector(".heading-copy-btn")) {
                    heading.classList.add("group", "relative");
                    const copyBtn = createCopyButton(heading.id, false);
                    heading.prepend(copyBtn);
                } else {
                    // Update title of existing copy button if language changed
                    const existingBtn = heading.querySelector(".heading-copy-btn");
                    if (existingBtn) {
                        existingBtn.title = translations[currentLang].copyChapterLinkTitle;
                        const popup = existingBtn.querySelector("span:not(.inline-block)");
                        if (popup) popup.textContent = translations[currentLang].linkCopied;
                    }
                }

                let indentClass = "pl-1";
                if (heading.tagName === "H2") indentClass = "pl-2";
                if (heading.tagName === "H3") indentClass = "pl-4";
                if (heading.tagName === "H4") indentClass = "pl-6";
                if (heading.tagName === "H5") indentClass = "pl-8";
                if (heading.tagName === "H6") indentClass = "pl-10";
                if (heading.tagName === "H7") indentClass = "pl-12";

                const tocItem = document.createElement("div");
                tocItem.className = `flex items-start justify-between w-full py-1.5 px-2 rounded hover:bg-gray-700 text-gray-300 hover:text-white transition-colors break-words scroll-m-2 ${indentClass} cursor-pointer group/toc`;

                const tocTextBtn = document.createElement("div");
                tocTextBtn.className = "flex-1 text-left cursor-pointer break-words";
                tocTextBtn.textContent = originalText;
                tocTextBtn.dataset.targetId = heading.id;

                const tocCopyBtn = createCopyButton(heading.id, true);

                tocItem.appendChild(tocTextBtn);
                tocItem.appendChild(tocCopyBtn);
                tocContainer.appendChild(tocItem);
            })
        }

        function setupScrollSpy(contentViewer, tocContainer) {
            const scrollProgressBar = document.getElementById("scrollProgressBar");

            let lastExecutionTime = 0;
            const updateInterval = 333;
            let scrollEndTimeout = null;

            function updateScrollPosition(forced = false) {
                const scrollTop = contentViewer.scrollTop;
                const scrollHeight = contentViewer.scrollHeight;
                const clientHeight = contentViewer.clientHeight;
                const maxScroll = scrollHeight - clientHeight;
                const percent = maxScroll > 0 ? Math.min(100, Math.max(0, (scrollTop / maxScroll) * 100)) : 0;

                // Save current scroll progress percentage to localStorage if not actively restoring
                if (currentFilePath && !isRestoringScroll) {
                    localStorage.setItem(`sgs_scroll_percent_${currentFilePath}`, percent.toFixed(2));
                }

                if (scrollProgressBar) {
                    scrollProgressBar.style.width = percent + "%";
                }

                const now = performance.now();
                if (!forced && (now - lastExecutionTime < updateInterval)) {
                    return;
                }
                lastExecutionTime = now;

                const filterInput = document.getElementById("contentFilterInput");
                const isFiltered = filterInput && filterInput.value.trim().length > 0;
                const tocItems = tocContainer.children;

                if (isFiltered) {
                    if (tocItems) {
                        Array.from(tocItems).forEach((item) => {
                            const baseIndentClass = Array.from(item.classList).find(c => c.startsWith('pl-')) || 'pl-1';
                            item.className = `flex items-start justify-between w-full py-1.5 px-2 rounded hover:bg-gray-700 text-gray-300 hover:text-white transition-colors break-words scroll-m-2 ${baseIndentClass} cursor-pointer group/toc`;
                        });
                    }
                    return;
                }

                const headings = contentViewer.querySelectorAll("h1, h2, h3, h4, h5, h6, h7");
                if (headings.length === 0 || tocItems.length === 0) return;

                const viewerRect = contentViewer.getBoundingClientRect();
                const activeIndices = new Set();

                headings.forEach((heading, i) => {
                    const headingRect = heading.getBoundingClientRect();
                    const nextHeading = headings[i + 1];
                    const nextHeadingRect = nextHeading ? nextHeading.getBoundingClientRect() : null;

                    const sectionTop = headingRect.top;
                    const sectionBottom = nextHeadingRect ? nextHeadingRect.top : Infinity;

                    if (sectionTop < viewerRect.bottom && sectionBottom > viewerRect.top) {
                        activeIndices.add(i);
                    }
                });

                if (activeIndices.size === 0) {
                    let closestIdx = 0;
                    let minDistance = Infinity;
                    headings.forEach((heading, i) => {
                        const dist = Math.abs(heading.getBoundingClientRect().top - viewerRect.top);
                        if (dist < minDistance) {
                            minDistance = dist;
                            closestIdx = i;
                        }
                    });
                    activeIndices.add(closestIdx);
                }

                Array.from(tocItems).forEach((item, idx) => {
                    const baseIndentClass = Array.from(item.classList).find(c => c.startsWith('pl-')) || 'pl-1';
                    
                    if (activeIndices.has(idx)) {
                        item.className = `flex items-start justify-between w-full py-1.5 px-2 rounded bg-gray-700 text-white font-medium transition-colors break-words scroll-m-2 ${baseIndentClass} cursor-pointer group/toc`;
                    } else {
                        item.className = `flex items-start justify-between w-full py-1.5 px-2 rounded hover:bg-gray-700 text-gray-300 hover:text-white transition-colors break-words scroll-m-2 ${baseIndentClass} cursor-pointer group/toc`;
                    }
                });

                const firstActiveIdx = Array.from(activeIndices)[0];
                if (firstActiveIdx !== undefined && firstActiveIdx !== window._lastFirstActiveIdx) {
                    window._lastFirstActiveIdx = firstActiveIdx;
                    const activeItem = tocContainer.querySelector(`[data-target-id="${headings[firstActiveIdx].id}"]`);
                    if (activeItem) {
                        const tocRow = activeItem.closest('.group\\/toc') || activeItem;
                        tocRow.scrollIntoView({ behavior: "smooth", block: "center" });
                    }
                }
            }

            contentViewer.onscroll = () => {
                updateScrollPosition(false);

                // Force update after last scroll movement
                clearTimeout(scrollEndTimeout);
                scrollEndTimeout = setTimeout(() => {
                    updateScrollPosition(true);
                }, 150);
            };

            updateScrollPosition(true);
        }

        // --- SECTION 10: LAYOUT RESIZERS & OVERLAY TOGGLES ---
        const sidebar = document.getElementById("sidebar");
        const tocSidebar = document.getElementById("toc-sidebar");
        const resizerLeft = document.getElementById("resizer-left");
        
        if (resizerLeft) {
            let isResizingLeft = false;
            resizerLeft.addEventListener("mousedown", e => {
                isResizingLeft = true;
                document.body.style.cursor = "ew-resize";
                e.preventDefault()
            });
            window.addEventListener("mousemove", e => {
                if (!isResizingLeft) return;
                const newWidth = e.clientX - sidebar.getBoundingClientRect().left;
                if (newWidth >= 180 && newWidth <= 600) {
                    sidebar.style.width = `${newWidth}px`
                }
            });
            window.addEventListener("mouseup", () => {
                if (isResizingLeft) {
                    isResizingLeft = false;
                    document.body.style.cursor = "default"
                }
            });
        }

        const resizerRight = document.getElementById("resizer-right");
        if (resizerRight) {
            let isResizingRight = false;
            resizerRight.addEventListener("mousedown", e => {
                isResizingRight = true;
                document.body.style.cursor = "ew-resize";
                e.preventDefault()
            });
            window.addEventListener("mousemove", e => {
                if (!isResizingRight) return;
                const containerRight = document.querySelector("main").getBoundingClientRect().right;
                const calculatedWidth = containerRight - e.clientX;
                if (calculatedWidth >= 180 && calculatedWidth <= 450) {
                    tocSidebar.style.width = `${calculatedWidth}px`
                }
            });
            window.addEventListener("mouseup", () => {
                if (isResizingRight) {
                    isResizingRight = false;
                    document.body.style.cursor = "default"
                }
            });
        }

        function toggleSidebar() {
            if (window.innerWidth < 1060) {
                const isOpen = !sidebar.classList.contains("-translate-x-full");
                if (isOpen) {
                    closeAllOverlays()
                } else {
                    tocSidebar.classList.add("translate-x-full");
                    sidebar.classList.remove("-translate-x-full");
                }
            } else {
                const isHidden = sidebar.style.display === "none";
                sidebar.style.display = isHidden ? "flex" : "none";
                if (resizerLeft) resizerLeft.style.display = isHidden ? "flex" : "none"
            }
        }

        function toggleToc() {
            if (window.innerWidth < 650) {
                const isOpen = !tocSidebar.classList.contains("translate-x-full");
                if (isOpen) {
                    closeAllOverlays()
                } else {
                    sidebar.classList.add("-translate-x-full");
                    tocSidebar.classList.remove("translate-x-full");
                }
            } else {
                const isHidden = tocSidebar.style.display === "none";
                tocSidebar.style.display = isHidden ? "flex" : "none";
                if (resizerRight) resizerRight.style.display = isHidden ? "flex" : "none"
            }
        }

        function closeAllOverlays() {
            if (window.innerWidth < 1060) {
                sidebar.classList.add("-translate-x-full")
            }
            if (window.innerWidth < 650) {
                tocSidebar.classList.add("translate-x-full")
            }
        }

        // --- SECTION 11: INITIAL EXECUTION ON LOAD ---
        closeAllOverlays();
        init();

    </script>
</body>
