<!DOCTYPE html>
<html class="h-full" lang="de">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width,initial-scale=1" name="viewport">
    <title>Simple Game Solutions</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .prose code::before {
            content: "" !important;
        }

        .prose code::after {
            content: "" !important;
        }
    </style>
</head>

<body class="bg-gray-900 text-gray-100 h-full flex flex-col overflow-hidden antialiased">
    <header
        class="bg-gray-800 border-b border-gray-700 px-4 py-3 shadow-md flex justify-between items-center shrink-0 relative z-40 gap-2">
        <div class="flex items-center gap-2 sm:gap-4 shrink-0">
            <button
                class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-md text-sm font-semibold transition-all flex items-center gap-1.5 shadow-lg cursor-pointer"
                data-i18n-title="menuToggleTitle" onclick="toggleSidebar();"><span>📁</span> <span
                    data-i18n="menuBtn">Menü</span></button>
            <h1 class="text-sm sm:text-lg font-bold text-emerald-400 hidden sm:block">🎮 Simple Game Solutions</h1>
        </div>
        <div class="relative flex-1 max-w-xs sm:max-w-sm mx-2 flex items-center">
            <input autocomplete="off"
                class="w-full bg-gray-950 text-gray-200 border border-gray-700 rounded-md px-3 py-1.5 pr-8 text-xs sm:text-sm focus:outline-none focus:border-emerald-500 placeholder-gray-500 transition-colors"
                data-i18n-placeholder="searchPlaceholder" id="searchInput" oninput="handleGlobalSearch(this.value);"
                onkeydown="handleSearchInputKeydown(event);" placeholder="Suchen..." type="text"> <button
                class="absolute right-2.5 text-gray-400 hover:text-white text-sm hidden focus:outline-none cursor-pointer"
                id="clearSearchBtn" onclick="clearSearch();" title="Suche löschen">✕</button>
        </div>
        <div class="absolute left-3 right-3 sm:left-6 sm:right-6 top-full mt-1 bg-gray-800 border border-gray-700 rounded-md shadow-2xl max-h-80 overflow-y-auto z-50 hidden"
            id="searchDropdown"></div>
        <div class="flex items-center gap-2 sm:gap-4 shrink-0">
            <select
                class="bg-gray-700 text-emerald-300 text-xs px-2 py-1.5 rounded-md border border-gray-600 focus:outline-none cursor-pointer"
                id="langSelect" onchange="changeLanguage(this.value);">
                <option value="de">
                    🇩🇪 Deutsch
                </option>
                <option value="en">
                    🇬🇧 English
                </option>
            </select>
            <span id="scrollIndicator"
                class="text-xs font-mono text-emerald-300 bg-gray-950 py-1.5 rounded-md border border-gray-700 shrink-0 w-12 text-center"
                title="Scroll-Fortschritt">0%</span>
            <button
                class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-md text-sm font-semibold transition-all flex items-center gap-1.5 shadow-lg cursor-pointer"
                data-i18n-title="tocToggleTitle" onclick="toggleToc();"><span>📑</span> <span
                    data-i18n="tocBtn">Inhalt</span></button>
        </div>
    </header>
    <main class="flex-1 flex flex-row overflow-hidden p-2 sm:p-4 gap-2 relative">
        <div class="fixed inset-0 bg-black/60 z-20 hidden min-[1060px]:hidden transition-opacity" id="mobileBackdrop"
            onclick="closeAllOverlays();"></div>
        <aside
            class="fixed min-[1060px]:relative inset-y-0 left-0 w-72 min-[1060px]:w-[280px] bg-gray-800 border-r min-[1060px]:border border-gray-700 rounded-r-lg min-[1060px]:rounded-lg p-4 flex flex-col shrink-0 h-full overflow-hidden shadow-2xl min-[1060px]:shadow-lg z-30 transform -translate-x-full min-[1060px]:translate-x-0 transition-transform duration-200"
            id="sidebar">
            <div class="mb-3 border-b border-gray-700 pb-2 shrink-0 flex justify-between items-center">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-gray-400" data-i18n="directoriesTitle">
                    Verzeichnisse</h2><button
                    class="text-gray-400 hover:text-white text-xs px-2 py-1 rounded bg-gray-700 cursor-pointer"
                    data-i18n-title="close" onclick="toggleSidebar();">✕</button>
            </div>
            <div class="space-y-1 text-sm flex-1 overflow-y-auto pr-1" id="tree-container">
                <p class="text-gray-500 animate-pulse text-xs" data-i18n="loadingStructure">Lade Struktur...</p>
            </div>
        </aside>
        <div class="hidden min-[1060px]:flex w-2 bg-gray-800 hover:bg-emerald-500 cursor-ew-resize rounded transition-colors items-center justify-center group shrink-0"
            data-i18n-title="resizeWidth" id="resizer-left">
            <div class="h-8 w-0.5 bg-gray-600 group-hover:bg-gray-900 rounded-full"></div>
        </div>
        <section
            class="flex-1 bg-gray-800 border border-gray-700 rounded-lg p-4 sm:p-6 flex flex-col h-full overflow-hidden shadow-lg min-w-0 min-[1050px]:min-w-[450px]">
            <div class="prose prose-invert max-w-none flex-1 overflow-y-auto pr-2 text-sm sm:text-base leading-relaxed prose-code:text-emerald-200/80 prose-code:bg-gray-800 prose-code:px-1.5 prose-code:py-0.5 prose-code:rounded prose-code:border prose-code:border-gray-700/40 prose-blockquote:border-emerald-500/30 prose-blockquote:bg-gray-800/40 prose-blockquote:text-gray-300/90"
                id="content-viewer">
                <div class="text-center text-gray-500 py-20">
                    <p class="text-base sm:text-lg" data-i18n="welcomeMessage">Wähle links eine Kategorie und eine Datei
                        aus, um die Lösung anzuzeigen.</p>
                </div>
            </div>
        </section>
        <div class="hidden min-[650px]:flex w-2 bg-gray-800 hover:bg-emerald-500 cursor-ew-resize rounded transition-colors items-center justify-center group shrink-0"
            data-i18n-title="resizeWidth" id="resizer-right">
            <div class="h-8 w-0.5 bg-gray-600 group-hover:bg-gray-900 rounded-full"></div>
        </div>
        <aside
            class="fixed min-[650px]:relative inset-y-0 right-0 w-64 min-[650px]:w-[260px] bg-gray-800 border-l min-[650px]:border border-gray-700 rounded-l-lg min-[650px]:rounded-lg p-4 flex flex-col shrink-0 h-full overflow-hidden shadow-2xl min-[650px]:shadow-lg z-30 transform translate-x-full min-[650px]:translate-x-0 transition-transform duration-200"
            id="toc-sidebar">
            <div class="mb-3 border-b border-gray-700 pb-2 shrink-0 flex justify-between items-center">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-gray-400" data-i18n="chaptersTitle">
                    Kapitel</h2><button
                    class="text-gray-400 hover:text-white text-xs px-2 py-1 rounded bg-gray-700 cursor-pointer"
                    data-i18n-title="close" onclick="toggleToc();">✕</button>
            </div>
            <div class="space-y-1 text-sm flex-1 overflow-y-auto pr-1" id="toc-container">
                <p class="text-gray-500 italic text-xs" data-i18n="noFileLoaded">Keine Datei geladen.</p>
            </div>
        </aside>
    </main>
    <script>
        const translations = {
            de: {
                menuBtn: "Menü",
                menuToggleTitle: "Verzeichnisse ein-/ausblenden",
                subtitle: "Automatische Dokumentation",
                tocBtn: "Inhalt",
                tocToggleTitle: "Inhaltsverzeichnis ein-/ausblenden",
                directoriesTitle: "Verzeichnisse",
                chaptersTitle: "Kapitel",
                loadingStructure: "Lade Struktur...",
                welcomeMessage: "Wähle oben über die Suche oder links im Menü eine Lösung aus.",
                noFileLoaded: "Keine Datei geladen.",
                analyzing: "Analysiere Kapitel...",
                noHeadings: "Keine Kapitel gefunden.",
                loadingFile: "Lade Lösung...",
                fileNotFound: "Datei nicht gefunden",
                errorLoadingFile: "Fehler beim Laden der Datei:",
                errorLoadingStruct: "Fehler beim Laden der Struktur.",
                resizeWidth: "Breite anpassen",
                searchPlaceholder: "Suchen (z.B. Maniac AND Ostern OR 101)...",
                noResults: "Keine Treffer gefunden.",
                linkCopied: "Link kopiert"
            },
            en: {
                menuBtn: "Menu",
                menuToggleTitle: "Toggle directories",
                subtitle: "Automatic Documentation",
                tocBtn: "Contents",
                tocToggleTitle: "Toggle table of contents",
                directoriesTitle: "Directories",
                chaptersTitle: "Chapters",
                loadingStructure: "Loading structure...",
                welcomeMessage: "Select a solution via search or menu.",
                noFileLoaded: "No file loaded.",
                analyzing: "Analyzing chapters...",
                noHeadings: "No chapters found.",
                loadingFile: "Loading solution.",
                fileNotFound: "File not found",
                errorLoadingFile: "Error loading file:",
                errorLoadingStruct: "Error loading structure.",
                resizeWidth: "Adjust width",
                searchPlaceholder: "Search (e.g. Maniac AND Ostern OR 101)...",
                noResults: "No matching files found.",
                linkCopied: "Link copied"
            }
        };

        function getBrowserLanguage() {
            const browserLang = navigator.language || navigator.userLanguage;
            if (browserLang && browserLang.startsWith("en")) {
                return "en"
            }
            return "de"
        }
        let currentLang = getBrowserLanguage();
        document.getElementById("langSelect").value = currentLang;

        function setLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll("[data-i18n]").forEach(el => {
                const key = el.getAttribute("data-i18n");
                if (translations[currentLang][key]) {
                    el.textContent = translations[currentLang][key]
                }
            });
            document.querySelectorAll("[data-i18n-title]").forEach(el => {
                const key = el.getAttribute("data-i18n-title");
                if (translations[currentLang][key]) {
                    el.setAttribute("title", translations[currentLang][key])
                }
            });
            document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
                const key = el.getAttribute("data-i18n-placeholder");
                if (translations[currentLang][key]) {
                    el.setAttribute("placeholder", translations[currentLang][key])
                }
            })
        }

        function changeLanguage(lang) {
            setLanguage(lang);
            handleGlobalSearch(document.getElementById("searchInput").value)
        }
        let structureData = null;
        let currentFilePath = null;

        async function init() {
            setLanguage(currentLang);
            try {
                const response = await fetch("structure.json");
                structureData = await response.json();
                renderTree(structureData, document.getElementById("tree-container"));

                const urlParams = new URLSearchParams(window.location.search);
                const fileParam = urlParams.get('file');
                if (fileParam) {
                    await loadFile(fileParam);
                    if (window.location.hash) {
                        setTimeout(() => {
                            const targetId = window.location.hash.substring(1);
                            const targetEl = document.getElementById(targetId);
                            if (targetEl) {
                                targetEl.scrollIntoView({ behavior: "smooth", block: "start" });
                            }
                        }, 300);
                    }
                }
            } catch (error) {
                console.error("Error loading structure:", error);
                document.getElementById("tree-container").innerHTML = `<p class="text-red-400 text-xs">${translations[currentLang].errorLoadingStruct}</p>`
            }
        }

        function matchQuery(nameLower, query) {
            const q = query.trim();
            if (!q) return true;
            const orClauses = q.toLowerCase().split(/\b(?:or|oder)\b/);
            return orClauses.some(clause => {
                const cleanClause = clause.replace(/\b(?:and|und)\b/g, " ");
                const terms = cleanClause.split(/\s+/).filter(t => t.length > 0);
                if (terms.length === 0) return false;
                return terms.every(term => nameLower.includes(term))
            })
        }

        function handleGlobalSearch(query) {
            const clearBtn = document.getElementById("clearSearchBtn");
            if (query.trim().length > 0) {
                clearBtn.classList.remove("hidden")
            } else {
                clearBtn.classList.add("hidden")
            }
            filterTree(query);
            const dropdown = document.getElementById("searchDropdown");
            const q = query.trim();
            if (!q || !structureData) {
                dropdown.innerHTML = "";
                dropdown.classList.add("hidden");
                return
            }
            const matchingFiles = [];

            function collectFiles(node) {
                if (!node) return;
                if (node.type === "file") {
                    if (matchQuery(node.name.toLowerCase(), q)) {
                        matchingFiles.push(node)
                    }
                } else if (node.type === "directory" && node.children) {
                    node.children.forEach(child => collectFiles(child))
                }
            }
            collectFiles(structureData);
            if (matchingFiles.length === 0) {
                dropdown.innerHTML = `<div class="p-3 text-xs sm:text-sm text-gray-400 italic">${translations[currentLang].noResults}</div>`;
                dropdown.classList.remove("hidden");
                return
            }
            let html = "";
            matchingFiles.forEach((file, index) => {
                html += `<button type="button" onclick="selectSearchResult('${file.path}')" onkeydown="handleDropdownKeydown(event, ${index}, '${file.path}')" class="w-full text-left px-4 py-2.5 text-xs sm:text-sm text-gray-200 hover:bg-gray-700 hover:text-white focus:bg-gray-700 focus:text-white transition-colors border-b border-gray-700/50 last:border-b-0 flex items-center gap-2 cursor-pointer focus:outline-none">
                    <span>📄</span> <span class="font-medium">${file.name}</span>
                </button>`
            });
            dropdown.innerHTML = html;
            dropdown.classList.remove("hidden")
        }

        function handleSearchInputKeydown(e) {
            const dropdown = document.getElementById("searchDropdown");
            const items = dropdown.querySelectorAll("button");
            if (e.key === "ArrowDown" && !dropdown.classList.contains("hidden") && items.length > 0) {
                e.preventDefault();
                items[0].focus()
            } else if (e.key === "Escape") {
                dropdown.classList.add("hidden")
            }
        }

        function handleDropdownKeydown(e, index, path) {
            const dropdown = document.getElementById("searchDropdown");
            const items = dropdown.querySelectorAll("button");
            if (e.key === "ArrowDown") {
                e.preventDefault();
                if (index + 1 < items.length) {
                    items[index + 1].focus()
                }
            } else if (e.key === "ArrowUp") {
                e.preventDefault();
                if (index > 0) {
                    items[index - 1].focus()
                } else {
                    document.getElementById("searchInput").focus()
                }
            } else if (e.key === "Enter") {
                e.preventDefault();
                selectSearchResult(path)
            } else if (e.key === "Escape") {
                e.preventDefault();
                dropdown.classList.add("hidden");
                document.getElementById("searchInput").focus()
            }
        }

        function clearSearch() {
            const input = document.getElementById("searchInput");
            input.value = "";
            handleGlobalSearch("");
            document.getElementById("searchDropdown").classList.add("hidden");
            document.getElementById("clearSearchBtn").classList.add("hidden");
            input.focus()
        }

        function selectSearchResult(path) {
            loadFile(path);
            document.getElementById("searchDropdown").classList.add("hidden");
            document.getElementById("searchInput").value = "";
            document.getElementById("clearSearchBtn").classList.add("hidden");
            filterTree("");
            if (window.innerWidth < 1060) {
                closeAllOverlays()
            }
        }
        window.addEventListener("click", e => {
            const searchContainer = document.getElementById("searchInput").parentElement;
            const dropdown = document.getElementById("searchDropdown");
            if (!searchContainer.contains(e.target) && !dropdown.contains(e.target)) {
                dropdown.classList.add("hidden")
            }
        });

        function renderTree(node, container, filterQuery = "") {
            container.innerHTML = "";
            const query = filterQuery.trim();

            function filterNode(item) {
                const nameLower = item.name.toLowerCase();
                const matches = matchQuery(nameLower, query);
                if (item.type === "file") {
                    return matches ? {
                        ...item
                    } : null
                } else if (item.type === "directory") {
                    const matchingChildren = (item.children || []).map(child => filterNode(child)).filter(child => child !== null);
                    if (matches || matchingChildren.length > 0) {
                        return {
                            ...item,
                            children: matchingChildren
                        }
                    }
                }
                return null
            }
            let displayNode = node;
            if (query !== "") {
                const filteredChildren = (node.children || []).map(child => filterNode(child)).filter(child => child !== null);
                if (filteredChildren.length === 0) {
                    container.innerHTML = `<p class="text-gray-500 italic text-xs py-2">${translations[currentLang].noResults}</p>`;
                    return
                }
                displayNode = {
                    ...node,
                    children: filteredChildren
                }
            }

            function buildNode(item, parentEl) {
                if (item.type === "directory") {
                    const details = document.createElement("details");
                    details.className = "ml-1 my-1";
                    details.open = query !== "";
                    const summary = document.createElement("summary");
                    summary.className = "cursor-pointer font-medium text-emerald-300 hover:text-emerald-200 py-1 px-2 rounded hover:bg-gray-700/50 select-none text-xs sm:text-sm break-words";
                    summary.textContent = `📁 ${item.name}`;
                    details.appendChild(summary);
                    const childrenContainer = document.createElement("div");
                    childrenContainer.className = "pl-3 border-l border-gray-700 ml-2 space-y-1 mt-1";
                    item.children = item.children || [];
                    item.children.forEach(child => buildNode(child, childrenContainer));
                    details.appendChild(childrenContainer);
                    parentEl.appendChild(details)
                } else if (item.type === "file") {
                    const fileLink = document.createElement("button");
                    fileLink.className = "block w-full text-left py-1.5 px-2 rounded hover:bg-gray-700 text-gray-300 hover:text-white transition-colors text-xs sm:text-sm break-words cursor-pointer";
                    fileLink.textContent = `📄 ${item.name}`;
                    fileLink.onclick = () => {
                        loadFile(item.path);
                        if (window.innerWidth < 1060) {
                            closeAllOverlays()
                        }
                    };
                    parentEl.appendChild(fileLink)
                }
            }
            if (displayNode.children) {
                displayNode.children.forEach(child => buildNode(child, container))
            }
        }

        function filterTree(query) {
            if (structureData) {
                renderTree(structureData, document.getElementById("tree-container"), query)
            }
        }

        async function loadFile(filePath) {
            currentFilePath = filePath;
            const viewer = document.getElementById("content-viewer");
            const tocContainer = document.getElementById("toc-container");
            const scrollIndicator = document.getElementById("scrollIndicator");
            if (scrollIndicator) scrollIndicator.textContent = "0%";
            viewer.innerHTML = `<p class="text-gray-400 animate-pulse text-sm">${translations[currentLang].loadingFile}</p>`;
            tocContainer.innerHTML = `<p class="text-gray-500 italic text-xs">${translations[currentLang].analyzing}</p>`;
            try {
                const response = await fetch(`solutions/${filePath}`);
                if (!response.ok) throw new Error(translations[currentLang].fileNotFound);
                const text = await response.text();
                if (filePath.endsWith(".md")) {
                    viewer.innerHTML = marked.parse(text)
                } else {
                    viewer.innerHTML = `<pre class="whitespace-pre-wrap font-mono text-xs sm:text-sm bg-gray-950 p-4 rounded">${escapeHtml(text)}</pre>`
                }
                viewer.querySelectorAll("a").forEach(link => {
                    link.setAttribute("target", "_blank");
                    link.setAttribute("rel", "noopener noreferrer");
                    link.className = "text-emerald-400 hover:underline"
                });
                generateToc(viewer, tocContainer);
                setupScrollSpy(viewer, tocContainer);
            } catch (error) {
                viewer.innerHTML = `<p class="text-red-400 text-sm">${translations[currentLang].errorLoadingFile} ${filePath}</p>`;
                tocContainer.innerHTML = `<p class="text-red-400 text-xs">${translations[currentLang].noFileLoaded}</p>`
            }
        }

        function createCopyButton(headingId, isToc = false) {
            const copyBtn = document.createElement("button");
            copyBtn.className = `${isToc ? 'toc-copy-btn' : 'heading-copy-btn'} inline-flex items-center ${isToc ? 'ml-2' : 'mr-2'} opacity-70 sm:opacity-0 sm:group-hover${isToc ? '/toc' : ''}:opacity-100 transition-opacity text-emerald-400 hover:text-emerald-300 text-sm cursor-pointer focus:outline-none align-middle relative shrink-0`;
            copyBtn.title = currentLang === "de" ? "Kapitel-Link kopieren" : "Copy chapter link";

            const iconSpan = document.createElement("span");
            iconSpan.className = "inline-block w-6 text-center";
            iconSpan.textContent = "🔗";

            const popupSpan = document.createElement("span");
            if (isToc) {
                popupSpan.className = "absolute right-full mr-2 px-2 py-0.5 bg-gray-800 text-emerald-300 text-xs rounded shadow-lg whitespace-nowrap opacity-0 pointer-events-none border border-gray-700 z-50";
            } else {
                popupSpan.className = "absolute left-full ml-2 px-2 py-0.5 bg-gray-800 text-emerald-300 text-xs rounded shadow-lg whitespace-nowrap opacity-0 pointer-events-none border border-gray-700 z-50";
            }
            popupSpan.textContent = translations[currentLang].linkCopied;

            copyBtn.appendChild(iconSpan);
            copyBtn.appendChild(popupSpan);

            let copyTimeout = null;

            copyBtn.onclick = (e) => {
                e.stopPropagation();
                const baseUrl = window.location.href.split('?')[0].split('#')[0];
                const cleanUrl = `${baseUrl}?file=${encodeURIComponent(currentFilePath)}#${headingId}`;
                navigator.clipboard.writeText(cleanUrl).then(() => {
                    iconSpan.textContent = "✓";
                    popupSpan.textContent = translations[currentLang].linkCopied;

                    copyBtn.style.transition = 'none';
                    popupSpan.style.transition = 'none';
                    copyBtn.style.opacity = "1";
                    popupSpan.style.opacity = "1";

                    void popupSpan.offsetWidth;

                    if (copyTimeout) clearTimeout(copyTimeout);
                    copyTimeout = setTimeout(() => {
                        copyBtn.style.transition = 'opacity 500ms ease';
                        popupSpan.style.transition = 'opacity 500ms ease';
                        popupSpan.style.opacity = "0";
                        copyBtn.style.opacity = "0";

                        setTimeout(() => {
                            iconSpan.textContent = "🔗";
                            copyBtn.style.opacity = "";
                            copyBtn.style.transition = "";
                            popupSpan.style.transition = "";
                        }, 500);
                    }, 1500);
                });
            };
            return copyBtn;
        }

        function generateToc(contentViewer, tocContainer) {
            tocContainer.innerHTML = "";
            const headings = contentViewer.querySelectorAll("h1, h2, h3, h4, h5, h6, h7");
            if (headings.length === 0) {
                tocContainer.innerHTML = `<p class="text-gray-500 italic text-xs sm:text-sm">${translations[currentLang].noHeadings}</p>`;
                return
            }
            headings.forEach((heading, index) => {
                if (!heading.id) {
                    heading.id = `heading-${index}`
                }

                const originalText = heading.textContent;

                // Hauptbereich Überschriften-Button
                if (!heading.querySelector(".heading-copy-btn")) {
                    heading.classList.add("group", "relative");
                    const copyBtn = createCopyButton(heading.id, false);
                    heading.prepend(copyBtn);
                }

                // Rechtes Inhaltsverzeichnis Element
                let indentClass = "pl-1";
                if (heading.tagName === "H2") indentClass = "pl-2";
                if (heading.tagName === "H3") indentClass = "pl-4";
                if (heading.tagName === "H4") indentClass = "pl-6";
                if (heading.tagName === "H5") indentClass = "pl-8";
                if (heading.tagName === "H6") indentClass = "pl-10";
                if (heading.tagName === "H7") indentClass = "pl-12";

                const tocItem = document.createElement("div");
                tocItem.className = `flex items-center justify-between w-full py-1.5 px-2 rounded hover:bg-gray-700 text-gray-300 hover:text-emerald-300 transition-colors text-xs sm:text-sm break-words ${indentClass} group/toc relative`;

                const tocTextBtn = document.createElement("button");
                tocTextBtn.className = "flex-1 text-left bg-transparent border-none text-inherit text-xs sm:text-sm cursor-pointer truncate focus:outline-none";
                tocTextBtn.textContent = originalText;
                tocTextBtn.dataset.targetId = heading.id;
                tocTextBtn.onclick = () => {
                    heading.scrollIntoView({
                        behavior: "smooth",
                        block: "start"
                    });
                    if (window.innerWidth < 650) {
                        closeAllOverlays()
                    }
                };

                const tocCopyBtn = createCopyButton(heading.id, true);

                tocItem.appendChild(tocTextBtn);
                tocItem.appendChild(tocCopyBtn);
                tocContainer.appendChild(tocItem);
            })
        }

        function setupScrollSpy(contentViewer, tocContainer) {
            const scrollIndicator = document.getElementById("scrollIndicator");

            function updateScrollPosition() {
                const scrollTop = contentViewer.scrollTop;
                const scrollHeight = contentViewer.scrollHeight;
                const clientHeight = contentViewer.clientHeight;

                // Prozentanzeige aktualisieren (0% bis 100% als Integer)
                if (scrollIndicator) {
                    const maxScroll = scrollHeight - clientHeight;
                    const percent = maxScroll > 0 ? Math.min(100, Math.max(0, Math.round((scrollTop / maxScroll) * 100))) : 0;
                    scrollIndicator.textContent = percent + "%";
                }

                const headings = contentViewer.querySelectorAll("h1, h2, h3, h4, h5, h6, h7");
                const tocButtons = tocContainer.querySelectorAll("[data-target-id]");
                if (headings.length === 0 || tocButtons.length === 0) return;

                let lastActiveId = window._lastActiveId || null;
                let activeId = headings[0].id;

                if (scrollTop + clientHeight >= scrollHeight - 15) {
                    activeId = headings[headings.length - 1].id;
                } else {
                    for (let i = 0; i < headings.length; i++) {
                        const headingTop = headings[i].getBoundingClientRect().top - contentViewer.getBoundingClientRect().top + scrollTop;
                        if (scrollTop >= headingTop - 120) {
                            activeId = headings[i].id;
                        }
                    }
                }

                if (activeId !== lastActiveId) {
                    window._lastActiveId = activeId;
                    tocButtons.forEach(btn => {
                        if (btn.dataset.targetId === activeId) {
                            btn.scrollIntoView({ behavior: "smooth", block: "center" });
                        }
                    });
                }
            }

            contentViewer.onscroll = updateScrollPosition;
            updateScrollPosition();
        }

        function escapeHtml(text) {
            return text.replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
        }
        const sidebar = document.getElementById("sidebar");
        const tocSidebar = document.getElementById("toc-sidebar");
        const mobileBackdrop = document.getElementById("mobileBackdrop");
        const resizerLeft = document.getElementById("resizer-left");
        let isResizingLeft = false;
        resizerLeft.addEventListener("mousedown", e => {
            isResizingLeft = true;
            document.body.style.cursor = "ew-resize";
            e.preventDefault()
        });
        window.addEventListener("mousemove", e => {
            if (!isResizingLeft) return;
            const newWidth = e.clientX - sidebar.getBoundingClientRect().left;
            if (newWidth >= 180 && newWidth <= 600) {
                sidebar.style.width = `${newWidth}px`
            }
        });
        window.addEventListener("mouseup", () => {
            if (isResizingLeft) {
                isResizingLeft = false;
                document.body.style.cursor = "default"
            }
        });
        const resizerRight = document.getElementById("resizer-right");
        let isResizingRight = false;
        resizerRight.addEventListener("mousedown", e => {
            isResizingRight = true;
            document.body.style.cursor = "ew-resize";
            e.preventDefault()
        });
        window.addEventListener("mousemove", e => {
            if (!isResizingRight) return;
            const containerRight = document.querySelector("main").getBoundingClientRect().right;
            const calculatedWidth = containerRight - e.clientX;
            if (calculatedWidth >= 180 && calculatedWidth <= 450) {
                tocSidebar.style.width = `${calculatedWidth}px`
            }
        });
        window.addEventListener("mouseup", () => {
            if (isResizingRight) {
                isResizingRight = false;
                document.body.style.cursor = "default"
            }
        });

        function toggleSidebar() {
            if (window.innerWidth < 1060) {
                const isOpen = !sidebar.classList.contains("-translate-x-full");
                if (isOpen) {
                    closeAllOverlays()
                } else {
                    tocSidebar.classList.add("translate-x-full");
                    sidebar.classList.remove("-translate-x-full");
                    mobileBackdrop.classList.remove("hidden")
                }
            } else {
                const isHidden = sidebar.style.display === "none";
                sidebar.style.display = isHidden ? "flex" : "none";
                if (resizerLeft) resizerLeft.style.display = isHidden ? "flex" : "none"
            }
        }

        function toggleToc() {
            if (window.innerWidth < 650) {
                const isOpen = !tocSidebar.classList.contains("translate-x-full");
                if (isOpen) {
                    closeAllOverlays()
                } else {
                    sidebar.classList.add("-translate-x-full");
                    tocSidebar.classList.remove("translate-x-full");
                    mobileBackdrop.classList.remove("hidden")
                }
            } else {
                const isHidden = tocSidebar.style.display === "none";
                tocSidebar.style.display = isHidden ? "flex" : "none";
                if (resizerRight) resizerRight.style.display = isHidden ? "flex" : "none"
            }
        }

        function closeAllOverlays() {
            if (window.innerWidth < 1060) {
                sidebar.classList.add("-translate-x-full")
            }
            if (window.innerWidth < 650) {
                tocSidebar.classList.add("translate-x-full")
            }
            mobileBackdrop.classList.add("hidden")
        }
        init();

    </script>
</body>

</html>
