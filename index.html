<!DOCTYPE html>
<html class="h-[100dvh] overflow-hidden" lang="de">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" name="viewport">
    <title>Simple Game Solutions | Interactive Adventure Game Walkthroughs & Guides</title>
    <meta name="description" content="Discover interactive video game walkthroughs, guides, and solutions for classic adventure games with chapter search and reading progress tracking.">
    <meta name="keywords" content="walkthrough, game solution, adventure games, point and click, guide, gaming tips">
    <link rel="icon" type="image/gif" href="res/img/favicon.gif">
    <meta property="og:title" content="Simple Game Solutions">
    <meta property="og:description" content="Discover and contribute to player-centric video game walkthroughs">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://amigamaster.github.io/Simple-Game-Solutions">
    <meta name="theme-color" content="#10b981">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Simple Game Solutions",
      "url": "https://amigamaster.github.io/Simple-Game-Solutions",
      "description": "Interactive and player-centric video game walkthroughs and guides for classic adventure games.",
      "inLanguage": ["de", "en"]
    }
    </script>

    <!-- External Libraries: Tailwind CSS Typography Plugin & Marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"
            integrity="sha384-948ahk4ZmxYVYOc+rxN1H2gM1EJ2Duhp7uHtZ4WSLkV4Vtx5MUqnV+l7u9B+jFv+"
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.18/dist/purify.min.js"
            integrity="sha384-lkArbWjiZKuE+bzKbj1vOEF7DKYBDNvgwZMCt5OH8bdRB92zpzyNska9Q/XKPHQD"
            crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    
    <!-- Custom Typography & Markdown Code Block Styling -->
    <style>
        .prose code::before {
            content: "" !important;
        }

        .prose code::after {
            content: "" !important;
        }

        .prose pre {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace !important;
            white-space: pre !important;
            word-break: normal !important;
            overflow-x: auto !important;
            background-color: #030712 !important;
            border: 1px solid #374151 !important;
            border-radius: 0.375rem !important;
            padding: 1rem !important;
        }

        .prose pre code {
            font-family: inherit !important;
            background-color: transparent !important;
            border: none !important;
            border-radius: 0 !important;
            padding: 0 !important;
            font-weight: normal !important;
            color: #a7f3d0 !important;
            box-shadow: none !important;
        }

        /* Search Filter Term Highlighting */
        mark.search-highlight {
            background-color: #065f46 !important;
            color: #ffffff !important;
            padding: 0.1em 0.25em !important;
            border-radius: 0.25rem !important;
            font-weight: 600 !important;
            box-shadow: 0 0 0 1px #10b981 !important;
        }
        
        /* Animate icons */
        @keyframes subtle-wiggle {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(-8deg) scale(1.1); }
            75% { transform: rotate(8deg) scale(1.1); }
        }

        .group:hover .hover-wiggle {
            animation: subtle-wiggle 0.4s ease-in-out normal;
        }

        /* Desktop panel state (collapsed / dragged width) only applies at the desktop breakpoints.
           It must never be written as inline style: that would override the mobile off-canvas layout. */
        @media (min-width: 1060px) {
            #sidebar { width: var(--sb-w, 280px); }
            #sidebar.panel-collapsed, #resizer-left.panel-collapsed { display: none !important; }
        }
        @media (min-width: 650px) {
            #toc-sidebar { width: var(--toc-w, 260px); }
            #toc-sidebar.panel-collapsed, #resizer-right.panel-collapsed { display: none !important; }
        }

        /* Reserve the scrollbar space so long result lists never clip their text */
        #searchDropdown { scrollbar-gutter: stable; }

        /* Spoiler protection: steps that are not revealed yet, collapsible chapter headings */
        #content-viewer:not(.spoiler-searching) .spoiler-hidden { display: none !important; }
        /* The most recently revealed action of each open chapter */
        #content-viewer:not(.spoiler-searching) .spoiler-latest {
            box-shadow: inset 3px 0 0 #34d399;
            background: rgba(16, 185, 129, 0.12);
            border-radius: 0 0.375rem 0.375rem 0;
        }
        #content-viewer:not(.spoiler-searching) :is(h1, h2, h3, h4, h5, h6).spoiler-latest {
            margin-left: -0.5rem;
            padding-left: 0.5rem;
        }
        /* Number of actions of an opened chapter (generated content, so it never ends up in heading texts / TOC) */
        .spoiler-heading[data-spoiler-count]::after {
            content: attr(data-spoiler-count);
            display: inline-block;
            margin-left: 0.6rem;
            padding: 0.05rem 0.5rem;
            border-radius: 999px;
            font-size: 0.7rem;
            font-weight: 500;
            line-height: 1.4;
            color: #9ca3af;
            background: rgba(148, 163, 184, 0.15);
            vertical-align: middle;
            white-space: nowrap;
        }
        .spoiler-heading { cursor: pointer; }
        .spoiler-heading:hover { color: #6ee7b7; }
        .spoiler-chevron { display: inline-block; width: 1.1em; color: #34d399; font-size: 0.8em; }
    </style>
</head>

<body class="bg-gray-900 text-gray-100 h-[100dvh] w-screen overflow-hidden flex flex-col antialiased m-0 p-0">
    
    <!-- ========================================== -->
    <!-- HEADER & NAVIGATION BAR                    -->
    <!-- ========================================== -->
    <header
        class="bg-gray-800 border-b border-gray-700 px-2 sm:px-4 py-2 sm:py-3 shadow-md flex justify-between items-center shrink-0 relative z-40 gap-1.5 sm:gap-2 w-full max-w-full">
        
        <!-- Left Section: Sidebar Toggle & App Title -->
        <div class="flex items-center gap-1.5 sm:gap-4 shrink-0">
            <button
                class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 min-h-[40px] sm:min-h-0 sm:py-1.5 rounded-md text-lg sm:text-sm font-semibold transition-all flex items-center justify-center gap-1 shadow-lg cursor-pointer shrink-0"
                data-i18n-title="menuToggleTitle" onclick="toggleSidebar();"><span>📁</span> <span class="hidden sm:inline"
                    data-i18n="menuBtn">Menü</span></button>
            <h1 class="text-4xl sm:text-lg font-bold text-emerald-400 cursor-pointer hover:text-emerald-300 transition-colors relative inline-flex items-center justify-center min-w-[44px] min-h-[44px] -my-2 sm:min-w-0 sm:min-h-0 sm:my-0" data-i18n-title="goHomeTitle" onclick="goHome();" title="Zur Startseite">
                🏠<span class="hidden md:inline"> Simple Game Solutions</span>
                <span id="homeUnreadBadge" class="absolute top-0.5 right-0 sm:-top-2 sm:-right-2 w-4 h-4 bg-red-500/75 text-white text-[10px] font-bold px-2 py-0.2 rounded-full flex items-center justify-center hidden shadow">0</span>
            </h1>
        </div>

        <!-- Center Section: Global Search Input, Copy Link & Clear Search Buttons -->
        <div class="relative flex-1 max-w-xs sm:max-w-sm mx-0.5 sm:mx-2 flex items-center min-w-[90px] sm:min-w-[180px]">
            <input autocomplete="off"
                class="w-full bg-gray-950 text-gray-200 border border-gray-700 rounded-md px-2.5 sm:px-3 py-2 min-h-[40px] sm:min-h-0 sm:py-1.5 pr-14 text-base sm:text-sm focus:outline-none focus:border-emerald-500 placeholder-gray-500 transition-colors"
                data-i18n-placeholder="searchPlaceholder" id="searchInput" onblur="handleSearchBlur();" onfocus="handleSearchFocus();" oninput="debounceGlobalSearch(this.value);"
                onkeydown="handleSearchInputKeydown(event);" placeholder="Suchen..." type="text">
            <button
                class="absolute right-8 text-emerald-400 hover:text-emerald-300 text-base sm:text-xs hidden focus:outline-none cursor-pointer"
                data-i18n-title="copySearchLinkTitle" id="copySearchBtn" onclick="copySearchLink();" title="Suche-Link kopieren">🔗</button>
            <button
                class="absolute right-2.5 text-gray-400 hover:text-white text-base sm:text-sm hidden focus:outline-none cursor-pointer"
                id="clearSearchBtn" onclick="clearSearch();" title="Suche löschen">✕</button>
        </div>

        <!-- Search Autocomplete Dropdown Container -->
        <div class="absolute left-2 right-2 sm:left-6 sm:right-6 top-full mt-1 bg-gray-800 border border-gray-700 rounded-md shadow-2xl max-h-80 overflow-y-auto z-50 hidden"
            id="searchDropdown"></div>

        <!-- Right Section: Settings Dropdown, Language Selector & Table of Contents (TOC) Toggle -->
        <div class="flex items-center gap-1.5 sm:gap-3 shrink-0">
            <!-- Hidden File Input for Importing Settings -->
            <input type="file" id="importSettingsFile" accept=".json" class="hidden" onchange="importSettings(event)">
            
            <!-- Settings Dropdown Menu (Sliders Icon) -->
            <div class="relative shrink-0" id="settingsMenuContainer">
                <button onclick="toggleSettingsMenu();" class="bg-gray-700 hover:bg-gray-600 text-gray-300 hover:text-white px-3 py-2 min-h-[40px] sm:min-h-0 sm:px-2 sm:py-1.5 rounded-md text-lg sm:text-sm border border-gray-600 focus:outline-none cursor-pointer transition-colors" data-i18n-title="settingsMenuTitle" title="Einstellungen">
                    ⚙️
                </button>
                <div id="settingsDropdown" class="absolute top-full mt-1 right-0 bg-gray-800 border border-gray-700 rounded-xl shadow-2xl p-3 hidden flex flex-col gap-3 z-50" style="width: min(16rem, calc(100vw - 1rem));">
                    <div>
                        <label for="langSelect" class="block text-sm sm:text-xs font-medium text-gray-300 mb-1.5" data-i18n="settingsLanguageLabel">Sprache / Language</label>
                        <select id="langSelect" onchange="changeLanguage(this.value);" class="w-full bg-gray-950 text-gray-100 border border-gray-600 rounded-xl px-3 py-2.5 text-base sm:text-sm focus:outline-none focus:border-emerald-500 cursor-pointer">
                            <option value="de">Deutsch</option>
                            <option value="en">English</option>
                        </select>
                    </div>
                    <div>
                        <label for="fontSizeSelect" class="block text-sm sm:text-xs font-medium text-gray-300 mb-1.5" data-i18n="fontSizeLabel">Schriftgröße</label>
                        <select id="fontSizeSelect" onchange="setZoom(parseInt(this.value, 10));" class="w-full bg-gray-950 text-gray-100 border border-gray-600 rounded-xl px-3 py-2.5 text-base sm:text-sm focus:outline-none focus:border-emerald-500 cursor-pointer">
                            <option value="80">80 %</option>
                            <option value="90">90 %</option>
                            <option value="100">100 %</option>
                            <option value="110">110 %</option>
                            <option value="120">120 %</option>
                            <option value="130">130 %</option>
                            <option value="140">140 %</option>
                            <option value="150">150 %</option>
                        </select>
                    </div>
                    <div>
                        <button type="button"
                                id="celebrationSwitch"
                                role="switch"
                                aria-checked="true"
                                onclick="toggleCelebrationSetting();"
                                class="w-full flex items-center justify-between gap-3 bg-gray-950 hover:bg-gray-900 border border-gray-600 focus:outline-none focus:border-emerald-500 rounded-xl px-3 py-2.5 min-h-[44px] cursor-pointer transition-colors">
                            <span class="text-sm sm:text-xs font-medium text-gray-200 text-left" data-i18n="celebrationSettingLabel">Gewinn-Animation</span>
                            
                            <!-- Visueller Toggle-Switch -->
                            <span id="celebrationSwitchTrack" class="relative inline-flex h-6 w-11 shrink-0 items-center rounded-full bg-emerald-600 transition-colors duration-200">
                                <span id="celebrationSwitchThumb" class="inline-block h-4 w-4 transform rounded-full bg-white shadow transition-transform duration-200 translate-x-6"></span>
                            </span>
                        </button>
                    </div>
                    <div class="border-t border-gray-700 pt-2 flex flex-col gap-1 -mx-1">
                    <button onclick="exportSettings();" class="group w-full text-left px-3 py-2.5 text-sm sm:py-1.5 sm:text-xs rounded hover:bg-gray-700 text-gray-200 hover:text-white flex items-center gap-2 cursor-pointer transition-colors">
                        <span class="hover-wiggle inline-block transition-transform">💾</span> <span data-i18n="exportBtn">Export</span>
                    </button>
                    <button onclick="document.getElementById('importSettingsFile').click();" class="group w-full text-left px-3 py-2.5 text-sm sm:py-1.5 sm:text-xs rounded hover:bg-gray-700 text-gray-200 hover:text-white flex items-center gap-2 cursor-pointer transition-colors">
                        <span class="hover-wiggle inline-block transition-transform">📂</span> <span data-i18n="importBtn">Import</span>
                    </button>
                    <a href="https://discord.gg/trmXCtf" target="_blank" rel="noopener noreferrer" class="group w-full text-left px-3 py-2.5 text-sm sm:py-1.5 sm:text-xs rounded hover:bg-gray-700 text-gray-200 hover:text-white flex items-center gap-2 cursor-pointer transition-colors">
                        <span class="hover-wiggle w-4 h-4 inline-flex items-center justify-center shrink-0">
                            <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 127.14 96.36">
                                <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.79,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.81,11.1,105.25,105.25,0,0,0,32.25-16.15c2.63-27.29-4.53-51.17-21.45-72.15ZM42.45,65.69C36.18,65.69,31,60,31,53s5.18-12.72,11.45-12.72S53.9,46,53.88,53,48.72,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5.18-12.72,11.45-12.72S96.18,46,96.15,53,91,65.69,84.69,65.69Z"/>
                            </svg>
                        </span>
                        <span>Discord</span>
                    </a>
                    </div>
                </div>
            </div>
            <button
                class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 min-h-[40px] sm:min-h-0 sm:py-1.5 rounded-md text-lg sm:text-sm font-semibold transition-all flex items-center justify-center gap-1 shadow-lg cursor-pointer shrink-0"
                data-i18n-title="tocToggleTitle" onclick="toggleToc();"><span>📑</span> <span class="hidden sm:inline"
                    data-i18n="tocBtn">Inhalt</span></button>
        </div>
    </header>

    <!-- ========================================== -->
    <!-- MAIN APPLICATION LAYOUT                    -->
    <!-- ========================================== -->
    <main class="flex-1 flex flex-row overflow-hidden p-1.5 sm:p-3 gap-1.5 sm:gap-2 relative w-full max-w-full">
        
        <!-- Left Sidebar: Directory Tree Menu Container -->
        <aside
            class="fixed min-[1060px]:relative inset-y-0 left-0 w-72 min-[1060px]:w-[280px] bg-gray-800 border-r min-[1060px]:border border-gray-700 rounded-r-lg min-[1060px]:rounded-lg px-2 py-2 flex flex-col shrink-0 h-full overflow-hidden shadow-2xl min-[1060px]:shadow-lg z-30 transform -translate-x-full min-[1060px]:translate-x-0 transition-transform duration-200"
            id="sidebar">
            <div class="mb-2 border-b border-gray-700 pb-1.5 shrink-0 flex justify-between items-center">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-gray-400" data-i18n="directoriesTitle">
                    Verzeichnisse</h2><button
                    class="text-gray-400 hover:text-white text-base sm:text-xs px-3 py-1.5 sm:px-2 sm:py-1 rounded bg-gray-700 cursor-pointer"
                    data-i18n-title="close" onclick="toggleSidebar();">✕</button>
            </div>
            <div class="mb-2 shrink-0 flex flex-wrap gap-1" id="treeScopeBar" role="group" data-i18n-title="treeScopeLabel">
                <button type="button" data-tree-scope="all" onclick="setTreeScope('all');" aria-pressed="true"
                    class="px-2.5 py-1.5 text-xs sm:px-2 sm:py-1 sm:text-[11px] rounded border border-gray-700 bg-gray-900 text-gray-400 hover:text-white hover:bg-gray-700 cursor-pointer transition-colors">📚 <span data-i18n="treeScopeAll">Alle</span></button>
                <button type="button" data-tree-scope="favorites" onclick="setTreeScope('favorites');" aria-pressed="false"
                    class="px-2.5 py-1.5 text-xs sm:px-2 sm:py-1 sm:text-[11px] rounded border border-gray-700 bg-gray-900 text-gray-400 hover:text-white hover:bg-gray-700 cursor-pointer transition-colors">⭐ <span data-i18n="treeScopeFavorites">Favoriten</span></button>
                <button type="button" data-tree-scope="mine" onclick="setTreeScope('mine');" aria-pressed="false"
                    class="px-2.5 py-1.5 text-xs sm:px-2 sm:py-1 sm:text-[11px] rounded border border-gray-700 bg-gray-900 text-gray-400 hover:text-white hover:bg-gray-700 cursor-pointer transition-colors">🎮 <span data-i18n="treeScopeMine">Meine Spiele</span></button>
            </div>
            <div class="space-y-1 text-sm flex-1 overflow-y-auto pr-1" id="tree-container">
                <p class="text-gray-500 animate-pulse text-xs" data-i18n="loadingStructure">Lade Struktur...</p>
            </div>
        </aside>

        <!-- Left Panel Resizer Bar -->
        <div class="hidden min-[1060px]:flex w-2 bg-gray-800 hover:bg-emerald-500 cursor-ew-resize rounded transition-colors items-center justify-center group shrink-0"
            data-i18n-title="resizeWidth" id="resizer-left">
            <div class="h-8 w-0.5 bg-gray-600 group-hover:bg-gray-900 rounded-full"></div>
        </div>

        <!-- Center Section: Reading Pane & Document Viewer -->
        <section
            class="flex-1 bg-gray-800 border border-gray-700 rounded-lg px-2 pt-1 pb-2 sm:px-3 sm:pt-1 sm:pb-2 flex flex-col h-full overflow-hidden shadow-lg min-w-0 min-[1050px]:min-w-[450px] relative">
            
            <!-- Scroll Progress Indicator Bar -->
            <div class="absolute top-0 left-0 right-0 h-1 bg-gray-800 z-20">
                <div id="scrollProgressBar" class="h-full bg-emerald-500 transition-all duration-75" style="width: 0%;">
                </div>
            </div>

            <!-- Spoiler mode notice: part of the layout (covers nothing), visible as long as the mode is on -->
            <div id="spoilerBanner" role="status"
                class="hidden shrink-0 mt-1 mb-0.5 flex items-center justify-between gap-x-3 rounded-md border border-amber-600/60 bg-amber-900/30 px-2.5 py-1 text-xs text-amber-200">
                <span class="font-semibold min-w-0 leading-snug">🙈 <span id="spoilerBannerLabel">Spoilermodus aktiv</span></span>
                <button id="spoilerBannerBtn" type="button" onclick="toggleSpoilerMode();" title="Spoilermodus ausschalten: Lösungen wieder vollständig anzeigen"
                    class="shrink-0 px-3 py-1.5 sm:px-2 sm:py-0.5 font-semibold rounded border border-amber-500/70 text-amber-100 hover:bg-amber-800/50 hover:text-white whitespace-nowrap cursor-pointer transition-colors"><span id="spoilerBannerBtnText">Ausschalten</span></button>
            </div>

            <!-- In-Content Filter Header Bar, Report Button & Font Size Button -->
            <div id="readingPaneHeader" class="pt-1.5 pb-1 px-1 flex flex-wrap items-center gap-2 border-b border-gray-700/50 shrink-0 hidden">
                <div class="relative flex-1 min-w-[7rem]">
                    <input autocomplete="off"
                        class="w-full min-w-0 bg-gray-950 text-gray-200 border border-gray-700 rounded-md px-3 py-2 min-h-[44px] sm:min-h-0 sm:px-2.5 sm:py-1.5 pr-10 sm:pr-8 text-base sm:text-sm focus:outline-none focus:border-emerald-500 placeholder-gray-500 transition-colors"
                        data-i18n-placeholder="filterPlaceholder" id="contentFilterInput" oninput="debounceContentFilter(this.value);"
                        onkeydown="handleContentFilterKeydown(event);"
                        placeholder="Inhalt filtern..." type="text">
                    <button class="absolute right-3 top-1/2 -translate-y-1/2 p-1 text-gray-400 hover:text-white text-base sm:text-xs hidden focus:outline-none cursor-pointer"
                        id="clearContentFilterBtn" onclick="clearContentFilter();" title="Filter löschen">✕</button>
                </div>

                <!-- Buttons: stay together, right-aligned; when the pane gets too narrow they wrap below the filter field instead of leaving the screen -->
                <div class="flex flex-wrap items-center justify-end gap-2 ml-auto max-w-full">
                <!-- Favorite star & play status menu -->
                <button id="favoriteBtn" type="button" onclick="toggleCurrentFavorite();" aria-pressed="false"
                    class="shrink-0 bg-gray-950 hover:bg-gray-700 text-gray-400 border border-gray-700 min-w-[44px] min-h-[44px] sm:min-w-0 sm:min-h-0 px-3 py-2 sm:px-2.5 sm:py-1.5 text-lg sm:text-sm rounded-md cursor-pointer transition-colors flex items-center justify-center">☆</button>
                <div class="relative shrink-0" id="statusMenuContainer">
                    <button id="statusBtn" type="button" onclick="toggleStatusMenu();" aria-haspopup="true"
                        class="bg-gray-950 hover:bg-gray-700 text-gray-300 border border-gray-700 min-w-[44px] min-h-[44px] sm:min-w-0 sm:min-h-0 px-3 py-2 sm:px-2.5 sm:py-1.5 text-lg sm:text-sm rounded-md font-semibold cursor-pointer flex items-center justify-center gap-1.5 transition-colors">
                        <span id="statusBtnIcon">○</span>
                    </button>
                    <div id="statusDropdown" class="absolute top-full mt-1 right-0 bg-gray-800 border border-gray-700 rounded-lg shadow-2xl p-1.5 hidden flex flex-col gap-1 min-w-[190px] z-50">
                        <button type="button" data-status-option="" onclick="setCurrentGameStatus(this.dataset.statusOption);" class="w-full text-left px-3 py-2.5 text-sm sm:py-1.5 sm:text-xs rounded hover:bg-gray-700 text-gray-200 hover:text-white flex items-center gap-2 cursor-pointer transition-colors">
                            <span>○</span> <span data-i18n="statusNone">Kein Status</span>
                        </button>
                        <button type="button" data-status-option="playing" onclick="setCurrentGameStatus(this.dataset.statusOption);" class="w-full text-left px-3 py-2.5 text-sm sm:py-1.5 sm:text-xs rounded hover:bg-gray-700 text-gray-200 hover:text-white flex items-center gap-2 cursor-pointer transition-colors">
                            <span>🎮</span> <span data-i18n="statusPlaying">Ich spiele gerade</span>
                        </button>
                        <button type="button" data-status-option="done" onclick="setCurrentGameStatus(this.dataset.statusOption);" class="w-full text-left px-3 py-2.5 text-sm sm:py-1.5 sm:text-xs rounded hover:bg-gray-700 text-gray-200 hover:text-white flex items-center gap-2 cursor-pointer transition-colors">
                            <span>✅</span> <span data-i18n="statusDone">Fertig</span>
                        </button>
                    </div>
                </div>

            try { return localStorage.getItem(key); } catch (e) { return null; }

            try { localStorage.setItem(key, value); return true; } catch (e) { return false; }
        }
        function lsRemove(key) {
            try { localStorage.removeItem(key); } catch (e) { /* ignore */ }
        }
        function readJsonArray(key) {
            try {
                const v = JSON.parse(lsGet(key) || "[]");
                return Array.isArray(v) ? v.filter(x => typeof x === "string") : [];
            } catch (e) { return []; }
        }
        function readJsonObject(key) {
            try {
                const v = JSON.parse(lsGet(key) || "{}");
                return (v && typeof v === "object" && !Array.isArray(v)) ? v : {};
            } catch (e) { return {}; }
        }

        // Detect and initialize browser language setting
        function getBrowserLanguage() {
            const savedLang = lsGet("sgs_lang");
            if (savedLang === "de" || savedLang === "en") return savedLang;
            const browserLang = navigator.language || navigator.userLanguage;
            if (browserLang && browserLang.startsWith("en")) {
                return "en"
            }
            return "de"
        }
        let currentLang = getBrowserLanguage();
        document.getElementById("langSelect").value = currentLang;

        // Apply selected language translations across UI elements
        function setLanguage(lang) {
            currentLang = lang;
            lsSet("sgs_lang", lang);
            document.documentElement.lang = lang;
            document.querySelectorAll("[data-i18n]").forEach(el => {
                const key = el.getAttribute("data-i18n");
                if (translations[currentLang][key]) {
                    el.textContent = translations[currentLang][key]
                }
            });
            document.querySelectorAll("[data-i18n-title]").forEach(el => {
                const key = el.getAttribute("data-i18n-title");
                if (translations[currentLang][key]) {
                    el.setAttribute("title", translations[currentLang][key])
                }
            });
            document.querySelectorAll("[data-i18n-aria-label]").forEach(el => {
                const key = el.getAttribute("data-i18n-aria-label");
                if (translations[currentLang][key]) {
                    el.setAttribute("aria-label", translations[currentLang][key])
                }
            });
            document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
                const key = el.getAttribute("data-i18n-placeholder");
                if (translations[currentLang][key]) {
                    el.setAttribute("placeholder", translations[currentLang][key])
                }
            });
            if (!currentFilePath && structureData) {
                renderWelcomeScreen();
            } else if (currentFilePath) {
                // Re-render TOC and headings copy buttons dynamically to update localized tooltips & popups
                const viewer = document.getElementById("content-viewer");
                const tocContainer = document.getElementById("toc-container");
                if (viewer && tocContainer) {
                    viewer.querySelectorAll(".heading-copy-btn").forEach(btn => btn.remove());
                    viewer.querySelectorAll(HEADING_SELECTOR).forEach(h => h.classList.remove("group", "relative"));
                    generateToc(viewer, tocContainer);
                    setupScrollSpy(viewer, tocContainer);
                }
                updateGameControls();
                updateSpoilerButton();
                refreshSpoilerUi();
                if (structureData) {
                    filterTree(document.getElementById("searchInput").value);
                }
            }
        }

        function changeLanguage(lang) {
            // Save current tree scroll position and open folders before changing language
            const treeContainer = document.getElementById("tree-container");
            const treeScrollTop = treeContainer ? treeContainer.scrollTop : 0;

            const openFolders = new Set();
            document.querySelectorAll("#tree-container details").forEach(details => {
                if (details.open) {
                    const summary = details.querySelector("summary");
                    if (summary) {
                        openFolders.add(summary.textContent.trim());
                    }
                }
            });

            setLanguage(lang);
            handleGlobalSearch(document.getElementById("searchInput").value);

            // Restore open directory paths after tree re-render
            if (openFolders.size > 0) {
                document.querySelectorAll("#tree-container details").forEach(details => {
                    const summary = details.querySelector("summary");
                    if (summary && openFolders.has(summary.textContent.trim())) {
                        details.open = true;
                    }

        // --- SETTINGS & REPORT DROPDOWN MENUS ---

        function exportSettings() {
            toggleSettingsMenu();
            const data = {};
            // Only export this app's own keys (the origin is shared with other projects)
            try {
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key && key.startsWith("sgs_")) {
                        data[key] = localStorage.getItem(key);
                    }
                }
            } catch (e) { /* storage unavailable: export stays empty */ }
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            const dateStr = new Date().toISOString().split('T')[0];
            a.download = `simple-game-solutions-settings-${dateStr}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function importSettings(event) {
            toggleSettingsMenu();
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (typeof data !== 'object' || data === null) {
                        throw new Error("Invalid format");
                    }
                    if (Array.isArray(data)) {
                        throw new Error("Invalid format");
                    }
                    // Accept only this app's own keys with string values
                    const entries = Object.entries(data).filter(([key, value]) =>
                        key.startsWith("sgs_") && typeof value === "string" && value.length < 500000);
                    if (entries.length === 0) {
                        throw new Error("No valid settings found");
                    }
                    // Replace own keys only, never touch other data on this origin
                    Object.keys(localStorage)
                        .filter(key => key.startsWith("sgs_"))
                        .forEach(key => localStorage.removeItem(key));
                    entries.forEach(([key, value]) => localStorage.setItem(key, value));
                    migrateReadState();
                    alert(translations[currentLang].importSuccess || "Settings successfully imported!");
                    
                    currentLang = getBrowserLanguage();
                    document.getElementById("langSelect").value = currentLang;
                    setLanguage(currentLang);
                    initZoom();
                    initCelebrationSetting();
                    updateHomeBadge();
                    loadTreeScope();

                    const urlParams = new URLSearchParams(window.location.search);
                    const fileParam = urlParams.get('file');
                    const lastFile = getValidLastFile();

                    if (fileParam) {
                        await loadFile(fileParam, false, true);
                    } else if (lastFile) {
                        await loadFile(lastFile);
                    } else {
                        renderWelcomeScreen();
                    }
                } catch (err) {
                    alert(translations[currentLang].importError || "Error importing file.");
                } finally {
                    event.target.value = "";
                }
            };
            reader.readAsText(file);
        }

        // --- FONT ZOOM LOGIC (MATHEMATICAL PERCENTAGE SCALING) ---
        function initZoom() {
            const saved = parseInt(lsGet("sgs_font_scale") || "100", 10);
            setZoom(saved >= 50 && saved <= 200 ? saved : 100, false);
        }

        function setZoom(percent, save = true) {
            if (save) {
                lsSet("sgs_font_scale", percent);
            }
            
            // Scaled elements: Tree, Viewer, and TOC
            const zoomVal = percent + "%";
            const tree = document.getElementById("tree-container");
            const viewer = document.getElementById("content-viewer");
            const toc = document.getElementById("toc-container");

            [tree, viewer, toc].forEach(el => {
                if (el) {
                    el.style.zoom = zoomVal;
                }
            });

            // Keep the settings select in sync (add an entry for values not in the list, e.g. imported ones)
            const sel = document.getElementById("fontSizeSelect");
            if (sel) {
                if (![...sel.options].some(o => o.value === String(percent))) {
                    const opt = document.createElement("option");
                    opt.value = String(percent);
                    opt.textContent = percent + " %";
                    const next = [...sel.options].find(o => parseInt(o.value, 10) > percent);
                    sel.insertBefore(opt, next || null);
                }
                sel.value = String(percent);
            }
        }

        // Celebration animation setting

        // --- SECTION 2: GLOBAL STATE VARIABLES ---
        let structureData = null;
        let currentFilePath = null;
        let rawFileContent = null;
        let searchSelectedIndex = -1;
        let searchBlurTimeout = null;
        let isRestoringScroll = false;
        let targetPercentToRestore = null;
        let currentWelcomeTab = 'home';
        let scrollPercentBeforeFilter = null;

        // --- GITHUB LINKS: edit page and change history of a solution ---
        // path = path relative to the solutions folder, exactly as in structure.json
        const GITHUB_REPO = "AmigaMaster/Simple-Game-Solutions";
        const GITHUB_BRANCH = "master";
        const GITHUB_SOLUTIONS_DIR = "solutions";
        function githubSolutionUrl(kind, path) {
            // kind: "edit" (GitHub web editor) or "commits" (change history of this one file)
            const encoded = path.split("/").map(encodeURIComponent).join("/");
            return `https://github.com/${GITHUB_REPO}/${kind}/${GITHUB_BRANCH}/${GITHUB_SOLUTIONS_DIR}/${encoded}`;
        }

        // --- FILE INDEX (path -> node from structure.json) ---
        let fileIndex = new Map();
        function buildFileIndex() {
            fileIndex = new Map();
            (function walk(node) {
                if (!node) return;
                if (node.type === 'file') fileIndex.set(node.path, node);
                else if (node.children) node.children.forEach(walk);
            })(structureData);
        }

        function getNewestFiles(n = 20) {
            return Array.from(fileIndex.values())
                .sort((a, b) => new Date(b.last_modified) - new Date(a.last_modified))
                .slice(0, n);
        }

        // Returns the last opened file, or null if it no longer exists (and forgets it)
        function getValidLastFile() {
            const f = lsGet("sgs_last_file");
            if (!f) return null;
            if (fileIndex.size > 0 && !fileIndex.has(f)) {
                lsRemove("sgs_last_file");
                return null;
            }
            return f;
        }

        // --- READ STATE: path -> last_modified that the user has seen ---
        // A file counts as unread again as soon as it was modified after it was read.
        function readReadMap() {
            return readJsonObject("sgs_read_v2");
        }

        function isFileUnread(file, readMap) {
            const seen = readMap[file.path];
            if (!seen) return true;
            if (!file.last_modified) return false;
            return new Date(file.last_modified) > new Date(seen);
        }

        function getUnreadKind(file, readMap) {
            if (!isFileUnread(file, readMap)) return null;
            if (readMap[file.path]) return "updated";
            return file.status === "updated" ? "updated" : "new";
        }

        function formatBadgeDate(iso) {
            const date = new Date(iso);
            if (isNaN(date)) return "";
            return date.toLocaleDateString(currentLang === "de" ? "de-DE" : "en-GB", { year: "numeric", month: "2-digit", day: "2-digit" });
        }

        function unreadBadgeHtml(kind, file) {
            const tr = translations[currentLang];
            const modified = formatBadgeDate(file.last_modified);
            const created = file.created ? formatBadgeDate(file.created) : "";
            if (kind === "updated") {
                const title = (created ? tr.badgeUpdatedTitleAdded : tr.badgeUpdatedTitle).replace("{date}", modified).replace("{created}", created);
                return `<span title="${escapeHtml(title)}" class="bg-sky-400 text-gray-950 text-[10px] font-bold px-1.5 py-0.2 rounded ml-1 whitespace-nowrap inline-block">${escapeHtml(tr.badgeUpdated)}</span>`;
            }
            const title = tr.badgeNewTitle.replace("{date}", created || modified);
            return `<span title="${escapeHtml(title)}" class="bg-emerald-500 text-gray-950 text-[10px] font-bold px-1.5 py-0.2 rounded ml-1 whitespace-nowrap inline-block">${escapeHtml(tr.badgeNew)}</span>`;
        }

        function migrateReadState() {
            if (lsGet("sgs_read_modified_files") === null || fileIndex.size === 0) return;
            if (lsGet("sgs_read_v2") === null) {
                const map = {};
                readJsonArray("sgs_read_modified_files").forEach(p => {
                    const node = fileIndex.get(p);
                    if (node) map[p] = node.last_modified || new Date().toISOString();
                });
                writeJson("sgs_read_v2", map);
            }
            lsRemove("sgs_read_modified_files");
        }

        // Track recently used file paths in localStorage
        function trackRecentFile(filePath) {
            const recent = readJsonArray("sgs_recent_files").filter(p => p !== filePath);
            recent.unshift(filePath);
            writeJson("sgs_recent_files", recent.slice(0, 20));
            markFileAsRead(filePath);
        }

        function markFileAsRead(filePath) {
            const node = fileIndex.get(filePath);
            if (node) {
                const map = readReadMap();
                map[filePath] = node.last_modified || new Date().toISOString();
                writeJson("sgs_read_v2", map);
            }
            updateHomeBadge();
        }

        function markAllAsRead() {
            if (!structureData) return;
            const map = readReadMap();
            getNewestFiles(20).forEach(file => {
                map[file.path] = file.last_modified || new Date().toISOString();
            });
            writeJson("sgs_read_v2", map);
            renderWelcomeScreen('home');
            updateHomeBadge();
        }

        function getUnreadModifiedCount() {
            if (!structureData) return 0;
            const map = readReadMap();
            return getNewestFiles(20).filter(file => isFileUnread(file, map)).length;
        }

        // --- MY GAMES: favorites, play status and "continue reading" ---
        // Stored locally (sgs_favorites, sgs_game_status), so they are part of the settings export/import.
        const GAME_STATUSES = ["playing", "done"];

        function readFavorites() {
            return readJsonArray("sgs_favorites");
        }

        function isFavorite(path) {
            return readFavorites().includes(path);
        }

        function setFavorite(path, on) {
            const favs = readFavorites().filter(p => p !== path);
            if (on) favs.push(path);
            writeJson("sgs_favorites", favs);
            onGameStateChanged();
        }

        function toggleFavorite(path) {
            setFavorite(path, !isFavorite(path));
        }

        // Only known status values are accepted (settings files may contain anything)
        function readGameStatusMap() {
            const raw = readJsonObject("sgs_game_status");
            const map = {};
            Object.keys(raw).forEach(path => {
                if (GAME_STATUSES.includes(raw[path])) map[path] = raw[path];
            });
            return map;
        }

        function getGameStatus(path) {
            return readGameStatusMap()[path] || null;
        }

        function setGameStatus(path, status) {
            const map = readGameStatusMap();
            if (GAME_STATUSES.includes(status)) map[path] = status;
            else delete map[path];
            writeJson("sgs_game_status", map);
            onGameStateChanged();
        }

        function getStatusIcon(status) {
            return status === "playing" ? "🎮" : (status === "done" ? "✅" : "○");
        }

        function getStatusText(status) {
            const t = translations[currentLang];
            return status === "playing" ? t.statusPlaying : (status === "done" ? t.statusDone : t.statusNone);
        }

        // Last saved reading position (0-100) or null
        function getReadingProgress(path) {
            const raw = lsGet(`sgs_scroll_percent_${path}`);
            if (raw === null) return null;
            const value = parseFloat(raw);
            return Number.isFinite(value) ? Math.min(100, Math.max(0, value)) : null;
        }

        function formatPercent(n) {
            return currentLang === "de" ? `${n} %` : `${n}%`;
        }

        // Read the stored state once and reuse it for many rows
        function getMarkerState() {
            return { favs: new Set(readFavorites()), map: readGameStatusMap() };
        }

        function gameMarkersText(path, state = getMarkerState()) {
            let text = state.favs.has(path) ? "⭐" : "";
            if (state.map[path] === "playing") text += "🎮";
            else if (state.map[path] === "done") text += "✅";
            return text;
        }

        function gameMarkersHtml(path, state) {
            const text = gameMarkersText(path, state);
            return text ? `<span class="text-[11px] shrink-0">${text}</span>` : "";
        }

        function refreshTreeMarkers() {
            const container = document.getElementById("tree-container");
            if (!container) return;
            const state = getMarkerState();
            container.querySelectorAll("div[data-filepath]").forEach(row => {
                const markers = row.querySelector(".game-markers");
                if (markers) markers.textContent = gameMarkersText(row.dataset.filepath, state);
            });

        function onGameStateChanged() {

        // --- STATUS MENU FOR ROWS IN "MY GAMES" (one shared floating menu, same look as in the reading header) ---
        let statusPopupEl = null;
        let statusPopupPath = null;

        function getStatusPopup() {
            if (statusPopupEl) return statusPopupEl;

        function closeGameStatusPopup() {
            if (statusPopupEl) statusPopupEl.classList.add("hidden");

        }

        function toggleGameStatusPopup(anchor, path) {
            const popup = getStatusPopup();
            if (statusPopupPath === path && !popup.classList.contains("hidden")) {
                closeGameStatusPopup();
                return;
            }
            const tr = translations[currentLang];
            const current = getGameStatus(path) || "";
            popup.innerHTML = [["", "○", tr.statusNone], ["playing", "🎮", tr.statusPlaying], ["done", "✅", tr.statusDone]]
                .map(([value, icon, label]) => `<button type="button" role="menuitem" data-popup-status="${value}" class="w-full text-left px-3 py-2.5 text-sm sm:py-1.5 sm:text-xs rounded hover:bg-gray-700 flex items-center gap-2 cursor-pointer transition-colors ${value === current ? "bg-gray-700 text-emerald-300" : "text-gray-200 hover:text-white"}"><span>${icon}</span> <span>${escapeHtml(label)}</span></button>`)
                .join("");
            statusPopupPath = path;

            // Measure while invisible, then place below the button (above it if there is no room), right-aligned
            popup.style.visibility = "hidden";
            popup.classList.remove("hidden");
            const rect = anchor.getBoundingClientRect();
            const width = popup.offsetWidth, height = popup.offsetHeight;
            const left = Math.min(Math.max(8, rect.right - width), Math.max(8, window.innerWidth - width - 8));
            let top = rect.bottom + 4;
            if (top + height > window.innerHeight - 8) top = Math.max(8, rect.top - height - 4);
            popup.style.left = `${left}px`;
            popup.style.top = `${top}px`;
            popup.style.visibility = "";
        }

        // One row of the "My Games" tab: open button + star toggle + status cycle button
        function gameRowHtml(path, state) {

            </div>`;

        function renderMyGamesHtml() {
            const t = translations[currentLang];
            const state = getMarkerState();
            const recent = readJsonArray("sgs_recent_files");
            const rank = path => { const i = recent.indexOf(path); return i === -1 ? Infinity : i; };
            const sortPaths = paths => paths.sort((a, b) =>
                (rank(a) - rank(b)) || fileIndex.get(a).name.localeCompare(fileIndex.get(b).name));
            const known = path => fileIndex.has(path);
            const byStatus = wanted => Object.keys(state.map).filter(path => state.map[path] === wanted && known(path));

            const sections = [
                { icon: "⭐", title: t.mineFavorites, paths: Array.from(state.favs).filter(known) },
                { icon: "🎮", title: t.minePlaying, paths: byStatus("playing") },
                { icon: "✅", title: t.mineDone, paths: byStatus("done") }
            ].filter(section => section.paths.length > 0);

            if (sections.length === 0) {
                return `<p class="text-center text-gray-500 text-xs italic py-4">${escapeHtml(t.mineEmpty)}</p>`;
            }
            return sections.map(section => `<div class="mb-5">

        // Count total file objects inside directory structure JSON
        function countFileObjects(obj) {
            let count = 0;
            if (obj && typeof obj === 'object') {
                if (obj.type === 'file') {
                    count++;
                }
                for (let key in obj) {
                    count += countFileObjects(obj[key]);
                }
            }

        // --- HELPER: GET CLEANED GAME TITLE FROM FILE PATH ---
        function getCleanGameTitle() {
            if (!currentFilePath) return '';
            // Get raw file name (e.g. "Blazing Dragons-IT.md" or "Blazing Dragons-DE.md")
            const rawFileName = currentFilePath.split('/').pop();
            // Remove extension (.md, .txt, etc.)
            let title = rawFileName.replace(/\.(md|txt)$/i, '');
            // Remove everything from the last "-" onwards (covers -IT, -DE, -EN, etc.)
            const lastDashIndex = title.lastIndexOf('-');
            if (lastDashIndex !== -1) {
                title = title.substring(0, lastDashIndex);
            }
            // Replace remaining underscores/hyphens with spaces for clean search query
            title = title.replace(/[-_]/g, ' ').trim();
            return title;
        }

        // --- REPORT ISSUE ON GITHUB ---
        function reportIssue() {
            toggleReportMenu();
            if (!currentFilePath) return;

            const t = translations[currentLang];
            const fileName = currentFilePath.split('/').pop().replace(/\.(md|txt)$/i, '');
            
            // Find last modified date for current file from structureData
            let lastModStr = '';
            if (structureData) {
                function searchNode(node) {
                    if (!node) return null;
                    if (node.type === 'file' && node.path === currentFilePath) return node;
                    if (node.children) {
                        for (const child of node.children) {
                            const res = searchNode(child);
                            if (res) return res;
                        }
                    }
                    return null;
                }
                const fNode = searchNode(structureData);
                if (fNode && fNode.last_modified) {
                    lastModStr = new Date(fNode.last_modified).toLocaleDateString('de-DE', { year: 'numeric', month: '2-digit', day: '2-digit' });
                }
            }

            // Calculate current scroll percentage and generate direct jump link
            const viewer = document.getElementById("content-viewer");
            const maxScroll = viewer ? viewer.scrollHeight - viewer.clientHeight : 0;
            const scrollPercent = maxScroll > 0 ? Math.round((viewer.scrollTop / maxScroll) * 100) : 0;

            const baseUrl = window.location.href.split('?')[0].split('#')[0];
            const issueLink = `${baseUrl}?file=${encodeURIComponent(currentFilePath)}&scroll=${scrollPercent}`;

            // Get currently active chapters from Table of Contents (ignoring copy buttons / popup texts)
            const activeChapterEls = document.querySelectorAll('#toc-container > div.bg-gray-700');
            let activeChapters = [];
            activeChapterEls.forEach(row => {
                const clone = row.cloneNode(true);
                clone.querySelectorAll('button, span').forEach(el => el.remove());
                const chapterText = clone.textContent.trim();
                if (chapterText) activeChapters.push(chapterText);
            });

            const activeChapterText = activeChapters.length > 0 
                ? activeChapters.join(', ') 
                : t.issueEntireDoc;

            const title = `${t.issueTitlePrefix}: ${fileName}`;
            
            const body = `## ${t.issueSectionWhere}
**Walkthrough:** [\`${currentFilePath}\`](${issueLink})
**${t.issueLastModifiedLabel}:** ${lastModStr || '-'}
**${t.issueChapterLabel}:** ${activeChapterText}
**${t.issuePositionLabel}:** ${scrollPercent}%

---

## ${t.issueSectionWhat}
${t.issueSectionWhatDesc}


---

## ${t.issueSectionSuggest}
${t.issueSectionSuggestDesc}
`;

            const issueUrl = `https://github.com/AmigaMaster/Simple-Game-Solutions/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}&labels=bug`;
            window.open(issueUrl, '_blank', 'noopener,noreferrer');
        }

        // --- SECTION 5: GLOBAL SEARCH SYSTEM & DROPDOWN ---
        // Helper to evaluate search terms with support for AND/OR clauses
        function matchQuery(nameLower, query) {
            const q = query.trim();
            if (!q) return true;
            const orClauses = q.toLowerCase().split(/\b(?:or|oder)\b/);
            return orClauses.some(clause => {
                const cleanClause = clause.replace(/\b(?:and|und)\b/g, " ");
                const terms = cleanClause.split(/\s+/).filter(t => t.length > 0);
                if (terms.length === 0) return false;
                return terms.every(term => nameLower.includes(term))
            })
        }

        function handleSearchFocus() {
            if (searchBlurTimeout) clearTimeout(searchBlurTimeout);
            const searchInput = document.getElementById("searchInput");
            if (searchInput && searchInput.value.trim().length > 0) {
                handleGlobalSearch(searchInput.value);
            }
        }

        function handleSearchBlur() {
            searchBlurTimeout = setTimeout(() => {
                const searchContainer = document.getElementById("searchInput").parentElement;
                const dropdown = document.getElementById("searchDropdown");
                const active = document.activeElement;
                if (!searchContainer.contains(active) && !dropdown.contains(active)) {
                    dropdown.classList.add("hidden");
                }
            }, 200);
        }

        function handleGlobalSearch(query) {
            searchSelectedIndex = -1;
            const clearBtn = document.getElementById("clearSearchBtn");
            const copyBtn = document.getElementById("copySearchBtn");
            if (query.trim().length > 0) {
                clearBtn.classList.remove("hidden");
                if (copyBtn) copyBtn.classList.remove("hidden");
            } else {
                clearBtn.classList.add("hidden");
                if (copyBtn) copyBtn.classList.add("hidden");
            }
            filterTree(query);
            const dropdown = document.getElementById("searchDropdown");
            const q = query.trim();
            const searchInput = document.getElementById("searchInput");
            const searchContainer = searchInput.parentElement;
            const active = document.activeElement;
            const isFocusedInSearch = searchContainer.contains(active) || dropdown.contains(active);
            
            if (!q || !structureData || !isFocusedInSearch) {
                dropdown.innerHTML = "";
                dropdown.scrollTop = 0;
                dropdown.classList.add("hidden");
                return
            }
            const matchingFiles = Array.from(fileIndex.values())
                .filter(file => matchQuery(file.name.toLowerCase(), q));

            const qLower = q.toLowerCase();
            if (qLower === "4823" || qLower.includes("call edna") || qLower.includes("edna anrufen")) {
                matchingFiles.unshift({
                    name: "📞 Rufe Edna an...",
                    path: "https://www.maniac-mansion-mania.com",
                    isExternal: true
                });
            }
            if (qLower === "dksn" || qLower.includes("das klappt so nicht")) {
                matchingFiles.unshift({
                    name: "🕹 Gleichgesinnte gefunden...",
                    path: "https://www.dasklapptsonicht.de",
                    isExternal: true
                });
            }

            if (matchingFiles.length === 0) {
                dropdown.innerHTML = `<div class="p-3 text-xs sm:text-sm text-gray-400 italic">${translations[currentLang].noResults}</div>`;
                dropdown.scrollTop = 0;
                dropdown.classList.remove("hidden");
                positionSearchDropdown();
                return
            }
            let html = "";
            matchingFiles.forEach((file) => {
                const icon = file.isExternal ? "🌐" : "📄";
                html += `<button type="button" data-path="${escapeHtml(file.path)}" data-external="${file.isExternal ? 'true' : 'false'}" class="search-item w-full text-left px-4 py-2.5 text-xs sm:text-sm text-gray-200 hover:bg-gray-700 hover:text-white transition-colors border-b border-gray-700/50 last:border-b-0 flex items-center gap-2 cursor-pointer focus:outline-none">
                    <span>${icon}</span> <span class="font-medium">${escapeHtml(file.name)}</span>
                </button>`
            });
            dropdown.innerHTML = html;
            dropdown.scrollTop = 0;
            dropdown.classList.remove("hidden");
            positionSearchDropdown();
            searchSelectedIndex = 0;
            updateDropdownHighlight(dropdown.querySelectorAll("button.search-item"));
        }

        // Highlight selected dropdown search item during keyboard navigation
        function updateDropdownHighlight(items) {
            items.forEach((item, idx) => {
                if (idx === searchSelectedIndex) {
                    item.classList.add("bg-gray-700", "text-white");
                    item.classList.remove("text-gray-200");
                    item.scrollIntoView({ block: 'nearest' });
                } else {
                    item.classList.remove("bg-gray-700", "text-white");
                    item.classList.add("text-gray-200");
                }
            });
        }

        // Global search input keyboard handler (Arrows, PageUp/Down, Enter, Escape)
        function handleSearchInputKeydown(e) {
            // Fast typing + Enter: first apply the search for the complete input, then act on its first result
            if (e.key === "Enter") flushPendingGlobalSearch();
            const dropdown = document.getElementById("searchDropdown");
            const items = dropdown.querySelectorAll("button.search-item");
            const pageSize = 8;

            if (e.key === "ArrowDown") {
                if (!dropdown.classList.contains("hidden") && items.length > 0) {
                    e.preventDefault();
                    searchSelectedIndex = Math.min(searchSelectedIndex + 1, items.length - 1);
                    updateDropdownHighlight(items);
                }
            } else if (e.key === "ArrowUp") {
                if (!dropdown.classList.contains("hidden") && items.length > 0) {
                    e.preventDefault();
                    searchSelectedIndex = Math.max(searchSelectedIndex - 1, -1);
                    updateDropdownHighlight(items);
                }
            } else if (e.key === "PageDown") {
                if (!dropdown.classList.contains("hidden") && items.length > 0) {
                    e.preventDefault();
                    searchSelectedIndex = searchSelectedIndex === -1 
                        ? Math.min(pageSize - 1, items.length - 1) 
                        : Math.min(searchSelectedIndex + pageSize, items.length - 1);
                    updateDropdownHighlight(items);
                }
            } else if (e.key === "PageUp") {
                if (!dropdown.classList.contains("hidden") && items.length > 0) {
                    e.preventDefault();
                    searchSelectedIndex = Math.max(searchSelectedIndex - pageSize, 0);
                    updateDropdownHighlight(items);
                }
            } else if (e.key === "Escape") {
                e.preventDefault();
                clearSearch();
            } else if (e.key === "Enter") {
                if (!dropdown.classList.contains("hidden") && searchSelectedIndex >= 0 && searchSelectedIndex < items.length) {
                    e.preventDefault();
                    items[searchSelectedIndex].click();
                } else {
                    e.preventDefault();
                    dropdown.classList.add("hidden");
                    
                    if (!isSidebarOpen()) setSidebarOpen(true);
                }
            }
        }

        // Clear search input state
        function clearSearch() {
            cancelPendingGlobalSearch();
            searchSelectedIndex = -1;
            const input = document.getElementById("searchInput");
            input.value = "";
            handleGlobalSearch("");
            document.getElementById("searchDropdown").classList.add("hidden");
            document.getElementById("clearSearchBtn").classList.add("hidden");
            const copyBtn = document.getElementById("copySearchBtn");
            if (copyBtn) copyBtn.classList.add("hidden");
            
            setTimeout(() => {
                if (isDesktopDevice()) input.focus();
            }, 0);
        }

        async function selectSearchResult(path, isExternal = false) {

            }
        }

        // Global click listener to close search dropdown when clicking outside
        window.addEventListener("click", e => {
            const searchContainer = document.getElementById("searchInput").parentElement;
            const dropdown = document.getElementById("searchDropdown");
            if (!searchContainer.contains(e.target) && !dropdown.contains(e.target)) {
                dropdown.classList.add("hidden")
            }
        });

        // Desktop (>= 640px): the result list is as wide as its content, but never narrower than the search field
        // and never wider than the space to the right edge of the window. Small screens keep the full-width list.
        function positionSearchDropdown() {
            const dropdown = document.getElementById("searchDropdown");
            const input = document.getElementById("searchInput");
            if (!dropdown || !input) return;
            if (window.innerWidth < 640) {
                ["left", "right", "width", "minWidth", "maxWidth"].forEach(prop => { dropdown.style[prop] = ""; });
                return;
            }
            const field = input.getBoundingClientRect();
            const header = dropdown.parentElement.getBoundingClientRect();
            dropdown.style.left = `${field.left - header.left}px`;
            dropdown.style.right = "auto";
            dropdown.style.width = "max-content";
            dropdown.style.minWidth = `${field.width}px`;
            dropdown.style.maxWidth = `${Math.max(field.width, window.innerWidth - field.left - 12)}px`;
        }
        window.addEventListener("resize", positionSearchDropdown);

        let searchTimeout;
        let globalSearchPending = false;
        function debounceGlobalSearch(query) {
            clearTimeout(searchTimeout);
            globalSearchPending = true;
            searchTimeout = setTimeout(() => {
                globalSearchPending = false;
                handleGlobalSearch(query);
            }, 200);
        }

        // Runs a search that is still waiting for its debounce delay right now
        function flushPendingGlobalSearch() {
            if (!globalSearchPending) return;
            clearTimeout(searchTimeout);
            globalSearchPending = false;
            handleGlobalSearch(document.getElementById("searchInput").value);
        }

        // Drops a search that has not run yet (field was cleared or a result was opened in the meantime)
        function cancelPendingGlobalSearch() {
            clearTimeout(searchTimeout);
            globalSearchPending = false;
        }

        let filterDebounceTimer = null;
        let contentFilterPending = false;
        function debounceContentFilter(query) {
            clearTimeout(filterDebounceTimer);
            contentFilterPending = true;
            filterDebounceTimer = setTimeout(() => {
                contentFilterPending = false;
                handleContentFilter(query);
            }, 200);
        }

        // Runs a filter that is still waiting for its debounce delay right now
        function flushPendingContentFilter() {
            if (!contentFilterPending) return;
            clearTimeout(filterDebounceTimer);
            contentFilterPending = false;
            handleContentFilter(document.getElementById("contentFilterInput").value);
        }

        // --- EVENT DELEGATION INITIALIZATION ---
        function initEventDelegation() {
            // 1. Search Dropdown Results Delegation
            const searchDropdown = document.getElementById("searchDropdown");
            if (searchDropdown) {
                searchDropdown.addEventListener("click", (e) => {
                    const item = e.target.closest("button.search-item");
                    if (!item) return;
                    const path = item.dataset.path;
                    const isExternal = item.dataset.external === "true";
                    selectSearchResult(path, isExternal);
                });
            }

            // 2. Directory Tree Menu Delegation
            const treeContainer = document.getElementById("tree-container");
            if (treeContainer) {
                treeContainer.addEventListener("click", async (e) => {
                    const fileRow = e.target.closest("div[data-filepath]");
                    if (!fileRow) return;
                    if (e.target.closest("button.file-copy-btn")) return;

                    const filePath = fileRow.dataset.filepath;
                    await loadFile(filePath);
                    if (window.innerWidth < 1060) {
                        closeAllOverlays();
                    }
                });
            }

            // 3. Table of Contents (TOC) Delegation
            const tocContainer = document.getElementById("toc-container");
            if (tocContainer) {
                tocContainer.addEventListener("click", (e) => {
                    if (e.target.closest("button.toc-copy-btn")) return;
                    const tocTextBtn = e.target.closest("[data-target-id]");
                    if (!tocTextBtn) return;

                    const targetId = tocTextBtn.dataset.targetId;
                    const heading = document.getElementById(targetId);
                    if (heading) {
                        heading.scrollIntoView({
                            behavior: "smooth",
                            block: "start"
                        });
                        if (window.innerWidth < 650) {
                            closeAllOverlays();
                        }
                    }
                });
            }

            // 4. Content Viewer Filter Click Delegation
            const contentViewer = document.getElementById("content-viewer");
            if (contentViewer) {
                contentViewer.addEventListener("click", (e) => {
                    const loadBtn = e.target.closest("button[data-load-path]");
                    if (loadBtn) {
                        loadFile(loadBtn.dataset.loadPath);
                        return;
                    }
                    const searchBox = document.getElementById("contentFilterInput");
                    const searching = !!searchBox && searchBox.value.trim().length > 0;
                    if (searching && spoilerModel) {
                        const resultHeading = e.target.closest("h1, h2, h3, h4, h5, h6");
                        if (resultHeading && searchChapterHits.has(resultHeading) && !e.target.closest("a, button")) {
                            toggleSearchChapter(resultHeading);
                            return;
                        }
                    }
                    const spoilerAction = searching ? null : e.target.closest("button[data-spoiler-action]");
                    if (spoilerAction) {
                        const controlEl = spoilerAction.closest("[data-spoiler-control]");
                        if (controlEl) spoilerChapterAction(Number(controlEl.dataset.spoilerControl), spoilerAction.dataset.spoilerAction, controlEl);
                        return;
                    }
                    const chapterHeading = searching ? null : e.target.closest("[data-spoiler-chapter]");
                    if (chapterHeading && !e.target.closest("a, button")) {
                        toggleSpoilerChapter(Number(chapterHeading.dataset.spoilerChapter));
                        return;
                    }
                    const favToggle = e.target.closest("button[data-fav-toggle]");
                    if (favToggle) {
                        toggleFavorite(favToggle.dataset.favToggle);
                        return;
                    }
                    const statusMenuBtn = e.target.closest("button[data-status-menu]");
                    if (statusMenuBtn) {
                        toggleGameStatusPopup(statusMenuBtn, statusMenuBtn.dataset.statusMenu);
                        return;
                    }
                    if (e.target.closest('button')) return;
                    const filterInput = document.getElementById("contentFilterInput");
                    const isFiltered = filterInput && filterInput.value.trim().length > 0;
                    if (!isFiltered) return;

                    const blockEl = e.target.closest("h1, h2, h3, h4, h5, h6, p, li, blockquote, pre");
                    if (!blockEl || blockEl.style.display === "none") return;

                    const targetEl = blockEl;
                    revealSpoilerStep(targetEl);   // a result from a closed chapter becomes visible before the filter is cleared
                    clearContentFilter();

                    setTimeout(() => {
                        targetEl.scrollIntoView({ behavior: "smooth", block: "start" });
                        targetEl.classList.add("bg-emerald-900/60", "transition-colors", "duration-1000");
                        setTimeout(() => {
                            targetEl.classList.remove("bg-emerald-900/60");
                        }, 1500);
                    }, 50);
                });
            }
        }

        // --- SECTION 6: IN-CONTENT FILTERING ---
        let contentFilterQuery = "";
        let searchRevealed = new Set();
        let searchRevealStarted = false;
        let searchHits = [];
        let searchChapterHits = new Map();

        function resetSearchReveal() {
            searchRevealed = new Set();
            searchRevealStarted = false;
        }

        function handleContentFilterKeydown(e) {
            if (e.key === "Escape") {
                e.preventDefault();
                clearContentFilter();
            } else if (e.key === "Enter") {
                flushPendingContentFilter();
                const input = document.getElementById("contentFilterInput");
                if (spoilerModel && input && input.value.trim() && searchHits.length > 0) {
                    e.preventDefault();
                    revealNextSearchHit();
                }
            }
        }

        function getDirectText(el) {
            const clone = el.cloneNode(true);
            clone.querySelectorAll("ul, ol").forEach(ul => ul.remove());
            return clone.textContent.replace(/\s+/g, ' ').trim();
        }

        // Helper function to escape special Regex characters
        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        // Removes search highlight tags and restores clean original text nodes
        function removeHighlights(container) {
            const marks = Array.from(container.querySelectorAll("mark.search-highlight"));
            if (marks.length === 0) return;

            marks.forEach(mark => {
                const parent = mark.parentNode;
                if (parent) {
                    parent.replaceChild(document.createTextNode(mark.textContent), mark);
                }
            });
            container.normalize();
        }

        // Applies search term highlighting inside text nodes using DocumentFragments
        function applyHighlights(el, terms) {
            if (terms.length === 0) return;
            const regex = new RegExp(`(${terms.map(escapeRegExp).join('|')})`, 'gi');

            const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, {
                acceptNode: (node) => {
                    if (!node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
                    if (node.parentElement && (
                        node.parentElement.tagName === 'SCRIPT' || 
                        node.parentElement.tagName === 'STYLE' || 
                        node.parentElement.tagName === 'BUTTON' || 
                        node.parentElement.classList.contains('search-highlight')
                    )) {
                        return NodeFilter.FILTER_REJECT;
                    }
                    return NodeFilter.FILTER_ACCEPT;
                }
            });

            const textNodes = [];
            let currentNode;
            while (currentNode = walker.nextNode()) {
                textNodes.push(currentNode);
            }

            textNodes.forEach(node => {
                const text = node.nodeValue;
                if (regex.test(text)) {
                    const frag = document.createDocumentFragment();
                    let lastIdx = 0;
                    regex.lastIndex = 0;
                    let match;
                    while ((match = regex.exec(text)) !== null) {
                        if (match.index > lastIdx) {
                            frag.appendChild(document.createTextNode(text.substring(lastIdx, match.index)));
                        }
                        const mark = document.createElement("mark");
                        mark.className = "search-highlight";
                        mark.textContent = match[0];
                        frag.appendChild(mark);
                        lastIdx = regex.lastIndex;
                    }
                    if (lastIdx < text.length) {
                        frag.appendChild(document.createTextNode(text.substring(lastIdx)));
                    }
                    node.parentNode.replaceChild(frag, node);
                }
            });
        }

        function handleContentFilter(filterQuery) {
            const clearBtn = document.getElementById("clearContentFilterBtn");
            const q = filterQuery.trim();
            const viewer = document.getElementById("content-viewer");
            if (!viewer) return;

            // The filter always searches the whole solution: while it is active, spoiler protection hides nothing
            viewer.classList.toggle("spoiler-searching", q.length > 0);
            updateSpoilerActionBar();
            if (q !== contentFilterQuery) {
                contentFilterQuery = q;
                resetSearchReveal();
            }

            if (q.length > 0 && scrollPercentBeforeFilter === null) {
                const maxScroll = viewer.scrollHeight - viewer.clientHeight;
                if (maxScroll > 0) {
                    scrollPercentBeforeFilter = (viewer.scrollTop / maxScroll) * 100;
                } else {
                    scrollPercentBeforeFilter = 0;
                }
            }

            if (q.length > 0) {
                clearBtn.classList.remove("hidden");
            } else {
                clearBtn.classList.add("hidden");
            }

            // Always remove previous highlights first
            removeHighlights(viewer);

            const allBlocks = viewer.querySelectorAll("h1, h2, h3, h4, h5, h6, p, li, blockquote, table, pre");

            if (!q) {
                viewer.querySelectorAll("h1, h2, h3, h4, h5, h6, p, li, blockquote, table, pre, ul, ol, div").forEach(el => {
                    el.style.display = "";
                    el.classList.remove("cursor-pointer", "hover:bg-gray-700/40", "rounded", "px-1", "transition-colors", "bg-emerald-900/60");
                    el.title = "";
                });

                hideSearchHitBar();
                if (spoilerModel) updateChapterHeadings();

                // Restore scroll position when filter is cleared
                if (scrollPercentBeforeFilter !== null) {
                    const targetPercent = scrollPercentBeforeFilter;
                    scrollPercentBeforeFilter = null;
                    requestAnimationFrame(() => {
                        const maxScroll = viewer.scrollHeight - viewer.clientHeight;
                        if (maxScroll > 0) {
                            viewer.scrollTop = (targetPercent / 100) * maxScroll;
                        }
                    });
                }

                if (typeof viewer.onscroll === 'function') {
                    viewer.onscroll();
                }
                return;
            }

            // Extract search terms for text highlighting
            const searchTerms = [];
            q.toLowerCase().split(/\b(?:or|oder)\b/).forEach(clause => {
                const cleanClause = clause.replace(/\b(?:and|und)\b/g, " ");
                cleanClause.split(/\s+/).filter(t => t.length > 0).forEach(term => {
                    if (!searchTerms.includes(term)) searchTerms.push(term);
                });
            });

            const matchingSet = new Set();
            allBlocks.forEach(el => {
                const text = el.tagName === 'LI' ? getDirectText(el) : el.textContent;
                if (matchQuery(text.toLowerCase(), filterQuery)) {
                    matchingSet.add(el);
                }
            });

            const isHeading = el => /^H[1-7]$/.test(el.tagName);
            const hits = [];
            const hitSet = new Set();
            const covered = new Map();
            const chapterHits = new Map();
            let chapterHeading = null;
            allBlocks.forEach(el => {
                if (isHeading(el)) {
                    chapterHeading = el;
                    return;
                }
                if (!matchingSet.has(el)) return;
                const owner = findCoveringHit(el, hitSet, viewer);
                if (owner) {
                    covered.get(owner).push(el);
                    return;
                }
                hits.push(el);
                hitSet.add(el);
                covered.set(el, []);
                if (chapterHeading) {
                    if (!chapterHits.has(chapterHeading)) chapterHits.set(chapterHeading, []);
                    chapterHits.get(chapterHeading).push(el);
                }
            });
            searchHits = hits;
            searchChapterHits = chapterHits;

            let shownMatches = matchingSet;
            if (spoilerModel) {
                if (!searchRevealStarted && hits.length > 0) {
                    searchRevealed.add(hits[0]);
                    searchRevealStarted = true;
                }
                shownMatches = new Set();
                hits.forEach(hit => {
                    if (searchRevealed.has(hit)) {
                        shownMatches.add(hit);
                        covered.get(hit).forEach(el => shownMatches.add(el));
                    }
                });
            }

            let currentHeading = null;
            const headingToMatchedBlocks = new Map();
