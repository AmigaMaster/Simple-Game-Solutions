<!DOCTYPE html>
<html class="h-[100dvh] overflow-hidden" lang="de">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" name="viewport">
    <title>Simple Game Solutions | Interactive Adventure Game Walkthroughs & Guides</title>
    <meta name="description" content="Discover interactive video game walkthroughs, guides, and solutions for classic adventure games with chapter search and reading progress tracking.">
    <meta name="keywords" content="walkthrough, game solution, adventure games, point and click, guide, gaming tips">
    <link rel="icon" type="res/img" href="favicon.gif">
    <meta property="og:title" content="Simple Game Solutions">
    <meta property="og:description" content="Discover and contribute to player-centric video game walkthroughs">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://amigamaster.github.io/Simple-Game-Solutions">
    <meta name="theme-color" content="#10b981">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Simple Game Solutions",
      "url": "https://amigamaster.github.io/Simple-Game-Solutions",
      "description": "Interactive and player-centric video game walkthroughs and guides for classic adventure games.",
      "inLanguage": ["de", "en"]
    }
    </script>

    <!-- External Libraries: Tailwind CSS Typography Plugin & Marked.js -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    
    <!-- Custom Typography & Markdown Code Block Styling -->
    <style>
        .prose code::before {
            content: "" !important;
        }

        .prose code::after {
            content: "" !important;
        }

        .prose pre {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace !important;
            white-space: pre !important;
            word-break: normal !important;
            overflow-x: auto !important;
            background-color: #030712 !important;
            border: 1px solid #374151 !important;
            border-radius: 0.375rem !important;
            padding: 1rem !important;
        }

        .prose pre code {
            font-family: inherit !important;
            background-color: transparent !important;
            border: none !important;
            border-radius: 0 !important;
            padding: 0 !important;
            font-weight: normal !important;
            color: #a7f3d0 !important;
            box-shadow: none !important;
        }

        /* Search Filter Term Highlighting */
        mark.search-highlight {
            background-color: #065f46 !important;
            color: #ffffff !important;
            padding: 0.1em 0.25em !important;
            border-radius: 0.25rem !important;
            font-weight: 600 !important;
            box-shadow: 0 0 0 1px #10b981 !important;
        }
        
        /* Animate icons */
        @keyframes subtle-wiggle {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(-8deg) scale(1.1); }
            75% { transform: rotate(8deg) scale(1.1); }
        }

        .group:hover .hover-wiggle {
            animation: subtle-wiggle 0.4s ease-in-out normal;
        }
    </style>
</head>

<body class="bg-gray-900 text-gray-100 h-[100dvh] w-screen overflow-hidden flex flex-col antialiased m-0 p-0">
    
    <!-- ========================================== -->
    <!-- HEADER & NAVIGATION BAR                    -->
    <!-- ========================================== -->
    <header
        class="bg-gray-800 border-b border-gray-700 px-2 sm:px-4 py-2 sm:py-3 shadow-md flex justify-between items-center shrink-0 relative z-40 gap-1.5 sm:gap-2 w-full max-w-full">
        
        <!-- Left Section: Sidebar Toggle & App Title -->
        <div class="flex items-center gap-1.5 sm:gap-4 shrink-0">
            <button
                class="bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 sm:px-3 py-1.5 rounded-md text-xs sm:text-sm font-semibold transition-all flex items-center gap-1 shadow-lg cursor-pointer shrink-0"
                data-i18n-title="menuToggleTitle" onclick="toggleSidebar();"><span>📁</span> <span
                    data-i18n="menuBtn">Menü</span></button>
            <h1 class="text-sm sm:text-lg font-bold text-emerald-400 cursor-pointer hover:text-emerald-300 transition-colors relative inline-flex items-center" data-i18n-title="goHomeTitle" onclick="goHome();" title="Zur Startseite">
                🏠<span class="hidden md:inline"> Simple Game Solutions</span>
                <span id="homeUnreadBadge" class="absolute -top-2 -right-2 w-4 h-4 bg-red-500/75 text-white text-[10px] font-bold px-2 py-0.2 rounded-full flex items-center justify-center hidden shadow">0</span>
            </h1>
        </div>

        <!-- Center Section: Global Search Input, Copy Link & Clear Search Buttons -->
        <div class="relative flex-1 max-w-xs sm:max-w-sm mx-1 sm:mx-2 flex items-center min-w-[70px] sm:min-w-[120px]">
            <input autocomplete="off"
                class="w-full bg-gray-950 text-gray-200 border border-gray-700 rounded-md px-2.5 sm:px-3 py-1.5 pr-14 text-xs sm:text-sm focus:outline-none focus:border-emerald-500 placeholder-gray-500 transition-colors"
                data-i18n-placeholder="searchPlaceholder" id="searchInput" onblur="handleSearchBlur();" onfocus="handleSearchFocus();" oninput="debounceGlobalSearch(this.value);"
                onkeydown="handleSearchInputKeydown(event);" placeholder="Suchen..." type="text">
            <button
                class="absolute right-8 text-emerald-400 hover:text-emerald-300 text-xs hidden focus:outline-none cursor-pointer"
                data-i18n-title="copySearchLinkTitle" id="copySearchBtn" onclick="copySearchLink();" title="Suche-Link kopieren">🔗</button>
            <button
                class="absolute right-2.5 text-gray-400 hover:text-white text-sm hidden focus:outline-none cursor-pointer"
                id="clearSearchBtn" onclick="clearSearch();" title="Suche löschen">✕</button>
        </div>

        <!-- Search Autocomplete Dropdown Container -->
        <div class="absolute left-2 right-2 sm:left-6 sm:right-6 top-full mt-1 bg-gray-800 border border-gray-700 rounded-md shadow-2xl max-h-80 overflow-y-auto z-50 hidden"
            id="searchDropdown"></div>

        <!-- Right Section: Settings Dropdown, Language Selector & Table of Contents (TOC) Toggle -->
        <div class="flex items-center gap-1.5 sm:gap-3 shrink-0">
            <!-- Hidden File Input for Importing Settings -->
            <input type="file" id="importSettingsFile" accept=".json" class="hidden" onchange="importSettings(event)">
            
            <!-- Settings Dropdown Menu (Gear Icon) -->
            <div class="relative shrink-0" id="settingsMenuContainer">
                <button onclick="toggleSettingsMenu();" class="bg-gray-700 hover:bg-gray-600 text-gray-300 hover:text-white px-2 py-1.5 rounded-md text-xs sm:text-sm border border-gray-600 focus:outline-none cursor-pointer transition-colors" data-i18n-title="settingsMenuTitle" title="Einstellungen">
                    ⚙️
                </button>
                <div id="settingsDropdown" class="absolute top-full mt-1 right-0 bg-gray-800 border border-gray-700 rounded-lg shadow-2xl p-1.5 hidden flex flex-col gap-1 min-w-[150px] z-50">
                    <button onclick="exportSettings();" class="group w-full text-left px-3 py-1.5 text-xs rounded hover:bg-gray-700 text-gray-200 hover:text-white flex items-center gap-2 cursor-pointer transition-colors">
                        <span class="hover-wiggle inline-block transition-transform">💾</span> <span data-i18n="exportBtn">Export</span>
                    </button>
                    <button onclick="document.getElementById('importSettingsFile').click();" class="group w-full text-left px-3 py-1.5 text-xs rounded hover:bg-gray-700 text-gray-200 hover:text-white flex items-center gap-2 cursor-pointer transition-colors">
                        <span class="hover-wiggle inline-block transition-transform">📂</span> <span data-i18n="importBtn">Import</span>
                    </button>
                    <a href="https://discord.gg/trmXCtf" target="_blank" rel="noopener noreferrer" class="group w-full text-left px-3 py-1.5 text-xs rounded hover:bg-gray-700 text-gray-200 hover:text-white flex items-center gap-2 cursor-pointer transition-colors">
                        <span class="hover-wiggle w-4 h-4 inline-flex items-center justify-center shrink-0">
                            <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 127.14 96.36">
                                <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.79,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.81,11.1,105.25,105.25,0,0,0,32.25-16.15c2.63-27.29-4.53-51.17-21.45-72.15ZM42.45,65.69C36.18,65.69,31,60,31,53s5.18-12.72,11.45-12.72S53.9,46,53.88,53,48.72,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5.18-12.72,11.45-12.72S96.18,46,96.15,53,91,65.69,84.69,65.69Z"/>
                            </svg>
                        </span>
                        <span>Discord</span>
                    </a>
                </div>
            </div>

            <select
                class="bg-gray-700 text-emerald-300 text-xs px-1.5 sm:px-2 py-1.5 rounded-md border border-gray-600 focus:outline-none cursor-pointer shrink-0"

                <option value="de">🇩🇪</option>
                <option value="en">🇬🇧</option>
            </select>
            <button
                class="bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 sm:px-3 py-1.5 rounded-md text-xs sm:text-sm font-semibold transition-all flex items-center gap-1 shadow-lg cursor-pointer shrink-0"
                data-i18n-title="tocToggleTitle" onclick="toggleToc();"><span>📑</span> <span
                    data-i18n="tocBtn">Inhalt</span></button>
        </div>
    </header>

    <!-- ========================================== -->
    <!-- MAIN APPLICATION LAYOUT                    -->
    <!-- ========================================== -->
    <main class="flex-1 flex flex-row overflow-hidden p-1.5 sm:p-3 gap-1.5 sm:gap-2 relative w-full max-w-full">
        
        <!-- Left Sidebar: Directory Tree Menu Container -->
        <aside
            class="fixed min-[1060px]:relative inset-y-0 left-0 w-72 min-[1060px]:w-[280px] bg-gray-800 border-r min-[1060px]:border border-gray-700 rounded-r-lg min-[1060px]:rounded-lg px-2 py-2 flex flex-col shrink-0 h-full overflow-hidden shadow-2xl min-[1060px]:shadow-lg z-30 transform -translate-x-full min-[1060px]:translate-x-0 transition-transform duration-200"
            id="sidebar">
            <div class="mb-2 border-b border-gray-700 pb-1.5 shrink-0 flex justify-between items-center">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-gray-400" data-i18n="directoriesTitle">
                    Verzeichnisse</h2><button
                    class="text-gray-400 hover:text-white text-xs px-2 py-1 rounded bg-gray-700 cursor-pointer"
                    data-i18n-title="close" onclick="toggleSidebar();">✕</button>
            </div>
            <div class="space-y-1 text-sm flex-1 overflow-y-auto pr-1" id="tree-container">
                <p class="text-gray-500 animate-pulse text-xs" data-i18n="loadingStructure">Lade Struktur...</p>
            </div>
        </aside>

        <!-- Left Panel Resizer Bar -->
        <div class="hidden min-[1060px]:flex w-2 bg-gray-800 hover:bg-emerald-500 cursor-ew-resize rounded transition-colors items-center justify-center group shrink-0"
            data-i18n-title="resizeWidth" id="resizer-left">
            <div class="h-8 w-0.5 bg-gray-600 group-hover:bg-gray-900 rounded-full"></div>
        </div>

        <!-- Center Section: Reading Pane & Document Viewer -->
        <section
            class="flex-1 bg-gray-800 border border-gray-700 rounded-lg px-2 pt-1 pb-2 sm:px-3 sm:pt-1 sm:pb-2 flex flex-col h-full overflow-hidden shadow-lg min-w-0 min-[1050px]:min-w-[450px] relative">
            
            <!-- Scroll Progress Indicator Bar -->
            <div class="absolute top-0 left-0 right-0 h-1 bg-gray-800 z-20">
                <div id="scrollProgressBar" class="h-full bg-emerald-500 transition-all duration-75" style="width: 0%;">
                </div>
            </div>

            <!-- In-Content Filter Header Bar, Report Button & Font Size Button -->
            <div id="readingPaneHeader" class="pt-1.5 pb-1 px-1 flex items-center gap-2 border-b border-gray-700/50 shrink-0 hidden">
                <div class="relative flex-1">
                    <input autocomplete="off"
                        class="w-full bg-gray-950 text-gray-200 border border-gray-700 rounded-md px-2.5 py-1.5 pr-8 text-xs sm:text-sm focus:outline-none focus:border-emerald-500 placeholder-gray-500 transition-colors"
                        data-i18n-placeholder="filterPlaceholder" id="contentFilterInput" oninput="debounceContentFilter(this.value);"
                        onkeydown="handleContentFilterKeydown(event);"
                        placeholder="Inhalt filtern..." type="text">
                    <button class="absolute right-2.5 top-2.5 text-gray-400 hover:text-white text-xs hidden focus:outline-none cursor-pointer"
                        id="clearContentFilterBtn" onclick="clearContentFilter();" title="Filter löschen">✕</button>
                </div>

                <!-- Report & Discussions Dropdown Menu -->
                <div class="relative shrink-0" id="reportMenuContainer">
                    <button onclick="toggleReportMenu();" class="bg-gray-950 hover:bg-gray-800 text-gray-300 hover:text-white border border-gray-700 hover:border-gray-600 px-2.5 py-1.5 rounded-md text-xs sm:text-sm font-semibold cursor-pointer flex items-center gap-1 transition-colors shadow-sm shrink-0" data-i18n-title="reportIssueTitle" title="Diskussion starten oder Fehler zu dieser Lösung auf GitHub melden">
                        <span>🗨️</span><span class="hidden sm:inline" data-i18n="reportIssueBtn">Nachricht</span>
                    </button>
                    <div id="reportDropdown" class="absolute top-full mt-1 right-0 bg-gray-800 border border-gray-700 rounded-lg shadow-2xl p-1.5 hidden flex flex-col gap-1 min-w-[200px] z-50">
                        <button onclick="openDiscussions();" class="group w-full text-left px-3 py-1.5 text-xs rounded hover:bg-gray-700 text-gray-200 hover:text-white flex items-center gap-2 cursor-pointer transition-colors">
                            <span class="hover-wiggle inline-block transition-transform">💬</span> <span data-i18n="githubDiscussionsBtn">GitHub Diskussionen</span>
                        </button>
                        <button onclick="reportIssue();" class="group w-full text-left px-3 py-1.5 text-xs rounded hover:bg-gray-700 text-gray-200 hover:text-white flex items-center gap-2 cursor-pointer transition-colors">
                            <span class="hover-wiggle inline-block transition-transform">🚨</span> <span data-i18n="githubIssueBtn">GitHub Issue eröffnen</span>
                        </button>
                    </div>
                </div>

                <!-- Font Size Button & Dropdown Menu inside Header -->
                <div class="relative shrink-0" id="fontOverlayContainer">
                    <button onclick="toggleFontMenu();" class="bg-gray-950 hover:bg-gray-700 text-emerald-400 border border-gray-700 px-2.5 py-1.5 rounded-md text-xs sm:text-sm font-bold cursor-pointer flex items-center justify-center transition-colors shadow-sm" data-i18n-title="fontZoomTitle" title="Schriftgröße anpassen">
                        Aa
                    </button>
                    <div id="fontMenuDropdown" class="absolute top-full mt-1 right-0 bg-gray-800 border border-gray-700 rounded-lg shadow-2xl p-2 hidden flex flex-col gap-1 min-w-[130px] z-50">
                        <div class="text-[10px] uppercase tracking-wider text-gray-400 px-2 py-0.5 border-b border-gray-700 mb-1" data-i18n="fontSizeLabel">Schriftgröße</div>
                        <button onclick="setZoom(80);" class="font-zoom-btn text-left px-2 py-1 text-xs rounded hover:bg-gray-700 text-gray-300 hover:text-white cursor-pointer">80%</button>
                        <button onclick="setZoom(90);" class="font-zoom-btn text-left px-2 py-1 text-xs rounded hover:bg-gray-700 text-gray-300 hover:text-white cursor-pointer">90%</button>
                        <button onclick="setZoom(100);" class="font-zoom-btn text-left px-2 py-1 text-xs rounded hover:bg-gray-700 text-gray-300 hover:text-white cursor-pointer font-bold text-emerald-400">100% (Standard)</button>
                        <button onclick="setZoom(110);" class="font-zoom-btn text-left px-2 py-1 text-xs rounded hover:bg-gray-700 text-gray-300 hover:text-white cursor-pointer">110%</button>
                        <button onclick="setZoom(120);" class="font-zoom-btn text-left px-2 py-1 text-xs rounded hover:bg-gray-700 text-gray-300 hover:text-white cursor-pointer">120%</button>
                        <button onclick="setZoom(130);" class="font-zoom-btn text-left px-2 py-1 text-xs rounded hover:bg-gray-700 text-gray-300 hover:text-white cursor-pointer">130%</button>
                        <button onclick="setZoom(140);" class="font-zoom-btn text-left px-2 py-1 text-xs rounded hover:bg-gray-700 text-gray-300 hover:text-white cursor-pointer">140%</button>
                        <button onclick="setZoom(150);" class="font-zoom-btn text-left px-2 py-1 text-xs rounded hover:bg-gray-700 text-gray-300 hover:text-white cursor-pointer">150%</button>
                    </div>
                </div>
            </div>

            <!-- Main Content Viewer Area (Markdown / Raw Text / Welcome Screen) -->
            <div class="prose prose-invert max-w-none flex-1 overflow-y-auto pr-2 pt-2 text-sm sm:text-base leading-relaxed prose-code:text-emerald-200/80 prose-code:bg-gray-800 prose-code:px-1.5 prose-code:py-0.5 prose-code:rounded prose-code:border prose-code:border-gray-700/40 prose-blockquote:border-emerald-500/30 prose-blockquote:bg-gray-800/40 prose-blockquote:text-gray-300/90"
                id="content-viewer">
                <div class="text-center text-gray-500 py-20">
                    <p class="text-base sm:text-lg" data-i18n="welcomeMessage">Wähle oben über die Suche oder links im Menü eine Lösung aus.</p>
                </div>
            </div>
        </section>

        <!-- Right Panel Resizer Bar -->
        <div class="hidden min-[650px]:flex w-2 bg-gray-800 hover:bg-emerald-500 cursor-ew-resize rounded transition-colors items-center justify-center group shrink-0"
            data-i18n-title="resizeWidth" id="resizer-right">
            <div class="h-8 w-0.5 bg-gray-600 group-hover:bg-gray-900 rounded-full"></div>
        </div>

        <!-- Right Sidebar: Table of Contents (TOC) Container -->
        <aside
            class="fixed min-[650px]:relative inset-y-0 right-0 w-64 min-[650px]:w-[260px] bg-gray-800 border-l min-[650px]:border border-gray-700 rounded-l-lg min-[650px]:rounded-lg px-2 py-2 flex flex-col shrink-0 h-full overflow-hidden shadow-2xl min-[650px]:shadow-lg z-30 transform translate-x-full min-[650px]:translate-x-0 transition-transform duration-200"
            id="toc-sidebar">
            <div class="mb-2 border-b border-gray-700 pb-1.5 shrink-0 flex justify-between items-center">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-gray-400" data-i18n="chaptersTitle">
                    Kapitel</h2><button
                    class="text-gray-400 hover:text-white text-xs px-2 py-1 rounded bg-gray-700 cursor-pointer"
                    data-i18n-title="close" onclick="toggleToc();">✕</button>
            </div>
            <div class="space-y-1 text-sm flex-1 overflow-y-auto pr-1" id="toc-container">
                <p class="text-gray-500 italic text-xs" data-i18n="noFileLoaded">Keine Datei geladen.</p>
            </div>
        </aside>
    </main>

        // Detect and initialize browser language setting
        function getBrowserLanguage() {
            const savedLang = localStorage.getItem("sgs_lang");
            if (savedLang) return savedLang;
            const browserLang = navigator.language || navigator.userLanguage;
            if (browserLang && browserLang.startsWith("en")) {
                return "en"
            }
            return "de"
        }
        let currentLang = getBrowserLanguage();
        document.getElementById("langSelect").value = currentLang;

        // Apply selected language translations across UI elements
        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem("sgs_lang", lang);
            document.querySelectorAll("[data-i18n]").forEach(el => {
                const key = el.getAttribute("data-i18n");
                if (translations[currentLang][key]) {
                    el.textContent = translations[currentLang][key]
                }
            });
            document.querySelectorAll("[data-i18n-title]").forEach(el => {
                const key = el.getAttribute("data-i18n-title");
                if (translations[currentLang][key]) {
                    el.setAttribute("title", translations[currentLang][key])
                }
            });
            document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
                const key = el.getAttribute("data-i18n-placeholder");
                if (translations[currentLang][key]) {
                    el.setAttribute("placeholder", translations[currentLang][key])
                }
            });
            if (!currentFilePath && structureData) {
                renderWelcomeScreen();
            } else if (currentFilePath) {
                // Re-render TOC and headings copy buttons dynamically to update localized tooltips & popups
                const viewer = document.getElementById("content-viewer");
                const tocContainer = document.getElementById("toc-container");
                if (viewer && tocContainer) {
                    viewer.querySelectorAll(".heading-copy-btn").forEach(btn => btn.remove());
                    viewer.querySelectorAll("h1, h2, h3, h4, h5, h6, h7").forEach(h => h.classList.remove("group", "relative"));
                    generateToc(viewer, tocContainer);
                    setupScrollSpy(viewer, tocContainer);
                }
                if (structureData) {
                    filterTree(document.getElementById("searchInput").value);
                }
            }
        }

        function changeLanguage(lang) {
            // Save current tree scroll position and open folders before changing language
            const treeContainer = document.getElementById("tree-container");
            const treeScrollTop = treeContainer ? treeContainer.scrollTop : 0;

            const openFolders = new Set();
            document.querySelectorAll("#tree-container details").forEach(details => {
                if (details.open) {
                    const summary = details.querySelector("summary");
                    if (summary) {
                        openFolders.add(summary.textContent.trim());
                    }
                }
            });

            setLanguage(lang);
            handleGlobalSearch(document.getElementById("searchInput").value);

            // Restore open directory paths after tree re-render
            if (openFolders.size > 0) {
                document.querySelectorAll("#tree-container details").forEach(details => {
                    const summary = details.querySelector("summary");
                    if (summary && openFolders.has(summary.textContent.trim())) {
                        details.open = true;
                    }
                });
            }

            // Restore tree scroll position
            if (treeContainer) {
                treeContainer.scrollTop = treeScrollTop;
            }
        }

        function exportSettings() {
            toggleSettingsMenu();
            const data = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                data[key] = localStorage.getItem(key);
            }
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            const dateStr = new Date().toISOString().split('T')[0];
            a.download = `simple-game-solutions-settings-${dateStr}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function importSettings(event) {
            toggleSettingsMenu();
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (typeof data !== 'object' || data === null) {
                        throw new Error("Invalid format");
                    }
                    localStorage.clear();
                    for (const [key, value] of Object.entries(data)) {
                        localStorage.setItem(key, value);
                    }
                    alert(translations[currentLang].importSuccess || "Settings successfully imported!");
                    
                    currentLang = getBrowserLanguage();
                    document.getElementById("langSelect").value = currentLang;
                    setLanguage(currentLang);
                    initZoom();
                    updateHomeBadge();

                    const urlParams = new URLSearchParams(window.location.search);
                    const fileParam = urlParams.get('file');
                    const lastFile = localStorage.getItem("sgs_last_file");

                    if (fileParam) {
                        await loadFile(fileParam, false, true);
                    } else if (lastFile) {
                        await loadFile(lastFile);
                    } else {
                        renderWelcomeScreen();
                    }
                } catch (err) {
                    alert(translations[currentLang].importError || "Error importing file.");
                } finally {
                    event.target.value = "";
                }
            };
            reader.readAsText(file);
        }

        // --- SECTION 2: GLOBAL STATE VARIABLES ---

        // Track recently used file paths in localStorage
        function trackRecentFile(filePath) {
            let recent = [];
            try {
                recent = JSON.parse(localStorage.getItem("sgs_recent_files") || "[]");
            } catch (e) {
                recent = [];
            }
            recent = recent.filter(p => p !== filePath);
            recent.unshift(filePath);
            if (recent.length > 20) {
                recent = recent.slice(0, 20);
            }
            localStorage.setItem("sgs_recent_files", JSON.stringify(recent));

            markFileAsRead(filePath);
        }

        function markFileAsRead(filePath) {
            let readPaths = [];
            try {
                readPaths = JSON.parse(localStorage.getItem("sgs_read_modified_files") || "[]");
            } catch (e) {
                readPaths = [];
            }
            if (!readPaths.includes(filePath)) {
                readPaths.push(filePath);
                localStorage.setItem("sgs_read_modified_files", JSON.stringify(readPaths));
            }
            updateHomeBadge();
        }

        function markAllAsRead() {
            if (!structureData) return;
            const allFiles = [];
            function collect(node) {
                if (!node) return;
                if (node.type === 'file') allFiles.push(node);
                else if (node.type === 'directory' && node.children) node.children.forEach(collect);
            }
            collect(structureData);
            allFiles.sort((a, b) => new Date(b.last_modified) - new Date(a.last_modified));
            const newest = allFiles.slice(0, 20);

            let readPaths = [];
            try {
                readPaths = JSON.parse(localStorage.getItem("sgs_read_modified_files") || "[]");
            } catch (e) {
                readPaths = [];
            }

            newest.forEach(file => {
                if (!readPaths.includes(file.path)) {
                    readPaths.push(file.path);
                }
            });
            localStorage.setItem("sgs_read_modified_files", JSON.stringify(readPaths));
            renderWelcomeScreen('modified');
            updateHomeBadge();
        }

        function getUnreadModifiedCount() {
            if (!structureData) return 0;
            const allFiles = [];
            function collect(node) {
                if (!node) return;
                if (node.type === 'file') allFiles.push(node);
                else if (node.type === 'directory' && node.children) node.children.forEach(collect);
            }
            collect(structureData);
            allFiles.sort((a, b) => new Date(b.last_modified) - new Date(a.last_modified));
            const newest = allFiles.slice(0, 20);

            let readPaths = [];
            try {
                readPaths = JSON.parse(localStorage.getItem("sgs_read_modified_files") || "[]");
            } catch (e) {
                readPaths = [];
            }

            let unreadCount = 0;
            newest.forEach(file => {
                if (!readPaths.includes(file.path)) {
                    unreadCount++;
                }
            });
            return unreadCount;
        }

        function updateHomeBadge() {
            const badge = document.getElementById("homeUnreadBadge");
            if (!badge) return;
            const count = getUnreadModifiedCount();
            if (count > 0) {
                badge.textContent = count;
                badge.classList.remove("hidden");
            } else {
                badge.classList.add("hidden");
            }
        }

        // Count total file objects inside directory structure JSON
        function countFileObjects(obj) {
            let count = 0;
            if (obj && typeof obj === 'object') {
                if (obj.type === 'file') {
                    count++;
                }
                for (let key in obj) {
                    count += countFileObjects(obj[key]);
                }
            }
            return count;
        }

        // --- HELPER: GET CLEANED GAME TITLE FROM FILE PATH ---
        function getCleanGameTitle() {
            if (!currentFilePath) return '';
            // Get raw file name (e.g. "Blazing Dragons-IT.md" or "Blazing Dragons-DE.md")
            const rawFileName = currentFilePath.split('/').pop();
            // Remove extension (.md, .txt, etc.)
            let title = rawFileName.replace(/\.(md|txt)$/i, '');
            // Remove everything from the last "-" onwards (covers -IT, -DE, -EN, etc.)
            const lastDashIndex = title.lastIndexOf('-');
            if (lastDashIndex !== -1) {
                title = title.substring(0, lastDashIndex);
            }
            // Replace remaining underscores/hyphens with spaces for clean search query
            title = title.replace(/[-_]/g, ' ').trim();
            return title;
        }

        // --- REPORT ISSUE ON GITHUB ---
        function reportIssue() {
            toggleReportMenu();
            if (!currentFilePath) return;

            const t = translations[currentLang];
            const fileName = currentFilePath.split('/').pop().replace(/\.(md|txt)$/i, '');
            
            // Find last modified date for current file from structureData
            let lastModStr = '';
            if (structureData) {
                function searchNode(node) {
                    if (!node) return null;
                    if (node.type === 'file' && node.path === currentFilePath) return node;
                    if (node.children) {
                        for (const child of node.children) {
                            const res = searchNode(child);
                            if (res) return res;
                        }
                    }
                    return null;
                }
                const fNode = searchNode(structureData);
                if (fNode && fNode.last_modified) {
                    lastModStr = new Date(fNode.last_modified).toLocaleDateString('de-DE', { year: 'numeric', month: '2-digit', day: '2-digit' });
                }
            }

            // Calculate current scroll percentage and generate direct jump link
            const viewer = document.getElementById("content-viewer");
            const maxScroll = viewer ? viewer.scrollHeight - viewer.clientHeight : 0;
            const scrollPercent = maxScroll > 0 ? Math.round((viewer.scrollTop / maxScroll) * 100) : 0;

            const baseUrl = window.location.href.split('?')[0].split('#')[0];
            const issueLink = `${baseUrl}?file=${encodeURIComponent(currentFilePath)}&scroll=${scrollPercent}`;

            // Get currently active chapters from Table of Contents (ignoring copy buttons / popup texts)
            const activeChapterEls = document.querySelectorAll('#toc-container > div.bg-gray-700');
            let activeChapters = [];
            activeChapterEls.forEach(row => {
                const clone = row.cloneNode(true);
                clone.querySelectorAll('button, span').forEach(el => el.remove());
                const chapterText = clone.textContent.trim();
                if (chapterText) activeChapters.push(chapterText);
            });

            const activeChapterText = activeChapters.length > 0 
                ? activeChapters.join(', ') 
                : t.issueEntireDoc;

            const title = `${t.issueTitlePrefix}: ${fileName}`;
            
            const body = `## ${t.issueSectionWhere}
**Walkthrough:** [\`${currentFilePath}\`](${issueLink})
**${t.issueLastModifiedLabel}:** ${lastModStr || '-'}
**${t.issueChapterLabel}:** ${activeChapterText}
**${t.issuePositionLabel}:** ${scrollPercent}%

---

## ${t.issueSectionWhat}
${t.issueSectionWhatDesc}


---

## ${t.issueSectionSuggest}
${t.issueSectionSuggestDesc}
`;

            const issueUrl = `https://github.com/AmigaMaster/Simple-Game-Solutions/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}&labels=bug`;
            window.open(issueUrl, '_blank', 'noopener,noreferrer');
        }

        // --- SECTION 4: APPLICATION INITIALIZATION (BOOTSTRAP) ---
        async function init() {
            setLanguage(currentLang);
            initZoom();
            initEventDelegation();
            try {
                const response = await fetch("structure.json");
                structureData = await response.json();

                renderTree(structureData, document.getElementById("tree-container"));
                updateHomeBadge();

                const urlParams = new URLSearchParams(window.location.search);
                const fileParam = urlParams.get('file');
                const filterParam = urlParams.get('filter');
                const searchParam = urlParams.get('search');
                const lastFile = localStorage.getItem("sgs_last_file");

                if (searchParam) {
                    const searchInput = document.getElementById("searchInput");
                    if (searchInput) {
                        searchInput.value = searchParam;
                        handleGlobalSearch(searchParam);
                    }
                }

                if (fileParam) {
                    await loadFile(fileParam, false, true);
                    if (filterParam) {
                        const filterInput = document.getElementById("contentFilterInput");
                        if (filterInput) {
                            filterInput.value = filterParam;
                            handleContentFilter(filterParam);
                        }
                    }
                } else if (lastFile) {
                    await loadFile(lastFile);
                } else {
                    renderWelcomeScreen();
                    const searchInput = document.getElementById("searchInput");
                    if (searchInput && !searchParam && isDesktopDevice()) searchInput.focus();
                }
            } catch (error) {
                console.error("Error loading structure:", error);
                document.getElementById("tree-container").innerHTML = `<p class="text-red-400 text-xs">${translations[currentLang].errorLoadingStruct}</p>`
            }
        }

            const fileParam = urlParams.get('file');

            const searchParam = urlParams.get('search');

            if (searchParam) {
                const searchInput = document.getElementById("searchInput");
                if (searchInput) {
                    searchInput.value = searchParam;
                    handleGlobalSearch(searchParam);

            } else {
                const searchInput = document.getElementById("searchInput");
                if (searchInput && searchInput.value) {
                    clearSearch();
                }
            }

            if (fileParam) {
                await loadFile(fileParam, false, true);
                if (filterParam) {
                    const filterInput = document.getElementById("contentFilterInput");
                    if (filterInput) {
                        filterInput.value = filterParam;
                        handleContentFilter(filterParam);
                    }
                }
            } else {
                goHome(true);
            }
        });

        // --- SECTION 5: GLOBAL SEARCH SYSTEM & DROPDOWN ---
        // Helper to evaluate search terms with support for AND/OR clauses
        function matchQuery(nameLower, query) {
            const q = query.trim();
            if (!q) return true;
            const orClauses = q.toLowerCase().split(/\b(?:or|oder)\b/);
            return orClauses.some(clause => {
                const cleanClause = clause.replace(/\b(?:and|und)\b/g, " ");
                const terms = cleanClause.split(/\s+/).filter(t => t.length > 0);
                if (terms.length === 0) return false;
                return terms.every(term => nameLower.includes(term))
            })
        }

        function handleSearchFocus() {
            if (searchBlurTimeout) clearTimeout(searchBlurTimeout);
            const searchInput = document.getElementById("searchInput");
            if (searchInput && searchInput.value.trim().length > 0) {
                handleGlobalSearch(searchInput.value);
            }
        }

        function handleSearchBlur() {
            searchBlurTimeout = setTimeout(() => {
                const searchContainer = document.getElementById("searchInput").parentElement;
                const dropdown = document.getElementById("searchDropdown");
                const active = document.activeElement;
                if (!searchContainer.contains(active) && !dropdown.contains(active)) {
                    dropdown.classList.add("hidden");
                }
            }, 200);
        }

        function handleGlobalSearch(query) {
            searchSelectedIndex = -1;
            const clearBtn = document.getElementById("clearSearchBtn");
            const copyBtn = document.getElementById("copySearchBtn");
            if (query.trim().length > 0) {
                clearBtn.classList.remove("hidden");
                if (copyBtn) copyBtn.classList.remove("hidden");
            } else {
                clearBtn.classList.add("hidden");
                if (copyBtn) copyBtn.classList.add("hidden");
            }
            filterTree(query);
            const dropdown = document.getElementById("searchDropdown");
            const q = query.trim();
            const searchInput = document.getElementById("searchInput");
            const searchContainer = searchInput.parentElement;
            const active = document.activeElement;
            const isFocusedInSearch = searchContainer.contains(active) || dropdown.contains(active);
            
            if (!q || !structureData || !isFocusedInSearch) {
                dropdown.innerHTML = "";
                dropdown.scrollTop = 0;
                dropdown.classList.add("hidden");
                return
            }
            const matchingFiles = [];

            function collectFiles(node) {
                if (!node) return;
                if (node.type === "file") {
                    if (matchQuery(node.name.toLowerCase(), q)) {
                        matchingFiles.push(node)
                    }
                } else if (node.type === "directory" && node.children) {
                    node.children.forEach(child => collectFiles(child))
                }
            }
            collectFiles(structureData);

            const qLower = q.toLowerCase();
            if (qLower === "4823" || qLower.includes("call edna") || qLower.includes("edna anrufen")) {
                matchingFiles.unshift({
                    name: "📞 Rufe Edna an...",
                    path: "https://www.maniac-mansion-mania.com",
                    isExternal: true
                });
            }

            if (matchingFiles.length === 0) {
                dropdown.innerHTML = `<div class="p-3 text-xs sm:text-sm text-gray-400 italic">${translations[currentLang].noResults}</div>`;
                dropdown.scrollTop = 0;
                dropdown.classList.remove("hidden");
                return
            }
            let html = "";
            matchingFiles.forEach((file) => {
                const icon = file.isExternal ? "🌐" : "📄";
                html += `<button type="button" data-path="${file.path}" data-external="${file.isExternal ? 'true' : 'false'}" class="search-item w-full text-left px-4 py-2.5 text-xs sm:text-sm text-gray-200 hover:bg-gray-700 hover:text-white transition-colors border-b border-gray-700/50 last:border-b-0 flex items-center gap-2 cursor-pointer focus:outline-none">
                    <span>${icon}</span> <span class="font-medium">${file.name}</span>
                </button>`
            });
            dropdown.innerHTML = html;
            dropdown.scrollTop = 0;
            dropdown.classList.remove("hidden")
        }

        // Highlight selected dropdown search item during keyboard navigation
        function updateDropdownHighlight(items) {
            items.forEach((item, idx) => {
                if (idx === searchSelectedIndex) {
                    item.classList.add("bg-gray-700", "text-white");
                    item.classList.remove("text-gray-200");
                    item.scrollIntoView({ block: 'nearest' });
                } else {
                    item.classList.remove("bg-gray-700", "text-white");
                    item.classList.add("text-gray-200");
                }
            });
        }

        // Global search input keyboard handler (Arrows, PageUp/Down, Enter, Escape)
        function handleSearchInputKeydown(e) {
            const dropdown = document.getElementById("searchDropdown");
            const items = dropdown.querySelectorAll("button.search-item");
            const pageSize = 8;

            if (e.key === "ArrowDown") {
                if (!dropdown.classList.contains("hidden") && items.length > 0) {
                    e.preventDefault();
                    searchSelectedIndex = Math.min(searchSelectedIndex + 1, items.length - 1);
                    updateDropdownHighlight(items);
                }
            } else if (e.key === "ArrowUp") {
                if (!dropdown.classList.contains("hidden") && items.length > 0) {
                    e.preventDefault();
                    searchSelectedIndex = Math.max(searchSelectedIndex - 1, -1);
                    updateDropdownHighlight(items);
                }
            } else if (e.key === "PageDown") {
                if (!dropdown.classList.contains("hidden") && items.length > 0) {
                    e.preventDefault();
                    searchSelectedIndex = searchSelectedIndex === -1 
                        ? Math.min(pageSize - 1, items.length - 1) 
                        : Math.min(searchSelectedIndex + pageSize, items.length - 1);
                    updateDropdownHighlight(items);
                }
            } else if (e.key === "PageUp") {
                if (!dropdown.classList.contains("hidden") && items.length > 0) {
                    e.preventDefault();
                    searchSelectedIndex = Math.max(searchSelectedIndex - pageSize, 0);
                    updateDropdownHighlight(items);
                }
            } else if (e.key === "Escape") {
                e.preventDefault();
                clearSearch();
            } else if (e.key === "Enter") {
                if (!dropdown.classList.contains("hidden") && searchSelectedIndex >= 0 && searchSelectedIndex < items.length) {
                    e.preventDefault();
                    items[searchSelectedIndex].click();
                } else {
                    e.preventDefault();
                    dropdown.classList.add("hidden");
                    
                    const isSidebarClosed = window.innerWidth < 1060 
                        ? sidebar.classList.contains("-translate-x-full") 
                        : sidebar.style.display === "none";
                    
                    if (isSidebarClosed) {
                        if (window.innerWidth < 1060) {
                            tocSidebar.classList.add("translate-x-full");
                            sidebar.classList.remove("-translate-x-full");
                        } else {
                            sidebar.style.display = "flex";
                            if (resizerLeft) resizerLeft.style.display = "flex";
                        }
                    }
                }
            }
        }
