<!DOCTYPE html>
<html class="h-[100dvh] overflow-hidden" lang="de">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" name="viewport">
    <title>Simple Game Solutions</title>
    <link rel="icon" type="res/img" href="favicon.gif">
    <meta property="og:title" content="Simple Game Solutions">
    <meta property="og:description" content="Discover and contribute to player-centric video game walkthroughs">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://amigamaster.github.io/Simple-Game-Solutions">
    <meta name="theme-color" content="#10b981">

    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .prose code::before {
            content: "" !important;
        }

        .prose code::after {
            content: "" !important;
        }

        .prose pre {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace !important;
            white-space: pre !important;
            word-break: normal !important;
            overflow-x: auto !important;
            background-color: #030712 !important;
            border: 1px solid #374151 !important;
            border-radius: 0.375rem !important;
            padding: 1rem !important;
        }

        .prose pre code {
            font-family: inherit !important;
            background-color: transparent !important;
            border: none !important;
            border-radius: 0 !important;
            padding: 0 !important;
            font-weight: normal !important;
            color: #a7f3d0 !important;
            box-shadow: none !important;
        }
    </style>
</head>

<body class="bg-gray-900 text-gray-100 h-[100dvh] w-screen overflow-hidden flex flex-col antialiased m-0 p-0">
    <header
        class="bg-gray-800 border-b border-gray-700 px-2 sm:px-4 py-2 sm:py-3 shadow-md flex justify-between items-center shrink-0 relative z-40 gap-1.5 sm:gap-2 w-full max-w-full">
        <div class="flex items-center gap-1.5 sm:gap-4 shrink-0">
            <button
                class="bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 sm:px-3 py-1.5 rounded-md text-xs sm:text-sm font-semibold transition-all flex items-center gap-1 shadow-lg cursor-pointer shrink-0"
                data-i18n-title="menuToggleTitle" onclick="toggleSidebar();"><span>📁</span> <span
                    data-i18n="menuBtn">Menü</span></button>
            <h1 class="text-sm sm:text-lg font-bold text-emerald-400 hidden md:block cursor-pointer hover:text-emerald-300 transition-colors" onclick="goHome();" title="Zur Startseite">🎮 Simple Game Solutions</h1>
        </div>
        <div class="relative flex-1 max-w-xs sm:max-w-sm mx-1 sm:mx-2 flex items-center min-w-[70px] sm:min-w-[120px]">
            <input autocomplete="off"
                class="w-full bg-gray-950 text-gray-200 border border-gray-700 rounded-md px-2.5 sm:px-3 py-1.5 pr-8 text-xs sm:text-sm focus:outline-none focus:border-emerald-500 placeholder-gray-500 transition-colors"
                data-i18n-placeholder="searchPlaceholder" id="searchInput" oninput="handleGlobalSearch(this.value);"
                onkeydown="handleSearchInputKeydown(event);" placeholder="Suchen..." type="text"> <button
                class="absolute right-2.5 text-gray-400 hover:text-white text-sm hidden focus:outline-none cursor-pointer"
                id="clearSearchBtn" onclick="clearSearch();" title="Suche löschen">✕</button>
        </div>
        <div class="absolute left-2 right-2 sm:left-6 sm:right-6 top-full mt-1 bg-gray-800 border border-gray-700 rounded-md shadow-2xl max-h-80 overflow-y-auto z-50 hidden"
            id="searchDropdown"></div>
        <div class="flex items-center gap-1.5 sm:gap-4 shrink-0">
            <select
                class="bg-gray-700 text-emerald-300 text-xs px-1.5 sm:px-2 py-1.5 rounded-md border border-gray-600 focus:outline-none cursor-pointer shrink-0"
                id="langSelect" onchange="changeLanguage(this.value);">
                <option value="de">
                    🇩🇪
                </option>
                <option value="en">
                    🇬🇧
                </option>
            </select>
            <button
                class="bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 sm:px-3 py-1.5 rounded-md text-xs sm:text-sm font-semibold transition-all flex items-center gap-1 shadow-lg cursor-pointer shrink-0"
                data-i18n-title="tocToggleTitle" onclick="toggleToc();"><span>📑</span> <span
                    data-i18n="tocBtn">Inhalt</span></button>
        </div>
    </header>
    <main class="flex-1 flex flex-row overflow-hidden p-1.5 sm:p-3 gap-1.5 sm:gap-2 relative w-full max-w-full">
        <aside
            class="fixed min-[1060px]:relative inset-y-0 left-0 w-72 min-[1060px]:w-[280px] bg-gray-800 border-r min-[1060px]:border border-gray-700 rounded-r-lg min-[1060px]:rounded-lg px-2 py-2 flex flex-col shrink-0 h-full overflow-hidden shadow-2xl min-[1060px]:shadow-lg z-30 transform -translate-x-full min-[1060px]:translate-x-0 transition-transform duration-200"
            id="sidebar">
            <div class="mb-2 border-b border-gray-700 pb-1.5 shrink-0 flex justify-between items-center">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-gray-400" data-i18n="directoriesTitle">
                    Verzeichnisse</h2><button
                    class="text-gray-400 hover:text-white text-xs px-2 py-1 rounded bg-gray-700 cursor-pointer"
                    data-i18n-title="close" onclick="toggleSidebar();">✕</button>
            </div>
            <div class="space-y-1 text-sm flex-1 overflow-y-auto pr-1" id="tree-container">
                <p class="text-gray-500 animate-pulse text-xs" data-i18n="loadingStructure">Lade Struktur...</p>
            </div>
        </aside>
        <div class="hidden min-[1060px]:flex w-2 bg-gray-800 hover:bg-emerald-500 cursor-ew-resize rounded transition-colors items-center justify-center group shrink-0"
            data-i18n-title="resizeWidth" id="resizer-left">
            <div class="h-8 w-0.5 bg-gray-600 group-hover:bg-gray-900 rounded-full"></div>
        </div>
        <section
            class="flex-1 bg-gray-800 border border-gray-700 rounded-lg px-2 pt-1 pb-2 sm:px-3 sm:pt-1 sm:pb-2 flex flex-col h-full overflow-hidden shadow-lg min-w-0 min-[1050px]:min-w-[450px] relative">
            <div class="absolute top-0 left-0 right-0 h-1 bg-gray-800 z-20">
                <div id="scrollProgressBar" class="h-full bg-emerald-500 transition-all duration-75" style="width: 0%;">
                </div>
            </div>
            <div id="readingPaneHeader" class="pt-1.5 pb-1 px-1 flex items-center gap-2 border-b border-gray-700/50 shrink-0 hidden">
                <div class="relative w-full">
                    <input autocomplete="off"
                        class="w-full bg-gray-950 text-gray-200 border border-gray-700 rounded-md px-2.5 py-1.5 pr-8 text-xs sm:text-sm focus:outline-none focus:border-emerald-500 placeholder-gray-500 transition-colors"
                        data-i18n-placeholder="filterPlaceholder" id="contentFilterInput" oninput="handleContentFilter(this.value);"
                        onkeydown="handleContentFilterKeydown(event);"
                        placeholder="Inhalt filtern..." type="text">
                    <button class="absolute right-2.5 top-2.5 text-gray-400 hover:text-white text-xs hidden focus:outline-none cursor-pointer"
                        id="clearContentFilterBtn" onclick="clearContentFilter();" title="Filter löschen">✕</button>
                </div>
            </div>
            <div class="prose prose-invert max-w-none flex-1 overflow-y-auto pr-2 pt-2 text-sm sm:text-base leading-relaxed prose-code:text-emerald-200/80 prose-code:bg-gray-800 prose-code:px-1.5 prose-code:py-0.5 prose-code:rounded prose-code:border prose-code:border-gray-700/40 prose-blockquote:border-emerald-500/30 prose-blockquote:bg-gray-800/40 prose-blockquote:text-gray-300/90"
                id="content-viewer">
                <div class="text-center text-gray-500 py-20">
                    <p class="text-base sm:text-lg" data-i18n="welcomeMessage">Wähle oben über die Suche oder links im Menü eine Lösung aus.</p>
                </div>
            </div>
        </section>
        <div class="hidden min-[650px]:flex w-2 bg-gray-800 hover:bg-emerald-500 cursor-ew-resize rounded transition-colors items-center justify-center group shrink-0"
            data-i18n-title="resizeWidth" id="resizer-right">
            <div class="h-8 w-0.5 bg-gray-600 group-hover:bg-gray-900 rounded-full"></div>
        </div>
        <aside
            class="fixed min-[650px]:relative inset-y-0 right-0 w-64 min-[650px]:w-[260px] bg-gray-800 border-l min-[650px]:border border-gray-700 rounded-l-lg min-[650px]:rounded-lg px-2 py-2 flex flex-col shrink-0 h-full overflow-hidden shadow-2xl min-[650px]:shadow-lg z-30 transform translate-x-full min-[650px]:translate-x-0 transition-transform duration-200"
            id="toc-sidebar">
            <div class="mb-2 border-b border-gray-700 pb-1.5 shrink-0 flex justify-between items-center">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-gray-400" data-i18n="chaptersTitle">
                    Kapitel</h2><button
                    class="text-gray-400 hover:text-white text-xs px-2 py-1 rounded bg-gray-700 cursor-pointer"
                    data-i18n-title="close" onclick="toggleToc();">✕</button>
            </div>
            <div class="space-y-1 text-sm flex-1 overflow-y-auto pr-1" id="toc-container">
                <p class="text-gray-500 italic text-xs" data-i18n="noFileLoaded">Keine Datei geladen.</p>
            </div>
        </aside>
    </main>
    <script>
        const translations = {
            de: {
                menuBtn: "Menü",
                menuToggleTitle: "Verzeichnisse ein-/ausblenden",
                subtitle: "Automatische Dokumentation",
                tocBtn: "Inhalt",
                tocToggleTitle: "Inhaltsverzeichnis ein-/ausblenden",
                directoriesTitle: "Verzeichnisse",
                chaptersTitle: "Kapitel",
                loadingStructure: "Lade Struktur...",
                welcomeMessage: "Wähle oben über die Suche oder links im Menü eine Lösung aus.",
                noFileLoaded: "Keine Datei geladen.",
                analyzing: "Analysiere Kapitel...",
                noHeadings: "Keine Kapitel gefunden.",
                loadingFile: "Lade Lösung...",
                fileNotFound: "Datei nicht gefunden",
                errorLoadingFile: "Fehler beim Laden der Datei:",
                errorLoadingStruct: "Fehler beim Laden der Struktur.",
                resizeWidth: "Breite anpassen",
                searchPlaceholder: "Suchen (z.B. Maniac AND Ostern OR 101)...",
                filterPlaceholder: "Inhalt filtern...",
                noResults: "Keine Treffer gefunden.",
                linkCopied: "Link kopiert"
            },
            en: {
                menuBtn: "Menu",
                menuToggleTitle: "Toggle directories",
                subtitle: "Automatic Documentation",
                tocBtn: "Content",
                tocToggleTitle: "Toggle table of contents",
                directoriesTitle: "Directories",
                chaptersTitle: "Chapters",
                loadingStructure: "Loading structure...",
                welcomeMessage: "Select a solution via search or menu.",
                noFileLoaded: "No file loaded.",
                analyzing: "Analyzing chapters...",
                noHeadings: "No chapters found.",
                loadingFile: "Loading solution.",
                fileNotFound: "File not found",
                errorLoadingFile: "Error loading file:",
                errorLoadingStruct: "Error loading structure.",
                resizeWidth: "Adjust width",
                searchPlaceholder: "Search (e.g. Maniac AND Ostern OR 101)...",
                filterPlaceholder: "Filter content...",
                noResults: "No matching files found.",
                linkCopied: "Link copied"
            }
        };

        function getBrowserLanguage() {
            const browserLang = navigator.language || navigator.userLanguage;
            if (browserLang && browserLang.startsWith("en")) {
                return "en"
            }
            return "de"
        }
        let currentLang = getBrowserLanguage();
        document.getElementById("langSelect").value = currentLang;

        function setLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll("[data-i18n]").forEach(el => {
                const key = el.getAttribute("data-i18n");
                if (translations[currentLang][key]) {
                    el.textContent = translations[currentLang][key]
                }
            });
            document.querySelectorAll("[data-i18n-title]").forEach(el => {
                const key = el.getAttribute("data-i18n-title");
                if (translations[currentLang][key]) {
                    el.setAttribute("title", translations[currentLang][key])
                }
            });
            document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
                const key = el.getAttribute("data-i18n-placeholder");
                if (translations[currentLang][key]) {
                    el.setAttribute("placeholder", translations[currentLang][key])
                }
            });
            if (!currentFilePath && structureData) {
                renderWelcomeScreen();
            }
        }

        function changeLanguage(lang) {
            setLanguage(lang);
            handleGlobalSearch(document.getElementById("searchInput").value)
        }
        let structureData = null;
        let currentFilePath = null;
        let rawFileContent = null;

        function countFileObjects(obj) {
            let count = 0;
            if (obj && typeof obj === 'object') {
                if (obj.type === 'file') {
                    count++;
                }
                for (let key in obj) {
                    count += countFileObjects(obj[key]);
                }
            }
            return count;
        }

        function renderWelcomeScreen() {
            if (!structureData) return;

            const readingHeader = document.getElementById("readingPaneHeader");
            if (readingHeader) readingHeader.classList.add("hidden");
            const filterInput = document.getElementById("contentFilterInput");
            if (filterInput) filterInput.value = "";
            document.getElementById("clearContentFilterBtn").classList.add("hidden");
            rawFileContent = null;

            const stats = structureData.stats || { total_files: countFileObjects(structureData), total_words: 0, total_actions: 0 };
            const fileCount = stats.total_files || countFileObjects(structureData);
            const wordCount = stats.total_words ? stats.total_words.toLocaleString(currentLang === 'de' ? 'de-DE' : 'en-US') : '0';
            const actionCount = stats.total_actions ? stats.total_actions.toLocaleString(currentLang === 'de' ? 'de-DE' : 'en-US') : '0';

            const welcomeText = currentLang === 'de'
                ? `Wähle oben über die Suche oder links im Menü eine Lösung aus. Aktuell umfasst die Sammlung ${fileCount} Lösungen mit insgesamt ${wordCount} Wörtern und ${actionCount} Aktionen.`
                : `Select a solution via search or menu. Currently the collection includes ${fileCount} walkthroughs with a total of ${wordCount} words and ${actionCount} actions.`;

            const allFiles = [];
            function collect(node) {
                if (!node) return;
                if (node.type === 'file') allFiles.push(node);
                else if (node.type === 'directory' && node.children) node.children.forEach(collect);
            }
            collect(structureData);

            allFiles.sort((a, b) => new Date(b.last_modified) - new Date(a.last_modified));
            const newest = allFiles.slice(0, 20);

            let listHtml = `<div class="max-w-3xl mx-auto py-8 px-4">
                <p class="text-base sm:text-lg text-center text-gray-300 mb-8" data-i18n="welcomeMessage">${welcomeText}</p>
                <h2 class="text-sm font-semibold uppercase tracking-wider text-emerald-400 mb-4 border-b border-gray-700 pb-2">${currentLang === 'de' ? '🔥 Die 20 zuletzt geänderten Lösungen' : '🔥 20 most recently updated solutions'}</h2>
                <div class="space-y-2">`;

            newest.forEach(file => {
                const dateStr = file.last_modified ? new Date(file.last_modified).toLocaleDateString(currentLang === 'de' ? 'de-DE' : 'en-US', { year: 'numeric', month: '2-digit', day: '2-digit' }) : '';
                listHtml += `<button onclick="loadFile('${file.path}')" class="w-full text-left bg-gray-800/80 hover:bg-gray-700 border border-gray-700/60 rounded-md px-4 py-2.5 text-xs sm:text-sm text-gray-200 hover:text-white transition-colors flex justify-between items-center group cursor-pointer">
                    <span class="flex items-center gap-2 font-medium truncate"><span class="text-emerald-400 group-hover:translate-x-1 transition-transform">📄</span> ${file.name}</span>
                    <span class="text-gray-400 text-xs shrink-0 ml-2">${dateStr}</span>
                </button>`;
            });

            listHtml += `</div></div>`;
            document.getElementById("content-viewer").innerHTML = listHtml;
        }

        function goHome() {
            currentFilePath = null;
            if (history.pushState) {
                history.pushState({}, '', window.location.pathname);
            }
            renderWelcomeScreen();
            const viewer = document.getElementById("content-viewer");
            if (viewer) viewer.scrollTop = 0;
            document.getElementById("toc-container").innerHTML = `<p class="text-gray-500 italic text-xs" data-i18n="noFileLoaded">${translations[currentLang].noFileLoaded}</p>`;
            if (document.getElementById("scrollProgressBar")) {
                document.getElementById("scrollProgressBar").style.width = "0%";
            }
        }

        async function init() {
            setLanguage(currentLang);
            try {
                const response = await fetch("structure.json");
                structureData = await response.json();

                renderTree(structureData, document.getElementById("tree-container"));

                const urlParams = new URLSearchParams(window.location.search);
                const fileParam = urlParams.get('file');
                if (fileParam) {
                    await loadFile(fileParam);
                    if (window.location.hash) {
                        setTimeout(() => {
                            const targetId = window.location.hash.substring(1);
                            const targetEl = document.getElementById(targetId);
                            if (targetEl) {
                                targetEl.scrollIntoView({ behavior: "smooth", block: "start" });
                            }
                        }, 300);
                    }
                } else {
                    renderWelcomeScreen();
                    const searchInput = document.getElementById("searchInput");
                    if (searchInput) searchInput.focus();
                }
            } catch (error) {
                console.error("Error loading structure:", error);
                document.getElementById("tree-container").innerHTML = `<p class="text-red-400 text-xs">${translations[currentLang].errorLoadingStruct}</p>`
            }
        }

        function matchQuery(nameLower, query) {
            const q = query.trim();
            if (!q) return true;
            const orClauses = q.toLowerCase().split(/\b(?:or|oder)\b/);
            return orClauses.some(clause => {
                const cleanClause = clause.replace(/\b(?:and|und)\b/g, " ");
                const terms = cleanClause.split(/\s+/).filter(t => t.length > 0);
                if (terms.length === 0) return false;
                return terms.every(term => nameLower.includes(term))
            })
        }

        function handleGlobalSearch(query) {
            const clearBtn = document.getElementById("clearSearchBtn");
            if (query.trim().length > 0) {
                clearBtn.classList.remove("hidden")
            } else {
                clearBtn.classList.add("hidden")
            }
            filterTree(query);
            const dropdown = document.getElementById("searchDropdown");
            const q = query.trim();
            if (!q || !structureData) {
                dropdown.innerHTML = "";
                dropdown.classList.add("hidden");
                return
            }
            const matchingFiles = [];

            function collectFiles(node) {
                if (!node) return;
                if (node.type === "file") {
                    if (matchQuery(node.name.toLowerCase(), q)) {
                        matchingFiles.push(node)
                    }
                } else if (node.type === "directory" && node.children) {
                    node.children.forEach(child => collectFiles(child))
                }
            }
            collectFiles(structureData);

            const qLower = q.toLowerCase();
            if (qLower === "4823" || qLower.includes("call edna") || qLower.includes("edna anrufen")) {
                matchingFiles.unshift({
                    name: "📞 Rufe Edna an...",
                    path: "https://www.maniac-mansion-mania.com",
                    isExternal: true
                });
            }

            if (matchingFiles.length === 0) {
                dropdown.innerHTML = `<div class="p-3 text-xs sm:text-sm text-gray-400 italic">${translations[currentLang].noResults}</div>`;
                dropdown.classList.remove("hidden");
                return
            }
            let html = "";
            matchingFiles.forEach((file, index) => {
                const icon = file.isExternal ? "🌐" : "📄";
                html += `<button type="button" onclick="selectSearchResult('${file.path}', ${file.isExternal ? 'true' : 'false'})" onkeydown="handleDropdownKeydown(event, ${index}, '${file.path}', ${file.isExternal ? 'true' : 'false'})" class="w-full text-left px-4 py-2.5 text-xs sm:text-sm text-gray-200 hover:bg-gray-700 hover:text-white focus:bg-gray-700 focus:text-white transition-colors border-b border-gray-700/50 last:border-b-0 flex items-center gap-2 cursor-pointer focus:outline-none">
                    <span>${icon}</span> <span class="font-medium">${file.name}</span>
                </button>`
            });
            dropdown.innerHTML = html;
            dropdown.classList.remove("hidden")
        }

        function handleSearchInputKeydown(e) {
            const dropdown = document.getElementById("searchDropdown");
            const items = dropdown.querySelectorAll("button");
            if (e.key === "ArrowDown" && !dropdown.classList.contains("hidden") && items.length > 0) {
                e.preventDefault();
                items[0].focus()
            } else if (e.key === "Escape") {
                e.preventDefault();
                clearSearch();
            }
        }

        function handleDropdownKeydown(e, index, path, isExternal = false) {
            const dropdown = document.getElementById("searchDropdown");
            const items = dropdown.querySelectorAll("button");
            if (e.key === "ArrowDown") {
                e.preventDefault();
                if (index + 1 < items.length) {
                    items[index + 1].focus()
                }
            } else if (e.key === "ArrowUp") {
                e.preventDefault();
                if (index > 0) {
                    items[index - 1].focus()
                } else {
                    document.getElementById("searchInput").focus()
                }
            } else if (e.key === "Enter") {
                e.preventDefault();
                selectSearchResult(path, isExternal)
            } else if (e.key === "Escape") {
                e.preventDefault();
                dropdown.classList.add("hidden");
                document.getElementById("searchInput").focus()
            }
        }

        function clearSearch() {
            const input = document.getElementById("searchInput");
            input.value = "";
            handleGlobalSearch("");
            document.getElementById("searchDropdown").classList.add("hidden");
            document.getElementById("clearSearchBtn").classList.add("hidden");
            
            setTimeout(() => {
                input.focus();
            }, 0);
        }

        function handleContentFilterKeydown(e) {
            if (e.key === "Escape") {
                e.preventDefault();
                clearContentFilter();
            }
        }

        function getDirectText(el) {
            const clone = el.cloneNode(true);
            clone.querySelectorAll("ul, ol").forEach(ul => ul.remove());
            return clone.textContent.replace(/\s+/g, ' ').trim();
        }

        function handleContentFilter(filterQuery) {
            const clearBtn = document.getElementById("clearContentFilterBtn");
            const q = filterQuery.trim().toLowerCase();
            if (q.length > 0) {
                clearBtn.classList.remove("hidden");
            } else {
                clearBtn.classList.add("hidden");
            }

            const viewer = document.getElementById("content-viewer");
            if (!viewer) return;

            const allBlocks = viewer.querySelectorAll("h1, h2, h3, h4, h5, h6, p, li, blockquote, table, pre");

            if (!q) {
                viewer.querySelectorAll("h1, h2, h3, h4, h5, h6, p, li, blockquote, table, pre, ul, ol, div").forEach(el => {
                    el.style.display = "";
                    el.classList.remove("cursor-pointer", "hover:bg-gray-700/40", "rounded", "px-1", "transition-colors", "bg-emerald-900/60");
                    el.onclick = null;
                    el.title = "";
                });
                return;
            }

            const matchingSet = new Set();
            allBlocks.forEach(el => {
                const text = el.tagName === 'LI' ? getDirectText(el) : el.textContent;
                if (text.toLowerCase().includes(q)) {
                    matchingSet.add(el);
                }
            });

            let currentHeading = null;
            const headingToMatchedBlocks = new Map();

            allBlocks.forEach(el => {
                if (/^H[1-7]$/.test(el.tagName)) {
                    currentHeading = el;
                } else {
                    if (currentHeading && matchingSet.has(el)) {
                        if (!headingToMatchedBlocks.has(currentHeading)) {
                            headingToMatchedBlocks.set(currentHeading, new Set());
                        }
                        headingToMatchedBlocks.get(currentHeading).add(el);
                    }
                }
            });

            const visibleElements = new Set();

            allBlocks.forEach(el => {
                if (/^H[1-7]$/.test(el.tagName)) {
                    if (matchingSet.has(el) || headingToMatchedBlocks.has(el)) {
                        visibleElements.add(el);
                    }
                } else {
                    if (matchingSet.has(el)) {
                        visibleElements.add(el);
                    }
                }
            });

            visibleElements.forEach(el => {
                let parent = el.parentElement;
                while (parent && parent !== viewer) {
                    visibleElements.add(parent);
                    parent = parent.parentElement;
                }
            });

            viewer.querySelectorAll("h1, h2, h3, h4, h5, h6, p, li, blockquote, table, pre, ul, ol, div").forEach(el => {
                if (visibleElements.has(el)) {
                    el.style.display = "";
                    const tag = el.tagName;
                    // Tabellen und Container bleiben unklickbar, aber p, li, pre, blockquote sowie Überschriften werden klickbar
                    if (tag !== 'TABLE' && tag !== 'UL' && tag !== 'OL' && tag !== 'DIV') {
                        el.classList.add("cursor-pointer", "hover:bg-gray-700/40", "rounded", "px-1", "transition-colors");
                        el.title = currentLang === "de" ? "Klicken, um zum Original im Text zu springen" : "Click to jump to original in text";
                        
                        el.onclick = (e) => {
                            if (e.target.closest('button')) return; // Kopier-Button in Überschriften ignorieren
                            e.stopPropagation();
                            const targetEl = el;
                            
                            clearContentFilter();

                            setTimeout(() => {
                                targetEl.scrollIntoView({ behavior: "smooth", block: "start" });
                                targetEl.classList.add("bg-emerald-900/60", "transition-colors", "duration-1000");
                                setTimeout(() => {
                                    targetEl.classList.remove("bg-emerald-900/60");
                                }, 1500);
                            }, 50);
                        };
                    }
                } else {
                    el.style.display = "none";
                    el.classList.remove("cursor-pointer", "hover:bg-gray-700/40", "rounded", "px-1", "transition-colors");
                    el.onclick = null;
                    el.title = "";
                }
            });
        }

        function clearContentFilter() {
            const input = document.getElementById("contentFilterInput");
            input.value = "";
            handleContentFilter("");
            document.getElementById("clearContentFilterBtn").classList.add("hidden");
            
            setTimeout(() => {
                input.focus();
            }, 0);
        }

        function renderFileContent(text, filePath) {
            const viewer = document.getElementById("content-viewer");
            const tocContainer = document.getElementById("toc-container");

            if (filePath.endsWith(".md")) {
                viewer.innerHTML = marked.parse(text);
            } else {
                viewer.innerHTML = `<pre class="whitespace-pre-wrap font-mono text-xs sm:text-sm bg-gray-950 p-4 rounded">${escapeHtml(text)}</pre>`;
            }
            postProcessViewer(viewer);
            generateToc(viewer, tocContainer);
            setupScrollSpy(viewer, tocContainer);
        }

        function postProcessViewer(viewer) {
            viewer.querySelectorAll("a").forEach(link => {
                link.setAttribute("target", "_blank");
                link.setAttribute("rel", "noopener noreferrer");
                link.className = "text-emerald-400 hover:underline";
            });
        }

        function selectSearchResult(path, isExternal = false) {
            if (isExternal) {
                window.open(path, '_blank', 'noopener,noreferrer');
            } else {
                loadFile(path);
            }
            document.getElementById("searchDropdown").classList.add("hidden");
            document.getElementById("searchInput").value = "";
            document.getElementById("clearSearchBtn").classList.add("hidden");
            filterTree("");
            if (window.innerWidth < 1060) {
                closeAllOverlays()
            }
        }
        window.addEventListener("click", e => {
            const searchContainer = document.getElementById("searchInput").parentElement;
            const dropdown = document.getElementById("searchDropdown");
            if (!searchContainer.contains(e.target) && !dropdown.contains(e.target)) {
                dropdown.classList.add("hidden")
            }
        });

        function renderTree(node, container, filterQuery = "") {
            container.innerHTML = "";
            const query = filterQuery.trim();

            function filterNode(item) {
                const nameLower = item.name.toLowerCase();
                const matches = matchQuery(nameLower, query);
                if (item.type === "file") {
                    return matches ? {
                        ...item
                    } : null
                } else if (item.type === "directory") {
                    const matchingChildren = (item.children || []).map(child => filterNode(child)).filter(child => child !== null);
                    if (matches || matchingChildren.length > 0) {
                        return {
                            ...item,
                            children: matchingChildren
                        }
                    }
                }
                return null
            }
            let displayNode = node;
            if (query !== "") {
                const filteredChildren = (node.children || []).map(child => filterNode(child)).filter(child => child !== null);
                if (filteredChildren.length === 0) {
                    container.innerHTML = `<p class="text-gray-500 italic text-xs py-2">${translations[currentLang].noResults}</p>`;
                    return
                }
                displayNode = {
                    ...node,
                    children: filteredChildren
                }
            }

            function buildNode(item, parentEl) {
                if (item.type === "directory") {
                    const details = document.createElement("details");
                    details.className = "ml-1 my-1";
                    details.open = query !== "";
                    const summary = document.createElement("summary");
                    summary.className = "cursor-pointer font-medium text-emerald-300 hover:text-emerald-200 py-1 px-2 rounded hover:bg-gray-700/50 select-none text-xs sm:text-sm break-words";
                    summary.textContent = `📁 ${item.name}`;
                    details.appendChild(summary);
                    const childrenContainer = document.createElement("div");
                    childrenContainer.className = "pl-3 border-l border-gray-700 ml-2 space-y-1 mt-1";
                    item.children = item.children || [];
                    item.children.forEach(child => buildNode(child, childrenContainer));
                    details.appendChild(childrenContainer);
                    parentEl.appendChild(details)
                } else if (item.type === "file") {
                    const fileLink = document.createElement("button");
                    fileLink.className = "block w-full text-left py-1.5 px-2 rounded hover:bg-gray-700 text-gray-300 hover:text-white transition-colors text-xs sm:text-sm break-words cursor-pointer";
                    fileLink.textContent = `📄 ${item.name}`;
                    fileLink.onclick = () => {
                        loadFile(item.path);
                        if (window.innerWidth < 1060) {
                            closeAllOverlays()
                        }
                    };
                    parentEl.appendChild(fileLink)
                }
            }
            if (displayNode.children) {
                displayNode.children.forEach(child => buildNode(child, container))
            }
        }

        function filterTree(query) {
            if (structureData) {
                renderTree(structureData, document.getElementById("tree-container"), query)
            }
        }

        async function loadFile(filePath) {
            currentFilePath = filePath;
            const viewer = document.getElementById("content-viewer");
            const tocContainer = document.getElementById("toc-container");
            const scrollProgressBar = document.getElementById("scrollProgressBar");
            const readingHeader = document.getElementById("readingPaneHeader");
            if (readingHeader) readingHeader.classList.remove("hidden");
            const filterInput = document.getElementById("contentFilterInput");
            if (filterInput) filterInput.value = "";
            document.getElementById("clearContentFilterBtn").classList.add("hidden");

            if (scrollProgressBar) scrollProgressBar.style.width = "0%";
            viewer.innerHTML = `<p class="text-gray-400 animate-pulse text-sm">${translations[currentLang].loadingFile}</p>`;
            tocContainer.innerHTML = `<p class="text-gray-500 italic text-xs">${translations[currentLang].analyzing}</p>`;
            try {
                const response = await fetch(`solutions/${filePath}`);
                if (!response.ok) throw new Error(translations[currentLang].fileNotFound);
                rawFileContent = await response.text();
                renderFileContent(rawFileContent, filePath);
                
                if (filterInput) {
                    setTimeout(() => {
                        filterInput.focus();
                    }, 0);
                }
            } catch (error) {
                rawFileContent = null;
                if (readingHeader) readingHeader.classList.add("hidden");
                viewer.innerHTML = `<p class="text-red-400 text-sm">${translations[currentLang].errorLoadingFile} ${filePath}</p>`;
                tocContainer.innerHTML = `<p class="text-red-400 text-xs">${translations[currentLang].noFileLoaded}</p>`
            }
        }

        function createCopyButton(headingId, isToc = false) {
            const copyBtn = document.createElement("button");
            copyBtn.className = `${isToc ? 'toc-copy-btn' : 'heading-copy-btn'} inline-flex items-center ${isToc ? 'ml-2' : 'mr-2'} opacity-70 sm:opacity-0 sm:group-hover${isToc ? '/toc' : ''}:opacity-100 transition-opacity text-emerald-400 hover:text-emerald-300 text-sm cursor-pointer focus:outline-none align-middle relative shrink-0`;
            copyBtn.title = currentLang === "de" ? "Kapitel-Link kopieren" : "Copy chapter link";

            const iconSpan = document.createElement("span");
            iconSpan.className = "inline-block w-6 text-center";
            iconSpan.textContent = "🔗";

            const popupSpan = document.createElement("span");
            if (isToc) {
                popupSpan.className = "absolute right-full mr-2 px-2 py-0.5 bg-gray-800 text-emerald-300 text-xs rounded shadow-lg whitespace-nowrap opacity-0 pointer-events-none border border-gray-700 z-50";
            } else {
                popupSpan.className = "absolute left-full ml-2 px-2 py-0.5 bg-gray-800 text-emerald-300 text-xs rounded shadow-lg whitespace-nowrap opacity-0 pointer-events-none border border-gray-700 z-50";
            }
            popupSpan.textContent = translations[currentLang].linkCopied;

            copyBtn.appendChild(iconSpan);
            copyBtn.appendChild(popupSpan);

            let copyTimeout = null;

            copyBtn.onclick = (e) => {
                e.stopPropagation();
                const baseUrl = window.location.href.split('?')[0].split('#')[0];
                const cleanUrl = `${baseUrl}?file=${encodeURIComponent(currentFilePath)}#${headingId}`;
                navigator.clipboard.writeText(cleanUrl).then(() => {
                    iconSpan.textContent = "✓";
                    popupSpan.textContent = translations[currentLang].linkCopied;

                    copyBtn.style.transition = 'none';
                    popupSpan.style.transition = 'none';
                    copyBtn.style.opacity = "1";
                    popupSpan.style.opacity = "1";

                    void popupSpan.offsetWidth;

                    if (copyTimeout) clearTimeout(copyTimeout);
                    copyTimeout = setTimeout(() => {
                        copyBtn.style.transition = 'opacity 500ms ease';
                        popupSpan.style.transition = 'opacity 500ms ease';
                        popupSpan.style.opacity = "0";
                        copyBtn.style.opacity = "0";

                        setTimeout(() => {
                            iconSpan.textContent = "🔗";
                            copyBtn.style.opacity = "";
                            copyBtn.style.transition = "";
                            popupSpan.style.transition = "";
                        }, 500);
                    }, 1500);
                });
            };
            return copyBtn;
        }

        function generateToc(contentViewer, tocContainer) {
            tocContainer.innerHTML = "";
            const headings = contentViewer.querySelectorAll("h1, h2, h3, h4, h5, h6, h7");
            if (headings.length === 0) {
                tocContainer.innerHTML = `<p class="text-gray-500 italic text-xs sm:text-sm">${translations[currentLang].noHeadings}</p>`;
                return
            }
            headings.forEach((heading, index) => {
                if (!heading.id) {
                    heading.id = `heading-${index}`
                }

                const originalText = heading.textContent;

                // Hauptbereich Überschriften-Button
                if (!heading.querySelector(".heading-copy-btn")) {
                    heading.classList.add("group", "relative");
                    const copyBtn = createCopyButton(heading.id, false);
                    heading.prepend(copyBtn);
                }

                // Rechtes Inhaltsverzeichnis Element
                let indentClass = "pl-1";
                if (heading.tagName === "H2") indentClass = "pl-2";
                if (heading.tagName === "H3") indentClass = "pl-4";
                if (heading.tagName === "H4") indentClass = "pl-6";
                if (heading.tagName === "H5") indentClass = "pl-8";
                if (heading.tagName === "H6") indentClass = "pl-10";
                if (heading.tagName === "H7") indentClass = "pl-12";

                const tocItem = document.createElement("div");
                tocItem.className = `flex items-start justify-between w-full py-1.5 px-2 rounded hover:bg-gray-700 text-gray-300 hover:text-emerald-300 transition-colors text-xs sm:text-sm break-words ${indentClass} group/toc relative`;

                const tocTextBtn = document.createElement("button");
                tocTextBtn.className = "flex-1 text-left bg-transparent border-none text-inherit text-xs sm:text-sm cursor-pointer break-words focus:outline-none";
                tocTextBtn.textContent = originalText;
                tocTextBtn.dataset.targetId = heading.id;
                tocTextBtn.onclick = () => {
                    heading.scrollIntoView({
                        behavior: "smooth",
                        block: "start"
                    });
                    if (window.innerWidth < 650) {
                        closeAllOverlays()
                    }
                };

                const tocCopyBtn = createCopyButton(heading.id, true);

                tocItem.appendChild(tocTextBtn);
                tocItem.appendChild(tocCopyBtn);
                tocContainer.appendChild(tocItem);
            })
        }

        function setupScrollSpy(contentViewer, tocContainer) {
            const scrollProgressBar = document.getElementById("scrollProgressBar");

            function updateScrollPosition() {
                const scrollTop = contentViewer.scrollTop;
                const scrollHeight = contentViewer.scrollHeight;
                const clientHeight = contentViewer.clientHeight;

                if (scrollProgressBar) {
                    const maxScroll = scrollHeight - clientHeight;
                    const percent = maxScroll > 0 ? Math.min(100, Math.max(0, (scrollTop / maxScroll) * 100)) : 0;
                    scrollProgressBar.style.width = percent + "%";
                }

                const headings = contentViewer.querySelectorAll("h1, h2, h3, h4, h5, h6, h7");
                const tocButtons = tocContainer.querySelectorAll("[data-target-id]");
                if (headings.length === 0 || tocButtons.length === 0) return;

                let lastActiveId = window._lastActiveId || null;
                let activeId = headings[0].id;

                if (scrollTop + clientHeight >= scrollHeight - 15) {
                    activeId = headings[headings.length - 1].id;
                } else {
                    for (let i = 0; i < headings.length; i++) {
                        const headingTop = headings[i].getBoundingClientRect().top - contentViewer.getBoundingClientRect().top + scrollTop;
                        if (scrollTop >= headingTop - 120) {
                            activeId = headings[i].id;
                        }
                    }
                }

                if (activeId !== lastActiveId) {
                    window._lastActiveId = activeId;
                    tocButtons.forEach(btn => {
                        if (btn.dataset.targetId === activeId) {
                            btn.scrollIntoView({ behavior: "smooth", block: "center" });
                        }
                    });
                }
            }

            contentViewer.onscroll = updateScrollPosition;
            updateScrollPosition();
        }

        function escapeHtml(text) {
            return text.replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
        }
        const sidebar = document.getElementById("sidebar");
        const tocSidebar = document.getElementById("toc-sidebar");
        const resizerLeft = document.getElementById("resizer-left");
        let isResizingLeft = false;
        resizerLeft.addEventListener("mousedown", e => {
            isResizingLeft = true;
            document.body.style.cursor = "ew-resize";
            e.preventDefault()
        });
        window.addEventListener("mousemove", e => {
            if (!isResizingLeft) return;
            const newWidth = e.clientX - sidebar.getBoundingClientRect().left;
            if (newWidth >= 180 && newWidth <= 600) {
                sidebar.style.width = `${newWidth}px`
            }
        });
        window.addEventListener("mouseup", () => {
            if (isResizingLeft) {
                isResizingLeft = false;
                document.body.style.cursor = "default"
            }
        });
        const resizerRight = document.getElementById("resizer-right");
        let isResizingRight = false;
        resizerRight.addEventListener("mousedown", e => {
            isResizingRight = true;
            document.body.style.cursor = "ew-resize";
            e.preventDefault()
        });
        window.addEventListener("mousemove", e => {
            if (!isResizingRight) return;
            const containerRight = document.querySelector("main").getBoundingClientRect().right;
            const calculatedWidth = containerRight - e.clientX;
            if (calculatedWidth >= 180 && calculatedWidth <= 450) {
                tocSidebar.style.width = `${calculatedWidth}px`
            }
        });
        window.addEventListener("mouseup", () => {
            if (isResizingRight) {
                isResizingRight = false;
                document.body.style.cursor = "default"
            }
        });

        function toggleSidebar() {
            if (window.innerWidth < 1060) {
                const isOpen = !sidebar.classList.contains("-translate-x-full");
                if (isOpen) {
                    closeAllOverlays()
                } else {
                    tocSidebar.classList.add("translate-x-full");
                    sidebar.classList.remove("-translate-x-full");
                }
            } else {
                const isHidden = sidebar.style.display === "none";
                sidebar.style.display = isHidden ? "flex" : "none";
                if (resizerLeft) resizerLeft.style.display = isHidden ? "flex" : "none"
            }
        }

        function toggleToc() {
            if (window.innerWidth < 650) {
                const isOpen = !tocSidebar.classList.contains("translate-x-full");
                if (isOpen) {
                    closeAllOverlays()
                } else {
                    sidebar.classList.add("-translate-x-full");
                    tocSidebar.classList.remove("translate-x-full");
                }
            } else {
                const isHidden = tocSidebar.style.display === "none";
                tocSidebar.style.display = isHidden ? "flex" : "none";
                if (resizerRight) resizerRight.style.display = isHidden ? "flex" : "none"
            }
        }

        function closeAllOverlays() {
            if (window.innerWidth < 1060) {
                sidebar.classList.add("-translate-x-full")
            }
            if (window.innerWidth < 650) {
                tocSidebar.classList.add("translate-x-full")
            }
        }
        closeAllOverlays();
        init();

    </script>
</body>
