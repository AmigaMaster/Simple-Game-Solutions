            allBlocks.forEach(el => {
                if (isHeading(el)) {
                    currentHeading = el;
                } else {
                    if (currentHeading && shownMatches.has(el)) {
                        if (!headingToMatchedBlocks.has(currentHeading)) {
                            headingToMatchedBlocks.set(currentHeading, new Set());
                        }
                        headingToMatchedBlocks.get(currentHeading).add(el);
                    }
                }
            });

            const visibleElements = new Set();

            allBlocks.forEach(el => {
                if (isHeading(el)) {
                    if (matchingSet.has(el) || (spoilerModel ? chapterHits.has(el) : headingToMatchedBlocks.has(el))) {
                        visibleElements.add(el);
                    }
                } else {
                    if (shownMatches.has(el)) {
                        visibleElements.add(el);
                    }
                }
            });

            visibleElements.forEach(el => {
                let parent = el.parentElement;
                while (parent && parent !== viewer) {
                    visibleElements.add(parent);
                    parent = parent.parentElement;
                }
            });

            viewer.querySelectorAll("h1, h2, h3, h4, h5, h6, p, li, blockquote, table, pre, ul, ol, div").forEach(el => {
                if (visibleElements.has(el)) {
                    el.style.display = "";
                    const tag = el.tagName;
                    if (tag !== 'TABLE' && tag !== 'UL' && tag !== 'OL' && tag !== 'DIV') {
                        el.classList.add("cursor-pointer", "hover:bg-gray-700/40", "rounded", "px-1", "transition-colors");
                        el.title = currentLang === "de" ? "Klicken, um zum Original im Text zu springen" : "Click to jump to original in text";
                        
                        // Apply term highlights to matching visible text blocks
                        applyHighlights(el, searchTerms);
                    }
                } else {
                    el.style.display = "none";
                    el.classList.remove("cursor-pointer", "hover:bg-gray-700/40", "rounded", "px-1", "transition-colors");
                    el.title = "";
                }
            });

            if (spoilerModel) {
                updateSearchChapterHeadings();
                updateSearchHitBar(hits.length, hits.filter(hit => searchRevealed.has(hit)).length);
            } else {
                hideSearchHitBar();
            }

            if (typeof viewer.onscroll === 'function') {
                viewer.onscroll();
            }
        }

        // A hit may contain further matching blocks (p inside li, p inside blockquote ...): they belong to it.
        // A list item does not cover its nested lists: those items are separate hits.
        function findCoveringHit(el, hitSet, root) {
            let insideList = false;
            for (let node = el.parentElement; node && node !== root; node = node.parentElement) {
                if (node.tagName === "UL" || node.tagName === "OL") insideList = true;
                if (hitSet.has(node) && !(node.tagName === "LI" && insideList)) return node;
            }
            return null;
        }

        function hideSearchHitBar() {
            const bar = document.getElementById("searchHitBar");
            if (bar) bar.classList.add("hidden");
        }

        function updateSearchHitBar(total, revealed) {
            const bar = document.getElementById("searchHitBar");
            if (!bar) return;
            bar.classList.toggle("hidden", !(spoilerModel && total > revealed));
            const count = document.getElementById("searchHitCount");
            if (count) count.textContent = `${revealed}/${total}`;
        }

        function updateSearchChapterHeadings() {
            const tr = translations[currentLang];
            searchChapterHits.forEach((hits, heading) => {
                const open = hits.some(hit => searchRevealed.has(hit));
                const chevron = heading.querySelector(".spoiler-chevron");
                if (chevron) chevron.textContent = open ? "▾" : "▸";
                heading.title = open ? tr.searchChapterCollapse : tr.searchChapterExpand;
            });
        }

        function rerunContentFilter() {
            const input = document.getElementById("contentFilterInput");
            if (input) handleContentFilter(input.value);
        }

        function revealNextSearchHit() {
            if (!spoilerModel) return;
            const next = searchHits.find(hit => !searchRevealed.has(hit));
            if (!next) return;
            searchRevealed.add(next);
            rerunContentFilter();
            requestAnimationFrame(() => scrollToRevealed(next, next, 1));
        }

        function revealAllSearchHits() {
            if (!spoilerModel) return;
            const fresh = searchHits.filter(hit => !searchRevealed.has(hit));
            if (fresh.length === 0) return;
            fresh.forEach(hit => searchRevealed.add(hit));
            rerunContentFilter();
            requestAnimationFrame(() => scrollToRevealed(fresh[0], fresh[fresh.length - 1], fresh.length));
        }

        function toggleSearchChapter(heading) {
            const hits = searchChapterHits.get(heading);
            if (!spoilerModel || !hits || hits.length === 0) return;
            const fresh = hits.filter(hit => !searchRevealed.has(hit));
            if (fresh.length > 0) {
                fresh.forEach(hit => searchRevealed.add(hit));
                rerunContentFilter();
                requestAnimationFrame(() => scrollToRevealed(fresh[0], fresh[fresh.length - 1], fresh.length));
            } else {
                hits.forEach(hit => searchRevealed.delete(hit));
                rerunContentFilter();
            }
        }

        function clearContentFilter() {
            const input = document.getElementById("contentFilterInput");
            input.value = "";
            handleContentFilter("");
            document.getElementById("clearContentFilterBtn").classList.add("hidden");
            
            const viewer = document.getElementById("content-viewer");
            if (viewer && typeof viewer.onscroll === 'function') {
                viewer.onscroll();
            }

            setTimeout(() => {
                if (isDesktopDevice()) input.focus();
            }, 0);
        }

        // --- SECTION 7: FILE & MARKDOWN CONTENT LOADING ---
        let loadToken = 0;

        // Shows an error message as plain text (never as HTML: the path may come from the URL)
        function showViewerError(viewer, message) {
            clearSpoilerModel();
            viewer.textContent = "";
            const p = document.createElement("p");
            p.className = "text-red-400 text-sm";
            p.textContent = message;
            viewer.appendChild(p);
        }

        // Encodes every path segment (file names may contain #, ?, %, ' ...)
        function encodeSolutionPath(filePath) {
            return "solutions/" + filePath.split("/").map(encodeURIComponent).join("/");
        }

        async function loadFile(filePath, isExternal = false, isHistoryNav = false) {
            // Only the most recent call may update the UI (prevents slow responses overwriting newer ones)
            const myToken = ++loadToken;
            closeGameStatusPopup();

            // CRITICAL TIMING FIX: If a filter is currently active, fully clear it first
            // so the cached scroll position is properly written back to the current file's localStorage before switching.
            const filterInput = document.getElementById("contentFilterInput");
            if (filterInput && filterInput.value.trim().length > 0) {
                clearContentFilter();
                // Await a brief animation frame to ensure DOM reflow and scroll restoration finish
                await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
                if (myToken !== loadToken) return;
            }

            const viewer = document.getElementById("content-viewer");
            const tocContainer = document.getElementById("toc-container");
            const scrollProgressBar = document.getElementById("scrollProgressBar");
            const readingHeader = document.getElementById("readingPaneHeader");

            // Unknown path (typo, deleted file, manipulated link): show error, remember nothing
            if (fileIndex.size > 0 && !fileIndex.has(filePath)) {
                currentFilePath = null;
                rawFileContent = null;
                isRestoringScroll = false;
                if (lsGet("sgs_last_file") === filePath) lsRemove("sgs_last_file");
                if (readingHeader) readingHeader.classList.add("hidden");
                if (scrollProgressBar) scrollProgressBar.style.width = "0%";
                showViewerError(viewer, `${translations[currentLang].errorLoadingFile} ${filePath}`);
                tocContainer.innerHTML = `<p class="text-red-400 text-xs">${translations[currentLang].noFileLoaded}</p>`;
                updateActiveFileInTree();
                applyTocForView();
                updateSpoilerButton();
                return;
            }

            isRestoringScroll = true;
            scrollPercentBeforeFilter = null; 
            const urlParams = new URLSearchParams(window.location.search);
            const scrollParam = urlParams.get('scroll');

            const rawSavedPercent = (isHistoryNav && scrollParam !== null) ? scrollParam : lsGet(`sgs_scroll_percent_${filePath}`);
            targetPercentToRestore = rawSavedPercent !== null ? parseFloat(rawSavedPercent) : null;

            currentFilePath = filePath;
            applyTocForView();

            if (!isHistoryNav && history.pushState) {
                const baseUrl = window.location.href.split('?')[0].split('#')[0];
                const cleanUrl = `${baseUrl}?file=${encodeURIComponent(filePath)}`;
                history.pushState({ file: filePath }, '', cleanUrl);
            }

            updateActiveFileInTree();

            // Dynamic SEO Updates for loaded solution files
            const cleanGameTitle = getCleanGameTitle();
            if (cleanGameTitle) {
                document.title = `${cleanGameTitle} - Walkthrough & Guide | Simple Game Solutions`;
                let metaDesc = document.querySelector('meta[name="description"]');
                if (metaDesc) {
                    metaDesc.setAttribute("content", `Comprehensive walkthrough, solutions, and hints for ${cleanGameTitle} on Simple Game Solutions.`);
                }
            }

            if (readingHeader) readingHeader.classList.remove("hidden");
            updateGameControls();
            if (filterInput) filterInput.value = "";
            document.getElementById("clearContentFilterBtn").classList.add("hidden");

            if (scrollProgressBar) scrollProgressBar.style.width = "0%";
            viewer.innerHTML = `<p class="text-gray-400 animate-pulse text-sm">${translations[currentLang].loadingFile}</p>`;
            tocContainer.innerHTML = `<p class="text-gray-500 italic text-xs">${translations[currentLang].analyzing}</p>`;
            try {
                const response = await fetch(encodeSolutionPath(filePath));
                if (myToken !== loadToken) return;
                if (!response.ok) throw new Error(translations[currentLang].fileNotFound);
                const text = await response.text();
                if (myToken !== loadToken) return;
                rawFileContent = text;
                renderFileContent(rawFileContent, filePath);

                // Remember the file only after it was loaded successfully
                lsSet("sgs_last_file", filePath);
                trackRecentFile(filePath);
                
                if (filterInput && isDesktopDevice()) {
                    setTimeout(() => {
                        filterInput.focus();
                    }, 0);
                }
            } catch (error) {
                if (myToken !== loadToken) return;
                rawFileContent = null;
                if (lsGet("sgs_last_file") === filePath) lsRemove("sgs_last_file");
                if (readingHeader) readingHeader.classList.add("hidden");
                showViewerError(viewer, `${translations[currentLang].errorLoadingFile} ${filePath}`);
                tocContainer.innerHTML = `<p class="text-red-400 text-xs">${translations[currentLang].noFileLoaded}</p>`;
                isRestoringScroll = false;
            }
        }

        // --- SPOILER PROTECTION: collapsible chapters ---
        // While active, only the headings are shown. Every heading that has content is a collapsible chapter:
        // opening it reveals the first action; more actions can be revealed one by one, three at a time or all at once.
        // Closing a chapter hides everything again, reopening starts at the first action again.
        // (title, version table, availability, general info) stays visible.
        const SPOILER_MODE_KEY = "sgs_spoiler_mode";
        lsRemove("sgs_spoiler_progress");
        const SPOILER_STATE_KEY = "sgs_spoiler_state";
        const SPOILER_STATE_MAX_SOLUTIONS = 80;
        let spoilerModel = null;

        let spoilerLatestStepIndex = -1;
        let spoilerLatestChapter = -1;

        function isSpoilerModeOn() {
            return lsGet(SPOILER_MODE_KEY) === "1";
        }

        // A chapter is "open" while revealed > 0 (number of visible actions)
        function buildSpoilerModel(viewer) {
            const children = Array.from(viewer.children);
            const start = children.findIndex(el => /^H[2-6]$/.test(el.tagName));
            if (start === -1) return null;

            const chapters = [];
            let current = null;
            for (let i = start; i < children.length; i++) {
                const el = children[i];
                if (/^H[1-6]$/.test(el.tagName)) {
                    current = { heading: el, steps: [], revealed: 0 };
                    chapters.push(current);
                } else if (el.tagName === "UL" || el.tagName === "OL") {
                    el.querySelectorAll("li").forEach(li => current.steps.push(li));
                } else {
                    current.steps.push(el);
                }
            }
            if (!chapters.some(chapter => chapter.steps.length > 0)) return null;
            return { path: null, chapters };
        }

        function clearSpoilerModel() {
            spoilerModel = null;
            spoilerBarForcedIndex = -1;
            spoilerLatestChapter = -1;
            spoilerLatestStepIndex = -1;
        }

        // Removes everything the spoiler protection added to the rendered document
        function clearSpoilerDecorations(viewer) {
            viewer.querySelectorAll(".spoiler-chevron, .spoiler-chapter-control").forEach(el => el.remove());
            viewer.querySelectorAll(".spoiler-hidden").forEach(el => el.classList.remove("spoiler-hidden"));
            viewer.querySelectorAll(".spoiler-latest").forEach(el => el.classList.remove("spoiler-latest"));
            viewer.querySelectorAll("[data-spoiler-count]").forEach(el => el.removeAttribute("data-spoiler-count"));
            viewer.querySelectorAll(".spoiler-heading").forEach(heading => {
                heading.classList.remove("spoiler-heading");
                ["data-spoiler-chapter", "role", "tabindex", "aria-expanded", "title"].forEach(attr => heading.removeAttribute(attr));
            });
        }

        // Restores which chapters were open and how many actions were revealed (per solution, by chapter ID)
        function loadSpoilerState(model) {
            const saved = readJsonObject(SPOILER_STATE_KEY)[model.path];
            if (!saved || typeof saved !== "object" || !saved.c || typeof saved.c !== "object") return;
            model.chapters.forEach(chapter => {
                const revealed = saved.c[chapter.heading.id];
                if (Number.isInteger(revealed) && revealed > 0) {
                    chapter.revealed = Math.min(chapter.steps.length, revealed);
                }
            });
        }

        // Remembers the open chapters of this solution. Closed chapters are not stored, so reopening one starts at its first action.
        function saveSpoilerState() {
            const m = spoilerModel;
            if (!m) return;
            const states = readJsonObject(SPOILER_STATE_KEY);
            const open = {};
            let anyOpen = false;
            m.chapters.forEach(chapter => {
                if (chapter.revealed > 0 && chapter.heading.id) {
                    open[chapter.heading.id] = chapter.revealed;
                    anyOpen = true;
                }
            });
            if (anyOpen) states[m.path] = { c: open, t: Date.now() };
            else delete states[m.path];
            const paths = Object.keys(states);
            if (paths.length > SPOILER_STATE_MAX_SOLUTIONS) {
                paths.sort((a, b) => ((states[b] && states[b].t) || 0) - ((states[a] && states[a].t) || 0))
                    .slice(SPOILER_STATE_MAX_SOLUTIONS)
                    .forEach(path => { delete states[path]; });
            }
            writeJson(SPOILER_STATE_KEY, states);
        }

        function setupSpoilerProtection(viewer, filePath) {
            clearSpoilerModel();
            clearSpoilerDecorations(viewer);
            updateSpoilerButton();
            if (!isSpoilerModeOn() || !filePath.endsWith(".md")) return;

            const model = buildSpoilerModel(viewer);
            if (!model) return;
            model.path = filePath;
            loadSpoilerState(model);

            // Headings with content become chapter toggles (chevron, keyboard access)
            model.chapters.forEach((chapter, index) => {
                if (chapter.steps.length === 0) return;
                const heading = chapter.heading;
                heading.classList.add("spoiler-heading");
                heading.setAttribute("data-spoiler-chapter", String(index));
                heading.setAttribute("role", "button");
                heading.setAttribute("tabindex", "0");
                const chevron = document.createElement("span");
                chevron.className = "spoiler-chevron";
                chevron.setAttribute("aria-hidden", "true");
                const copyButton = heading.querySelector(".heading-copy-btn");
                if (copyButton) copyButton.after(chevron); else heading.prepend(chevron);
            });

            spoilerModel = model;
            applySpoilerState();
        }

        // Shows exactly the revealed steps of open chapters, hides the rest
        function applySpoilerState() {
            const m = spoilerModel;
            if (!m) return;
            let latest = spoilerLatestChapter;
            if (!(latest >= 0 && m.chapters[latest] && (m.chapters[latest].revealed > 0 || m.chapters[latest].steps.length === 0))) {
                latest = -1;
                m.chapters.forEach((chapter, ci) => { if (chapter.revealed > 0) latest = ci; });
            }
            m.chapters.forEach((chapter, ci) => {
                chapter.heading.classList.toggle("spoiler-latest", ci === latest && chapter.steps.length === 0);
                chapter.steps.forEach((el, i) => {
                    el.classList.toggle("spoiler-hidden", i >= chapter.revealed);
                    const mark = spoilerLatestStepIndex >= 0 && spoilerLatestStepIndex < chapter.revealed ? spoilerLatestStepIndex : chapter.revealed - 1;
                    el.classList.toggle("spoiler-latest", ci === latest && i === mark);
                });
            });
            // Lists without any visible item disappear completely (deepest lists first)
            const viewer = document.getElementById("content-viewer");
            Array.from(viewer.querySelectorAll("ul, ol")).reverse().forEach(list => {
                const anyVisible = Array.from(list.children).some(child => !child.classList.contains("spoiler-hidden"));
                list.classList.toggle("spoiler-hidden", !anyVisible);
            });
            refreshSpoilerUi();
        }

        // Chevrons, tooltips and controls (also used after a language change)
        function refreshSpoilerUi() {
            updateChapterHeadings();
            renderChapterControls();
        }

        function updateChapterHeadings() {
            const m = spoilerModel;
            if (!m) return;
            const tr = translations[currentLang];
            m.chapters.forEach(chapter => {
                if (chapter.steps.length === 0) return;
                const open = chapter.revealed > 0;
                const chevron = chapter.heading.querySelector(".spoiler-chevron");
                if (chevron) chevron.textContent = open ? "▾" : "▸";
                chapter.heading.setAttribute("aria-expanded", String(open));
                // Action count only while the chapter is open
                if (open) {
                    const n = chapter.steps.length;
                    chapter.heading.setAttribute("data-spoiler-count", (n === 1 ? tr.spoilerCountOne : tr.spoilerCountMany).replace("{r}", String(chapter.revealed)).replace("{n}", String(n)));
                } else {
                    chapter.heading.removeAttribute("data-spoiler-count");
                }
                chapter.heading.title = open ? tr.spoilerCollapseTitle : tr.spoilerExpandTitle;
            });
        }

        function topLevelOf(viewer, el) {
            let node = el;
            while (node.parentElement && node.parentElement !== viewer) node = node.parentElement;
            return node;
        }

        function renderChapterControls() {
            updateSpoilerActionBar();
        }

        function pickSpoilerBarChapter() {
            const m = spoilerModel;
            if (!m) return null;
            // As long as no chapter is open, the bar stays hidden
            if (!m.chapters.some(chapter => chapter.revealed > 0)) return null;
            let current = spoilerBarForcedIndex;
            if (!(current >= 0 && current < m.chapters.length)) {
                current = -1;
                m.chapters.forEach((chapter, i) => { if (chapter.revealed > 0) current = i; });
            }
            const eligible = i => { const c = m.chapters[i]; return c.revealed >= 1 && c.revealed < c.steps.length; };
            if (current >= 0 && eligible(current)) return { index: current, mode: "reveal" };
            if (current >= 0) {
                const chapter = m.chapters[current];
                if (chapter.revealed >= chapter.steps.length) {
                    return { index: current, mode: nextSpoilerChapterIndex(current) >= 0 ? "chapter" : "finished" };
                }
            }
            // The chapter has nothing to continue with (e.g. it was just closed): nearest open chapter with hidden actions
            let best = -1, bestDist = Infinity;
            m.chapters.forEach((chapter, i) => {
                if (!eligible(i)) return;
                const d = Math.abs(i - Math.max(current, 0));
                if (d < bestDist) { best = i; bestDist = d; }
            });
            return best >= 0 ? { index: best, mode: "reveal" } : null;
        }

        // The next heading in document order (13 -> 13.1 -> 13.1.1 -> ... -> 14), also headings without steps of their own
        function nextSpoilerChapterIndex(index) {
            const m = spoilerModel;
            if (!m || index + 1 >= m.chapters.length) return -1;
            return index + 1;
        }

        // After "Next chapter" the target counts as the current chapter until the reader scrolls or taps
        // in the text themselves (the heading may be unable to reach the middle of the screen near the end)
        let spoilerBarForcedIndex = -1;

        // Opens the next chapter (first step) if it is still closed and brings it into view with minimal scrolling
        function goToNextSpoilerChapter(index) {
            const m = spoilerModel;
            const targetIndex = nextSpoilerChapterIndex(index);
            const target = m && m.chapters[targetIndex];
            if (!target) return;
            spoilerBarForcedIndex = targetIndex;
            if (target.steps.length > 0) {
                // Closed: show its first action. Already (partly or fully) open: nothing to reveal, but the
                // highlight still moves to this chapter's last revealed action.
                if (target.revealed === 0) target.revealed = 1;
                spoilerLatestChapter = targetIndex;
                spoilerLatestStepIndex = -1;
                afterSpoilerChange();
            } else {
                // Chapter without actions: highlight its heading
                spoilerLatestChapter = targetIndex;
                spoilerLatestStepIndex = -1;
                afterSpoilerChange();
            }
            // Scroll only as far as needed so that the highlighted line is completely visible
            // (heading included if it fits), exactly like revealing a normal next step
            const markEl = target.steps.length > 0 ? target.steps[target.revealed - 1] : target.heading;
            maybeCelebrateSpoilerEnd();
            requestAnimationFrame(() => scrollChapterTargetIntoView(target.heading, markEl));
            setTimeout(() => scrollHighlightIntoView(false), 500);
        }

        // --- End of the solution: congratulations with confetti and fireworks ---
        let spoilerCelebrated = false;

        function maybeCelebrateSpoilerEnd() {
            const pick = spoilerModel ? pickSpoilerBarChapter() : null;
            if (pick && pick.mode === "finished" && !spoilerCelebrated) {
                spoilerCelebrated = true;
                launchCelebration();
            }
        }

        function launchCelebration() {
            // With "reduce motion" enabled in the system the show is calmer (slow confetti only, no cannons / fireworks)
            // instead of being skipped completely
            if (!isCelebrationEnabled()) return;
            const calm = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
            if (document.getElementById("celebrationCanvas")) return;
            const canvas = document.createElement("canvas");
            canvas.id = "celebrationCanvas";
            canvas.setAttribute("aria-hidden", "true");
            canvas.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1100;";
            const dpr = Math.min(window.devicePixelRatio || 1, 1.5);   // fewer pixels to fill = cheaper frames
            const W = window.innerWidth, H = window.innerHeight;
            canvas.width = Math.round(W * dpr);
            canvas.height = Math.round(H * dpr);
            document.body.appendChild(canvas);
            const ctx = canvas.getContext("2d");
            ctx.scale(dpr, dpr);

            const rand = (a, b) => a + Math.random() * (b - a);
            const randInt = (a, b) => Math.floor(rand(a, b + 1));
            const choose = list => list[Math.floor(Math.random() * list.length)];
            const palette = ["#34d399", "#fbbf24", "#60a5fa", "#f472b6", "#f87171", "#a78bfa", "#ffffff", "#fb923c", "#22d3ee"];
            const randomColor = () => Math.random() < 0.6 ? choose(palette) : `hsl(${randInt(0, 359)}, ${randInt(70, 100)}%, ${randInt(52, 72)}%)`;
            const shapes = ["rect", "rect", "rect", "circle", "triangle", "star", "ribbon", "emoji", "label", "label"];
            const emojis = ["🎉", "⭐", "🎮", "🕹️", "🏆", "✨", "🎊", "👾", "💾", "📼", "🖥️", "💾"];
            const labels = ["Commodore", "C64", "AMIGA", "SCUMM", "AGI", "SCI", "Kickstart", "Workbench",
                "SID", "Paula", "Boing!", "READY.", "Press Play on Tape", "1541", "Guru Meditation"];
            const retroColors = ["#7c70da", "#a8a0ff", "#ff8800", "#0099ff", "#55ff55", "#55ffff", "#ff5555", "#ffff55", "#ffffff"];
            const particles = [];

            const confetti = (x, y, vx, vy) => {
                const shape = choose(shapes);
                particles.push({
                    kind: "confetti", shape, emoji: choose(emojis), x, y, vx, vy,
                    label: choose(labels), size: shape === "label" ? rand(11, 15) : rand(5, 12), rot: rand(0, 6.28), vr: rand(-0.25, 0.25),
                    sway: rand(0, 1.1), swayFreq: rand(0.04, 0.2), phase: rand(0, 6.28),
                    flip: rand(0.04, 0.28), flipPhase: rand(0, 6.28),
                    bounce: rand(0.45, 0.85), color: shape === "label" ? choose(retroColors) : randomColor(), life: 1, decay: rand(0.003, 0.009), g: rand(0.07, 0.17), drag: rand(0.985, 0.997), age: 0
                });
                // text labels keep a fixed random tilt: no spinning, no swaying, they just fall
                if (shape === "label") { const q = particles[particles.length - 1]; q.rot = rand(-0.4, 0.4); q.vr = 0; q.sway = 0; q.decay = rand(0.003, 0.006); }
            };

            const spark = (x, y, vx, vy, color, opts = {}) => particles.push(Object.assign({
                kind: "spark", x, y, vx, vy, color, size: rand(1.4, 3.2), life: 1, decay: rand(0.01, 0.022),
                g: 0.06, drag: 0.985, trail: [], crackle: false, bounce: rand(0.4, 0.75)
            }, opts));

            // Firework patterns, one is chosen at random per burst
            const patterns = {
                circle(x, y, S, c) {
                    const n = randInt(45, 90);
                    for (let i = 0; i < n; i++) { const t = rand(0, 6.283), v = S * rand(0.3, 1); spark(x, y, Math.cos(t) * v, Math.sin(t) * v, c); }
                },
                ring(x, y, S, c) {
                    const n = randInt(36, 70);
                    for (let i = 0; i < n; i++) { const t = (6.283 * i) / n; spark(x, y, Math.cos(t) * S, Math.sin(t) * S, c); }
                },
                doubleRing(x, y, S, c) {
                    const c2 = randomColor(), n = randInt(28, 48);
                    for (let i = 0; i < n; i++) {
                        const t = (6.283 * i) / n;
                        spark(x, y, Math.cos(t) * S, Math.sin(t) * S, c);
                        spark(x, y, Math.cos(t) * S * 0.55, Math.sin(t) * S * 0.55, c2);
                    }
                },
                star(x, y, S, c) {
                    const points = randInt(5, 7), n = randInt(70, 110);
                    for (let i = 0; i < n; i++) {
                        const t = (6.283 * i) / n, r = 0.55 + 0.45 * Math.abs(Math.cos((points * t) / 2));
                        spark(x, y, Math.cos(t) * S * r, Math.sin(t) * S * r, c, { drag: 0.98 });
                    }
                },
                heart(x, y, S, c) {
                    const n = randInt(50, 80);
                    for (let i = 0; i < n; i++) {
                        const t = (6.283 * i) / n;
                        const hx = 16 * Math.pow(Math.sin(t), 3);
                        const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
                        spark(x, y, (hx / 16) * S, (hy / 16) * S, c, { g: 0.045, drag: 0.982 });
                    }
                },
                willow(x, y, S, c) {
                    const n = randInt(45, 75);
                    for (let i = 0; i < n; i++) { const t = rand(0, 6.283), v = S * rand(0.4, 1); spark(x, y, Math.cos(t) * v, Math.sin(t) * v, "#fbbf24", { decay: rand(0.006, 0.01), g: 0.09, size: 1.6 }); }
                },
                crackle(x, y, S, c) {
                    const n = randInt(30, 55);
                    for (let i = 0; i < n; i++) { const t = rand(0, 6.283), v = S * rand(0.4, 1); spark(x, y, Math.cos(t) * v, Math.sin(t) * v, c, { crackle: true, decay: rand(0.01, 0.016) }); }
                }
            };
            const patternNames = Object.keys(patterns);
            const burst = (x, y) => patterns[choose(patternNames)](x, y, rand(3, 7), randomColor());

            // Random confetti cannons (left, right, both or from the bottom middle) with random counts and angles
            if (!calm) {
                const side = choose(["left", "right", "both", "both", "middle"]);
                const shoot = (x, dir) => {
                    const n = randInt(40, 90);
                    for (let i = 0; i < n; i++) {
                        const speed = rand(7, 18) * (W < 600 ? 0.75 : 1.2);
                        const angle = dir === 0 ? rand(-2.3, -0.85) : -Math.PI / 2 + dir * rand(0.15, 0.95);
                        confetti(x, H, Math.cos(angle) * speed * (dir === 0 ? 0.8 : 1) * (dir < 0 ? 1 : 1), Math.sin(angle) * speed);
                    }
                };
                if (side === "left" || side === "both") shoot(0, 1);
                if (side === "right" || side === "both") shoot(W, -1);
                if (side === "middle") shoot(W / 2, 0);
            }

            // Amiga "Boing Ball": red/white checkered sphere, bounces with a shadow on the floor
            const floorY = H - 110;
            const boing = () => {
                const depth = rand(0, 1);
                const r = rand(16, 40) * (W < 600 ? 0.85 : 1.1) * (1 - depth * 0.28);
                const floor = floorY - depth * 70;
                const startType = choose(["side", "side", "drop", "pop"]);
                const dir = Math.random() < 0.5 ? 1 : -1;
                const hop = calm ? rand(2.8, 4.4) : rand(8, 14);
                const ball = {
                    kind: "boing", r, floor, depth, hop, g: calm ? rand(0.06, 0.1) : rand(0.28, 0.38),
                    vx: dir * (calm ? rand(0.4, 1.3) : rand(1.2, 4.2)), vy: 0, spin: rand(0, 6.283),
                    spinV: rand(-0.04, 0.04), tilt: rand(-0.7, 0.25), lon: 16, lat: 8,
                    squash: 0, entered: false, age: 0, maxAge: calm ? rand(380, 470) : rand(380, 640), life: 1
                };
                if (startType === "side") { ball.x = dir > 0 ? -r : W + r; ball.y = rand(H * 0.05, floor - r * 3); }
                else if (startType === "drop") { ball.x = rand(W * 0.1, W * 0.9); ball.y = -r; ball.vx *= 0.4; ball.entered = true; }
                else { ball.x = rand(W * 0.1, W * 0.9); ball.y = floor - r; ball.vy = -hop * rand(0.9, 1.3); ball.vx *= 0.5; ball.entered = true; }
                particles.push(ball);
            };
            // sx / sy: squash (on impact) and stretch (in flight); the bottom of the ball stays where it is
            const drawBoing = (x, y, r, spin, alpha, tilt, lon, lat, sx, sy) => {
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.translate(x, y + r * (1 - sy));
                ctx.scale(sx, sy);
                ctx.beginPath();
                ctx.arc(0, 0, r, 0, Math.PI * 2);
                ctx.clip();
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(-r, -r, 2 * r, 2 * r);
                ctx.rotate(tilt);
                ctx.fillStyle = "#e0262d";
                const step = (Math.PI * 2) / lon;
                const wrap = t => ((t + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
                for (let i = 0; i < lon; i++) {
                    const t1 = wrap(spin + i * step), t2 = t1 + step;
                    const lo = Math.max(t1, -Math.PI / 2), hi = Math.min(t2, Math.PI / 2);
                    if (hi - lo < 0.002) continue;
                    for (let j = 0; j < lat; j++) {
                        if ((i + j) % 2) continue;
                        const f1 = -Math.PI / 2 + (j * Math.PI) / lat, f2 = f1 + Math.PI / lat;
                        ctx.beginPath();
                        const n = Math.max(5, Math.ceil((hi - lo) / 0.1)), m = Math.max(4, Math.ceil((f2 - f1) / 0.1));
                        for (let k = 0; k <= m; k++) { const f = f1 + ((f2 - f1) * k) / m; ctx.lineTo(r * Math.cos(f) * Math.sin(lo), r * Math.sin(f)); }
                        for (let k = 0; k <= n; k++) { const t = lo + ((hi - lo) * k) / n; ctx.lineTo(r * Math.cos(f2) * Math.sin(t), r * Math.sin(f2)); }
                        for (let k = m; k >= 0; k--) { const f = f1 + ((f2 - f1) * k) / m; ctx.lineTo(r * Math.cos(f) * Math.sin(hi), r * Math.sin(f)); }
                        for (let k = n; k >= 0; k--) { const t = lo + ((hi - lo) * k) / n; ctx.lineTo(r * Math.cos(f1) * Math.sin(t), r * Math.sin(f1)); }
                        ctx.closePath();
                        ctx.fill();
                    }
                }
                ctx.restore();
            };

            // A small retro "screen" pops up at a random place above the buttons; one of four styles per run
            const bannerType = choose(["c64", "amiga", "sierra", "lucas"]);
            // The pop-up window is solid: confetti, labels, emojis, sparks, bubbles and the Boing balls bounce off it
            const BW = Math.min(W - 24, 330), BH = bannerType === "amiga" ? 100 : 118;
            const BX = (W - BW) / 2, BY = Math.max(10, H - BH - 128);
            const bannerStart = calm ? 500 : 350, bannerEnd = bannerStart + 6000;
            const typed = (text, ms, cps) => text.slice(0, Math.max(0, Math.floor((ms / 1000) * cps)));
            function drawBanner(ms) {
                const fadeIn = Math.min(1, ms / 300), fadeOut = Math.min(1, (bannerEnd - bannerStart - ms) / 500);
                const alpha = Math.max(0, Math.min(fadeIn, fadeOut));
                if (alpha <= 0) return;
                const bw = BW, bh = BH, bx = BX, by = BY;
                const cursorOn = calm ? true : Math.floor(ms / 450) % 2 === 0;
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.font = "bold 12px 'Courier New', monospace";
                ctx.textBaseline = "top";
                ctx.textAlign = "left";
                if (bannerType === "c64") {
                    // Commodore 64: light blue border, blue screen, BASIC V2 prompt
                    ctx.fillStyle = "#7c70da"; ctx.fillRect(bx, by, bw, bh);
                    ctx.fillStyle = "#3e31a2"; ctx.fillRect(bx + 12, by + 12, bw - 24, bh - 24);
                    ctx.fillStyle = "#7c70da";
                    const lines = ["**** COMMODORE 64 BASIC V2 ****", "", "READY.", "RUN", "GAME COMPLETED!"];
                    let t = ms, y = by + 17, last = "";
                    for (const line of lines) {
                        const shown = typed(line, t, 22);
                        ctx.fillText(shown, bx + 18, y);
                        last = shown; y += 14;
                        t -= (line.length / 22) * 1000 + 250;
                        if (t < 0) { y -= 14; break; }
                    }
                    if (cursorOn) ctx.fillRect(bx + 18 + ctx.measureText(last).width + 2, y + 1, 8, 11);
                } else if (bannerType === "amiga") {
                    // Amiga Workbench style requester
                    ctx.fillStyle = "#ffffff"; ctx.fillRect(bx, by, bw, bh);
                    ctx.strokeStyle = "#000000"; ctx.lineWidth = 2; ctx.strokeRect(bx + 1, by + 1, bw - 2, bh - 2);
                    ctx.fillStyle = "#0055aa"; ctx.fillRect(bx + 2, by + 2, bw - 4, 20);
                    ctx.fillStyle = "#ffffff"; ctx.fillText("Workbench", bx + 10, by + 6);
                    ctx.fillStyle = "#000000"; ctx.fillText("Game completed successfully!", bx + 14, by + 38);
                    ctx.fillStyle = "#555555"; ctx.fillText("Kickstart says: well done.", bx + 14, by + 56);
                    ctx.fillStyle = "#ff8800"; ctx.fillRect(bx + bw - 64, by + bh - 30, 48, 20);
                    ctx.strokeStyle = "#000000"; ctx.lineWidth = 1.5; ctx.strokeRect(bx + bw - 64, by + bh - 30, 48, 20);
                    ctx.fillStyle = "#000000"; ctx.fillText("Ok", bx + bw - 50, by + bh - 26);
                } else if (bannerType === "sierra") {
                    // Sierra text adventure: white score bar, black screen, parser prompt
                    const score = Math.min(999, Math.floor(Math.max(0, ms - 300) / 1.2));
                    ctx.fillStyle = "#000000"; ctx.fillRect(bx, by, bw, bh);
                    ctx.fillStyle = "#ffffff"; ctx.fillRect(bx, by, bw, 18);
                    ctx.fillStyle = "#000000";
                    ctx.fillText("Score: " + score + " of 999", bx + 8, by + 3);
                    ctx.textAlign = "right"; ctx.fillText("Sound: on", bx + bw - 8, by + 3); ctx.textAlign = "left";
                    ctx.fillStyle = "#ffffff";
                    const cmd = "> " + typed("win game", Math.max(0, ms - 500), 9);
                    ctx.fillText(cmd, bx + 10, by + 34);
                    if (cursorOn && ms < 1700) ctx.fillText("_", bx + 10 + ctx.measureText(cmd).width, by + 34);
                    if (ms > 1700) {
                        ctx.fillStyle = "#55ffff";
                        ctx.fillText("Congratulations! You have", bx + 10, by + 58);
                        ctx.fillText("solved the game.", bx + 10, by + 74);
                    }
                } else {
                    // LucasArts SCUMM verb screen: sentence line plus nine verbs, one lights up after another
                    ctx.fillStyle = "#000000"; ctx.fillRect(bx, by, bw, bh);
                    ctx.fillStyle = "#55ffff";
                    ctx.fillText(typed("Use trophy with happy ending", ms, 20), bx + 10, by + 8);
                    const verbs = ["Open", "Close", "Give", "Pick up", "Look at", "Talk to", "Use", "Push", "Pull"];
                    const hot = Math.floor(ms / 380) % verbs.length;
                    verbs.forEach((v, i) => {
                        ctx.fillStyle = i === hot ? "#ffff55" : "#55ff55";
                        ctx.fillText(v, bx + 12 + (i % 3) * (bw / 3), by + 34 + Math.floor(i / 3) * 24);
                    });
                }
                ctx.restore();
            }

            // Fireworks at random times and places, sometimes two at once
            const bursts = [];
            if (!calm) {
                const count = randInt(5, 9);
                for (let i = 0; i < count; i++) {
                    const t = rand(150, 3400);
                    bursts.push(t);
                    if (Math.random() < 0.25) bursts.push(t + rand(30, 120));
                }
                bursts.sort((a, b) => a - b);
            }
            let nextBurst = 0;
            const boingTimes = [];
            for (let n = calm ? randInt(1, Math.random() < 0.4 ? 2 : 1) : randInt(1, 3), t = rand(200, 900); n > 0; n--, t += rand(300, 1500)) boingTimes.push(t);
            let nextBoing = 0;

            const showerEnd = calm ? rand(2400, 3800) : rand(2000, 3400);
            const showerRate = calm ? 1 : randInt(1, 3);
            const showerChance = calm ? rand(0.35, 0.9) : 0.8;
            const spawnEnd = calm ? showerEnd + 700 : showerEnd;
            // calm variant: a random gentle wind plus softly fading sparkles and floating bubbles at random places
            const wind = calm ? rand(-0.45, 0.45) : 0;
            const twinkleChance = rand(0.05, 0.16), bubbleChance = rand(0.02, 0.07);
            const twinkle = () => particles.push({
                kind: "twinkle", x: rand(W * 0.05, W * 0.95), y: rand(H * 0.05, H * 0.8), size: rand(5, 15),
                rot: rand(0, 3.14), vr: rand(-0.01, 0.01), color: randomColor(), age: 0, maxAge: rand(70, 170), life: 1
            });
            const bubble = () => {
                const rise = rand(0.3, 1.1);
                particles.push({
                    kind: "bubble", x: rand(0, W), y: H + 30, size: rand(6, 24), rise, riseBase: rise,
                    sway: rand(0.1, 0.6), swayFreq: rand(0.02, 0.06), phase: rand(0, 6.28), color: randomColor(),
                    age: 0, maxAge: rand(200, 400), life: 1
                });
            };
            const start = performance.now();
            let last = start;

            const drawStar = (r) => {
                ctx.beginPath();
                for (let i = 0; i < 10; i++) {
                    const rr = i % 2 === 0 ? r : r * 0.45, t = (Math.PI * i) / 5 - Math.PI / 2;
                    ctx.lineTo(Math.cos(t) * rr, Math.sin(t) * rr);
                }
                ctx.closePath();
                ctx.fill();
            };

            // Collision with the window: the window is solid while it is clearly visible (not while fading in / out)
            const windowSolid = elapsed => elapsed >= bannerStart + 150 && elapsed <= bannerEnd - 250;
            // Half size of a particle (labels are wide, emojis and stars bigger than the plain confetti pieces)
            const halfExtents = p => {
                if (p.kind === "spark") return [p.size, p.size];
                if (p.shape === "label") return [p.label.length * p.size * 0.3, p.size * 0.6];
                if (p.shape === "emoji") return [p.size, p.size];
                return [p.size * 0.65, p.size * 0.65];
            };
            // Pushes a particle out of the window along the shortest way and reflects its speed (p.vx / p.vy)
            const bounceOffWindow = p => {
                const [hx, hy] = halfExtents(p);
                const x0 = BX - hx, x1 = BX + BW + hx, y0 = BY - hy, y1 = BY + BH + hy;
                if (p.x <= x0 || p.x >= x1 || p.y <= y0 || p.y >= y1) return;
                const e = p.bounce || 0.6;
                const dl = p.x - x0, dr = x1 - p.x, dt = p.y - y0, db = y1 - p.y, m = Math.min(dl, dr, dt, db);
                if (m === dt) { p.y = y0; if (p.vy > 0) p.vy = -p.vy * e; p.vx *= 0.97; }          // lands on top
                else if (m === db) { p.y = y1; if (p.vy < 0) p.vy = -p.vy * e; }                     // hits the underside
                else if (m === dl) { p.x = x0; if (p.vx > 0) p.vx = -p.vx * e; }                     // left side
                else { p.x = x1; if (p.vx < 0) p.vx = -p.vx * e; }                                   // right side
            };
            // Boing ball (circle) against the window (rectangle)
            const bounceBallOffWindow = p => {
                const cx = Math.max(BX, Math.min(p.x, BX + BW)), cy = Math.max(BY, Math.min(p.y, BY + BH));
                let dx = p.x - cx, dy = p.y - cy, dist = Math.hypot(dx, dy), nx, ny;
                if (dist >= p.r) return;
                if (dist > 0.001) { nx = dx / dist; ny = dy / dist; p.x = cx + nx * p.r; p.y = cy + ny * p.r; }
                else {   // centre is inside the window: leave through the nearest side
                    const dl = p.x - BX, dr = BX + BW - p.x, dt = p.y - BY, db = BY + BH - p.y, m = Math.min(dl, dr, dt, db);
                    if (m === dt) { nx = 0; ny = -1; p.y = BY - p.r; }
                    else if (m === db) { nx = 0; ny = 1; p.y = BY + BH + p.r; }
                    else if (m === dl) { nx = -1; ny = 0; p.x = BX - p.r; }
                    else { nx = 1; ny = 0; p.x = BX + BW + p.r; }
                }
                const vn = p.vx * nx + p.vy * ny;
                if (vn >= 0) return;
                if (ny < -0.6) { p.vy = -p.hop * rand(0.78, 1.18); p.squash = 1; }                  // hops on top like on the floor
                else { p.vx -= 1.92 * vn * nx; p.vy -= 1.92 * vn * ny; p.squash = Math.max(p.squash, 0.6); }
                p.spinV = rand(-0.06, 0.06);
            };

            const FRAME_MS = 1000 / 30, FRAME_TOLERANCE = 4;
            function frame(now) {
                if (now - last < FRAME_MS - FRAME_TOLERANCE) { requestAnimationFrame(frame); return; }
                const dt = Math.min(now - last, 100) / 16.67;
                last = now;
                const elapsed = now - start;
                const solid = windowSolid(elapsed);
                const spawnRuns = Math.max(1, Math.round(dt));   // spawn rates were tuned per 60 Hz frame
                ctx.clearRect(0, 0, W, H);

                while (nextBoing < boingTimes.length && elapsed >= boingTimes[nextBoing]) { boing(); nextBoing++; }
                while (nextBurst < bursts.length && elapsed >= bursts[nextBurst]) {
                    burst(rand(W * 0.12, W * 0.88), rand(H * 0.12, H * 0.5));
                    nextBurst++;
                }
                if (calm && elapsed < spawnEnd) {
                    for (let r = 0; r < spawnRuns; r++) {
                        if (Math.random() < twinkleChance) twinkle();
                        if (Math.random() < bubbleChance) bubble();
                    }
                }
                if (elapsed < showerEnd) {
                    for (let i = 0; i < showerRate * spawnRuns; i++) {
                        if (Math.random() < showerChance) confetti(rand(0, W), -12, rand(-1.5, 1.5) * (calm ? 0.4 : 1), calm ? rand(0.5, 1.5) : rand(1, 3.2));
                    }
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    if (p.kind === "boing") {
                        p.age += dt;
                        if (p.age >= p.maxAge) { particles.splice(i, 1); continue; }
                        p.vy += p.g * dt;
                        p.x += p.vx * dt;
                        p.y += p.vy * dt;
                        if (solid) bounceBallOffWindow(p);
                        // bounce off the side edges once the ball has entered the screen
                        if (!p.entered && p.x > p.r && p.x < W - p.r) p.entered = true;
                        if (p.entered) {
                            if (p.x < p.r) { p.x = p.r; p.vx = Math.abs(p.vx); p.spinV = rand(-0.05, 0.05); }
                            else if (p.x > W - p.r) { p.x = W - p.r; p.vx = -Math.abs(p.vx); p.spinV = rand(-0.05, 0.05); }
                        } else if (p.x < -p.r * 4 || p.x > W + p.r * 4) { particles.splice(i, 1); continue; }
                        // every hop is a little different: height, spin direction, sometimes a big jump or a sideways kick
                        if (p.y > p.floor - p.r && p.vy > 0) {
                            p.y = p.floor - p.r;
                            p.vy = -p.hop * rand(0.78, 1.18) * (Math.random() < 0.12 ? 1.45 : 1);
                            p.squash = 1;
                            if (Math.random() < 0.5) p.spinV = rand(-0.06, 0.06);
                            if (Math.random() < 0.25) p.vx *= rand(0.6, 1.4) * (Math.random() < 0.15 ? -1 : 1);
                        }
                        p.spin += (p.vx * 0.02 + p.spinV) * dt;
                        p.squash = Math.max(0, p.squash - 0.09 * dt);
                        const stretch = Math.min(0.16, Math.abs(p.vy) * 0.011);
                        const sx = 1 + p.squash * 0.28 - stretch * 0.5, sy = 1 - p.squash * 0.22 + stretch;
                        const a = Math.min(1, p.age / 25, (p.maxAge - p.age) / 40);
                        const height = Math.max(0, p.floor - p.r - p.y);
                        ctx.globalAlpha = 0.3 * a * Math.max(0.15, 1 - height / (H * 0.6));
                        ctx.fillStyle = "#000000";
                        ctx.beginPath();
                        ctx.ellipse(p.x + p.r * 0.35, p.floor + 4, p.r * (0.95 - Math.min(0.4, height / 600)) * (1 + p.squash * 0.2), p.r * 0.2, 0, 0, Math.PI * 2);
                        ctx.fill();
                        drawBoing(p.x, p.y, p.r, p.spin, a, p.tilt, p.lon, p.lat, sx, sy);
                        ctx.globalAlpha = 1;
                        continue;
                    }
                    if (p.kind === "twinkle" || p.kind === "bubble") {
                        p.age += dt;
                        p.life = 1 - p.age / p.maxAge;
                        if (p.life <= 0) { particles.splice(i, 1); continue; }
                        const fade = Math.sin(Math.PI * p.life);   // soft fade in and out, no flashing
                        ctx.fillStyle = p.color;
                        ctx.strokeStyle = p.color;
                        if (p.kind === "bubble") {
                            p.y -= p.rise * dt;
                            p.x += Math.sin(p.age * p.swayFreq + p.phase) * p.sway * dt;
                            if (solid) {
                                const x0 = BX - p.size, x1 = BX + BW + p.size, y0 = BY - p.size, y1 = BY + BH + p.size;
                                if (p.x > x0 && p.x < x1 && p.y > y0 && p.y < y1) {
                                    const m = Math.min(p.x - x0, x1 - p.x, p.y - y0, y1 - p.y);
                                    if (m === y1 - p.y) { p.y = y1; p.rise = -Math.abs(p.rise) * 0.7; }
                                    else if (m === p.y - y0) { p.y = y0; p.rise = Math.abs(p.rise) * 0.7; }
                                    else if (m === p.x - x0) p.x = x0;
                                    else p.x = x1;
                                }
                            }
                            if (p.rise < p.riseBase) p.rise = Math.min(p.riseBase, p.rise + 0.02 * dt);
                            ctx.globalAlpha = 0.18 * fade;
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.globalAlpha = 0.55 * fade;
                            ctx.lineWidth = 1.5;
                            ctx.stroke();
                        } else {
                            p.rot += p.vr * dt;
                            ctx.globalAlpha = 0.9 * fade;
                            ctx.save();
                            ctx.translate(p.x, p.y);
                            ctx.rotate(p.rot);
                            ctx.beginPath();
                            for (let k = 0; k < 8; k++) {
                                const r = k % 2 === 0 ? p.size : p.size * 0.22, t = (Math.PI * k) / 4;
                                ctx.lineTo(Math.cos(t) * r, Math.sin(t) * r);
                            }
                            ctx.closePath();
                            ctx.fill();
                            ctx.restore();
                        }
                        continue;
                    }
                    p.vx *= Math.pow(p.drag, dt);
                    p.vy = p.vy * Math.pow(p.drag, dt) + p.g * dt;
                    if (p.kind === "confetti") {
                        p.age += dt;
                        p.x += (p.vx + wind + Math.sin(p.age * p.swayFreq * 6 + p.phase) * p.sway * 2) * dt;
                        p.rot += p.vr * dt;
                        p.flipPhase += p.flip * dt;
                    } else {
                        p.trail.push(p.x, p.y);
                        if (p.trail.length > 6) p.trail.splice(0, 2);
                        p.x += p.vx * dt;
                    }
                    p.y += p.vy * dt;
                    if (solid) bounceOffWindow(p);
                    p.life -= p.decay * dt;
                    if (p.kind === "spark" && p.crackle && !p.popped && p.life < 0.35) {
                        p.popped = true;
                        for (let k = 0; k < 3; k++) spark(p.x, p.y, rand(-1.5, 1.5), rand(-1.5, 1.5), "#ffffff", { size: 1.2, decay: rand(0.03, 0.05), g: 0.03 });
                    }
                    if (p.life <= 0 || p.y > H + 40 || p.x < -60 || p.x > W + 60) { particles.splice(i, 1); continue; }

                    ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.5));
                    ctx.fillStyle = p.color;
                    ctx.strokeStyle = p.color;
                    if (p.kind === "spark") {
                        if (p.trail.length >= 4) {
                            ctx.lineWidth = p.size * 0.7;
                            ctx.beginPath();
                            ctx.moveTo(p.trail[0], p.trail[1]);
                            for (let k = 2; k < p.trail.length; k += 2) ctx.lineTo(p.trail[k], p.trail[k + 1]);
                            ctx.lineTo(p.x, p.y);
                            ctx.stroke();
                        }
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                        continue;
                    }
                    ctx.save();
                    // labels are drawn on whole pixels so the text does not shimmer while it moves
                    if (p.shape === "label") ctx.translate(Math.round(p.x), Math.round(p.y)); else ctx.translate(p.x, p.y);
                    ctx.rotate(p.rot);
                    const flip = Math.cos(p.flipPhase);
                    if (p.shape === "rect") {
                        ctx.scale(1, flip);
                        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
                    } else if (p.shape === "circle") {
                        ctx.scale(1, Math.max(0.25, Math.abs(flip)));
                        ctx.beginPath();
                        ctx.arc(0, 0, p.size / 2.2, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (p.shape === "triangle") {
                        ctx.scale(1, flip);
                        ctx.beginPath();
                        ctx.moveTo(0, -p.size / 2);
                        ctx.lineTo(p.size / 2, p.size / 2);
                        ctx.lineTo(-p.size / 2, p.size / 2);
                        ctx.closePath();
                        ctx.fill();
                    } else if (p.shape === "star") {
                        ctx.scale(Math.max(0.3, Math.abs(flip)), 1);
                        drawStar(p.size * 0.65);
                    } else if (p.shape === "ribbon") {
                        ctx.lineWidth = 2.2;
                        ctx.lineCap = "round";
                        ctx.beginPath();
                        ctx.moveTo(-p.size, 0);
                        ctx.quadraticCurveTo(-p.size / 2, p.size * 0.9 * flip, 0, 0);
                        ctx.quadraticCurveTo(p.size / 2, -p.size * 0.9 * flip, p.size, 0);
                        ctx.stroke();
                    } else if (p.shape === "label") {
                        ctx.font = "bold " + Math.round(p.size) + "px 'Courier New', monospace";
                        ctx.textAlign = "center";
                        ctx.textBaseline = "middle";
                        ctx.lineWidth = 3;
                        ctx.strokeStyle = "rgba(0, 0, 0, 0.65)";
                        ctx.strokeText(p.label, 0, 0);
                        ctx.fillText(p.label, 0, 0);
                    } else {
                        ctx.font = Math.round(p.size * 2.1) + "px sans-serif";
                        ctx.textAlign = "center";
                        ctx.textBaseline = "middle";
                        ctx.fillText(p.emoji, 0, 0);
                    }
                    ctx.restore();
                }
                ctx.globalAlpha = 1;
                if (elapsed >= bannerStart && elapsed <= bannerEnd) drawBanner(elapsed - bannerStart);

                const spawningDone = elapsed >= Math.max(spawnEnd, bannerEnd) && nextBurst >= bursts.length && nextBoing >= boingTimes.length;
                if ((spawningDone && particles.length === 0) || elapsed > 12000) { canvas.remove(); return; }
                requestAnimationFrame(frame);
            }
            requestAnimationFrame(frame);
        }

        let spoilerBarKey = "";
        function updateSpoilerActionBar() {
            const bar = document.getElementById("spoilerActionBar");
            if (!bar) return;
            const viewer = document.getElementById("content-viewer");
            const m = spoilerModel;
            const active = !!(m && viewer && currentFilePath && m.path === currentFilePath && !viewer.classList.contains("spoiler-searching"));
            const pick = active ? pickSpoilerBarChapter() : null;
            if (!pick || pick.mode !== "finished") spoilerCelebrated = false;
            if (!pick) {
                bar.classList.add("hidden");
                spoilerBarKey = "";
                return;
            }
            const chapter = m.chapters[pick.index];
            const total = chapter.steps.length;
            bar.dataset.chapter = String(pick.index);
            const key = [pick.index, pick.mode, chapter.revealed, total, currentLang].join(":");
            if (key !== spoilerBarKey) {
                spoilerBarKey = key;
                const tr = translations[currentLang];
                const clone = chapter.heading.cloneNode(true);
                clone.querySelectorAll(".spoiler-chevron, .heading-copy-btn, button").forEach(el => el.remove());
                const title = clone.textContent.trim();
                const chapterMode = pick.mode === "chapter";
                const finished = pick.mode === "finished";
                const progress = chapterMode
                    ? tr.spoilerBarDone
                    : tr.spoilerBarProgress.replace("{n}", String(chapter.revealed)).replace("{total}", String(total));
                document.getElementById("spoilerActionInfo").textContent = finished
                    ? tr.spoilerFinishedInfo
                    : (title ? title + " · " + progress : progress);
                const nextBtn = document.getElementById("spoilerActionNext");
                nextBtn.dataset.spoilerAction = finished ? "finished" : (chapterMode ? "chapter" : "next");
                nextBtn.textContent = finished ? "🎉 " + tr.spoilerFinishedButton : "▼ " + (chapterMode ? tr.spoilerNextChapter : tr.spoilerNextStep);
                nextBtn.classList.toggle("bg-emerald-600", !finished);
                nextBtn.classList.toggle("hover:bg-emerald-500", !finished);
                nextBtn.classList.toggle("text-white", !finished);
                nextBtn.classList.toggle("bg-amber-500", finished);
                nextBtn.classList.toggle("hover:bg-amber-400", finished);
                nextBtn.classList.toggle("text-gray-900", finished);
                document.getElementById("spoilerActionNext3").textContent = tr.spoilerNext3;
                document.getElementById("spoilerActionRest").textContent = tr.spoilerRest;
                const manyLeft = !chapterMode && !finished && total - chapter.revealed > 1;
                document.getElementById("spoilerActionNext3").classList.toggle("hidden", !manyLeft);
                document.getElementById("spoilerActionRest").classList.toggle("hidden", !manyLeft);
            }
            bar.classList.remove("hidden");
        }

        function initSpoilerActionBar() {
            const bar = document.getElementById("spoilerActionBar");
            const viewer = document.getElementById("content-viewer");
            if (!bar || !viewer) return;
            bar.addEventListener("click", e => {
                const button = e.target.closest("button[data-spoiler-action]");
                if (button) spoilerChapterAction(Number(bar.dataset.chapter), button.dataset.spoilerAction);
            });
            // Clicking an already visible action (or a chapter heading without actions) makes it the current one:
            // the bar below then refers to its chapter and continues from there.
            viewer.addEventListener("click", e => {
                const m = spoilerModel;
                if (!m || viewer.classList.contains("spoiler-searching")) return;
                if (e.target.closest(".spoiler-heading")) return;   // headings with actions: see toggleSpoilerChapter
                let chapterIndex = -1, stepIndex = -1;
                m.chapters.forEach((chapter, ci) => chapter.steps.forEach((el, si) => {
                    if (si < chapter.revealed && el.contains(e.target)) { chapterIndex = ci; stepIndex = si; }   // innermost match wins
                }));
                if (chapterIndex < 0) {
                    const emptyIndex = m.chapters.findIndex(chapter => chapter.steps.length === 0 && chapter.heading.contains(e.target));
                    if (emptyIndex < 0) return;
                    chapterIndex = emptyIndex;
                }
                spoilerBarForcedIndex = chapterIndex;
                spoilerLatestChapter = chapterIndex;
                spoilerLatestStepIndex = stepIndex;
                applySpoilerState();
            });
        }

        function updateSpoilerButton() {
            const btn = document.getElementById("spoilerBtn");
            if (!btn) return;
            const on = isSpoilerModeOn();
            const tr = translations[currentLang];
            btn.title = on ? tr.spoilerOnTitle : tr.spoilerOffTitle;
            btn.setAttribute("aria-pressed", String(on));
            btn.classList.toggle("bg-emerald-600", on);
            btn.classList.toggle("border-emerald-500", on);
            btn.classList.toggle("text-white", on);
            btn.classList.toggle("[@media(hover:hover)]:hover:bg-emerald-500", on);
            btn.classList.toggle("bg-gray-950", !on);
            btn.classList.toggle("border-gray-700", !on);
            btn.classList.toggle("text-gray-400", !on);
            btn.classList.toggle("[@media(hover:hover)]:hover:bg-gray-700", !on);
            updateSpoilerBanner(on, tr);
            updateSpoilerActionBar();
        }

        function updateSpoilerBanner(on, tr) {
            const banner = document.getElementById("spoilerBanner");
            if (!banner) return;
            const onStartPage = !currentFilePath;
            banner.classList.toggle("hidden", !onStartPage);
            const base = "shrink-0 mt-1 mb-0.5 flex items-center justify-between gap-x-3 rounded-md border px-2.5 py-1 text-xs";
            const hidden = onStartPage ? "" : "hidden ";
            banner.className = hidden + base + (on ? " border-amber-600/60 bg-amber-900/30 text-amber-200" : " border-gray-600/70 bg-gray-800/60 text-gray-300");
            const label = document.getElementById("spoilerBannerLabel");
            if (label) label.textContent = on ? tr.spoilerBannerText : tr.spoilerBannerHint;
            const button = document.getElementById("spoilerBannerBtn");
            const buttonText = document.getElementById("spoilerBannerBtnText");
            if (buttonText) buttonText.textContent = on ? tr.spoilerBannerOff : tr.spoilerBannerOn;
            if (button) {
                button.title = on ? tr.spoilerBannerOffTitle : tr.spoilerOffTitle;
                button.className = "shrink-0 px-3 py-1.5 sm:px-2 sm:py-0.5 font-semibold rounded border whitespace-nowrap cursor-pointer transition-colors " + (on
                    ? "border-amber-500/70 text-amber-100 hover:bg-amber-800/50 hover:text-white"
                    : "border-emerald-500/70 text-emerald-200 hover:bg-emerald-700/40 hover:text-white");
            }
        }

        // An active text filter hides elements with inline styles: apply it again to the new state
        function afterSpoilerChange() {
            saveSpoilerState();
            applySpoilerState();
            const filterInput = document.getElementById("contentFilterInput");
            if (filterInput && filterInput.value.trim()) handleContentFilter(filterInput.value);
        }

        // Makes sure the highlighted line is completely inside the visible reading area
        function scrollHighlightIntoView(smooth) {
            const viewer = document.getElementById("content-viewer");
            const mark = viewer && viewer.querySelector(".spoiler-latest");
            if (!mark) return;
            const vr = viewer.getBoundingClientRect();
            const mr = mark.getBoundingClientRect();
            let delta = 0;
            if (mr.height > vr.height - 20) delta = mr.top - vr.top - 8;
            else if (mr.bottom > vr.bottom - 8) delta = mr.bottom - vr.bottom + 12;
            else if (mr.top < vr.top + 4) delta = mr.top - vr.top - 8;
            if (Math.abs(delta) >= 1) viewer.scrollBy({ top: delta, behavior: smooth ? "smooth" : "auto" });
        }

        // Scrolls to a chapter's highlighted line with the least movement; the heading is brought along when both fit
        function scrollChapterTargetIntoView(headingEl, markEl) {
            const viewer = document.getElementById("content-viewer");
            if (!viewer || !markEl) return;
            const vr = viewer.getBoundingClientRect();
            const mr = markEl.getBoundingClientRect();
            const hr = (headingEl || markEl).getBoundingClientRect();
            let delta = 0;
            if (mr.height > vr.height - 20) delta = mr.top - vr.top - 8;
            else if (mr.bottom > vr.bottom - 8) delta = mr.bottom - vr.bottom + 12;
            else if (mr.top < vr.top + 4) delta = mr.top - vr.top - 8;
            // heading above the visible area after that movement, but heading and line fit together: include the heading
            if (hr.top - delta < vr.top && (mr.bottom - hr.top) <= vr.height - 20) delta = hr.top - vr.top - 8;
            if (Math.abs(delta) >= 1) viewer.scrollBy({ top: delta, behavior: "smooth" });
        }

        // Brings newly revealed steps into view with the least possible movement
        function scrollToRevealed(firstEl, lastEl, count) {
            const viewer = document.getElementById("content-viewer");
            if (!viewer || !firstEl || !lastEl) return;
            const vr = viewer.getBoundingClientRect();
            const fr = firstEl.getBoundingClientRect();
            const lr = lastEl.getBoundingClientRect();
            let delta = 0;
            if (lr.bottom - fr.top > vr.height - 16) delta = fr.top - vr.top - 8;
            else if (lr.bottom > vr.bottom) delta = lr.bottom - vr.bottom + 12;
            else if (fr.top < vr.top) delta = fr.top - vr.top - 8;
            if (delta !== 0) viewer.scrollBy({ top: delta, behavior: "smooth" });
        }

        // The heading the reader is currently looking at: the first heading inside the visible area, otherwise
        // the heading of the chapter shown at the top edge. offset = distance from the top edge of the reading area.
        function findScrollAnchor(viewer) {
            const vr = viewer.getBoundingClientRect();
            let above = null;
            for (const heading of viewer.querySelectorAll(HEADING_SELECTOR)) {
                const r = heading.getBoundingClientRect();
                if (r.height === 0) continue;   // hidden (e.g. by the text filter)
                if (r.top >= vr.top && r.top < vr.bottom) return { heading, offset: r.top - vr.top };
                if (r.top < vr.top) above = heading;
            }
            return above ? { heading: above, offset: 8 } : null;
        }

        // Runs a change that alters the document height and keeps the reader at the same chapter
        function withStableScroll(viewer, change) {
            const anchor = findScrollAnchor(viewer);
            change();
            if (!anchor) return;
            const delta = anchor.heading.getBoundingClientRect().top - viewer.getBoundingClientRect().top - anchor.offset;
            if (delta !== 0) viewer.scrollTo({ top: viewer.scrollTop + delta, behavior: "instant" });
        }

        function toggleSpoilerChapter(index) {
            const m = spoilerModel;
            const chapter = m && m.chapters[index];
            if (!chapter || chapter.steps.length === 0) return;
            const opening = chapter.revealed === 0;
            chapter.revealed = opening ? 1 : 0;   // opening shows the first action; closing forgets the progress
            if (opening) spoilerLatestChapter = index;
            spoilerLatestStepIndex = -1;
            spoilerBarForcedIndex = index;
            afterSpoilerChange();
            maybeCelebrateSpoilerEnd();
            if (opening) {
                requestAnimationFrame(() => scrollToRevealed(chapter.steps[0], chapter.steps[0], 1));
                setTimeout(() => scrollHighlightIntoView(false), 500);
            }
        }

        function spoilerChapterAction(index, action) {
            const m = spoilerModel;
            const chapter = m && m.chapters[index];
            if (!chapter) return;
            if (action === "chapter") { goToNextSpoilerChapter(index); return; }
            if (action === "finished") { launchCelebration(); return; }
            if (chapter.revealed < 1) return;
            const before = chapter.revealed;
            const length = chapter.steps.length;
            if (action === "next") chapter.revealed = Math.min(length, chapter.revealed + 1);
            else if (action === "next3") chapter.revealed = Math.min(length, chapter.revealed + 3);
            else if (action === "rest") chapter.revealed = length;
            else return;
            if (chapter.revealed === before) return;
            spoilerLatestChapter = index;
            spoilerLatestStepIndex = -1;
            spoilerBarForcedIndex = index;
            const firstEl = chapter.steps[before];
            const lastEl = chapter.steps[chapter.revealed - 1];
            afterSpoilerChange();
            maybeCelebrateSpoilerEnd();
            requestAnimationFrame(() => scrollToRevealed(firstEl, lastEl, chapter.revealed - before));
            setTimeout(() => scrollHighlightIntoView(false), 500);
        }

        // Makes sure a step is visible (used when a search result inside a still closed chapter is opened):
        // opens the chapter just far enough to show it
        function revealSpoilerStep(el) {
            const m = spoilerModel;
            if (!m || !el) return;
            for (const chapter of m.chapters) {
                let index = chapter.steps.indexOf(el);
                if (index === -1) chapter.steps.forEach((step, i) => { if (step.contains(el)) index = i; });
                if (index === -1) continue;
                if (chapter.revealed <= index) {
                    chapter.revealed = index + 1;
                    spoilerLatestChapter = m.chapters.indexOf(chapter);
                    spoilerLatestStepIndex = -1;
                    spoilerBarForcedIndex = spoilerLatestChapter;
                    afterSpoilerChange();
                }
                return;
            }
        }

        function handleSpoilerKeydown(e) {
            if (e.key !== "Enter" && e.key !== " ") return;
            const heading = e.target.closest ? e.target.closest("[data-spoiler-chapter]") : null;
            if (!heading || e.target !== heading) return;
            e.preventDefault();
            const filterBox = document.getElementById("contentFilterInput");
            if (spoilerModel && filterBox && filterBox.value.trim()) {
                toggleSearchChapter(heading);
                return;
            }
            toggleSpoilerChapter(Number(heading.dataset.spoilerChapter));
        }

        // Turning the protection on or off keeps the reader at the chapter currently in view
        function showSpoilerOffConfirm() {
            if (document.getElementById("spoilerOffDialog")) return;
            const t = translations[currentLang];
            const previousFocus = document.activeElement;
            const overlay = document.createElement("div");
            overlay.id = "spoilerOffDialog";
            overlay.className = "fixed inset-0 z-[1000] flex items-center justify-center p-4 bg-black/60";
            overlay.innerHTML = `<div role="dialog" aria-modal="true" aria-labelledby="spoilerOffDialogTitle" aria-describedby="spoilerOffDialogText"
                    class="w-full max-w-sm rounded-xl border border-emerald-600/60 bg-gray-900 p-5 shadow-2xl">
                <h2 id="spoilerOffDialogTitle" class="text-base sm:text-lg font-bold text-white mb-2">🙈 ${escapeHtml(t.spoilerOffConfirmTitle)}</h2>
                <p id="spoilerOffDialogText" class="text-sm text-gray-300 mb-5">${escapeHtml(t.spoilerOffConfirmText)}</p>
                <div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-2">
                    <button type="button" data-act="cancel" class="px-4 py-3 sm:px-3 sm:py-2 rounded-md border border-gray-600 bg-gray-800 text-gray-100 text-base sm:text-sm font-semibold hover:bg-gray-700 cursor-pointer transition-colors">${escapeHtml(t.spoilerOffConfirmCancel)}</button>
                    <button type="button" data-act="confirm" class="px-4 py-3 sm:px-3 sm:py-2 rounded-md bg-emerald-600 text-white text-base sm:text-sm font-semibold hover:bg-emerald-500 cursor-pointer transition-colors">${escapeHtml(t.spoilerOffConfirmOk)}</button>
                </div>
            </div>`;
            const close = () => {
                overlay.remove();
                if (previousFocus && document.contains(previousFocus) && previousFocus.focus) previousFocus.focus();
            };
            overlay.addEventListener("click", e => {
                if (e.target === overlay) { close(); return; }
                const act = e.target.closest("[data-act]");
                if (!act) return;
                close();
                if (act.dataset.act === "confirm") toggleSpoilerMode(true);
            });
            overlay.addEventListener("keydown", e => {
                if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); close(); return; }
                if (e.key === "Tab") { // keep focus inside the dialog
                    const buttons = overlay.querySelectorAll("button");
                    const first = buttons[0], last = buttons[buttons.length - 1];
                    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
                    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
                }
            });
            document.body.appendChild(overlay);
            overlay.querySelector('[data-act="cancel"]').focus(); // safe default: keep the mode on
        }

        let spoilerToastTimer = null;
        function showSpoilerToast() {
            const t = translations[currentLang];
            let toast = document.getElementById("spoilerToast");
            if (!toast) {
                toast = document.createElement("div");
                toast.id = "spoilerToast";
                toast.setAttribute("role", "status");
                toast.setAttribute("aria-live", "polite");
                toast.className = "fixed left-1/2 -translate-x-1/2 z-[900] max-w-[90vw] px-4 py-2.5 rounded-full bg-emerald-600 text-white text-sm font-semibold text-center shadow-lg pointer-events-none transition-opacity duration-300 opacity-0";
                toast.style.bottom = "calc(env(safe-area-inset-bottom, 0px) + 1rem)";
                document.body.appendChild(toast);
            }
            toast.textContent = "🙈 " + t.spoilerToastOn;
            clearTimeout(spoilerToastTimer);
            requestAnimationFrame(() => { toast.classList.remove("opacity-0"); });
            spoilerToastTimer = setTimeout(() => { toast.classList.add("opacity-0"); }, 2500);
        }

        function toggleSpoilerMode(confirmed) {
            if (isSpoilerModeOn() && confirmed !== true) {
                showSpoilerOffConfirm();
                return;
            }
            if (isSpoilerModeOn()) lsRemove(SPOILER_MODE_KEY); else lsSet(SPOILER_MODE_KEY, "1");
            if (isSpoilerModeOn()) showSpoilerToast();
            const viewer = document.getElementById("content-viewer");
            if (!currentFilePath || rawFileContent === null || !viewer) {
                updateSpoilerButton();
                return;
            }
            withStableScroll(viewer, () => {
                setupSpoilerProtection(viewer, currentFilePath);
                resetSearchReveal();
